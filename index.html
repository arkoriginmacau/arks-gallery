  /* Turns every censored/"Hidden" thumbnail into a genuine low-res mosaic:
     draws the real photo onto a small canvas (cropped the same way
     object-fit:cover would crop it, so the mosaic lines up with the normal
     thumbnail framing), then swaps the <img> src for that tiny result. From
     that point on there is no higher-resolution copy left in the DOM for
     the browser to reveal — image-rendering:pixelated (in CSS) just keeps
     the upscale of that genuinely-tiny image blocky instead of smoothing it
     into a blur. BLOCKS picks how many mosaic cells span the image's longer
     side; higher = more recognizable, lower = more abstract. */
  var CENSOR_BLOCKS = 12;
  function pixelateCensoredThumbs(grid) {
    grid.querySelectorAll('img[data-pixelate="1"]').forEach(function (img) {
      if (img.__pixelateDone) return;
      function run() {
        if (img.__pixelateDone) return;
        img.__pixelateDone = true;
        try {
          var box = img.closest('.card-image');
          var boxRatio = (box && box.clientWidth && box.clientHeight) ? (box.clientWidth / box.clientHeight) : (4 / 3);
          var bW = boxRatio >= 1 ? CENSOR_BLOCKS : Math.max(1, Math.round(CENSOR_BLOCKS * boxRatio));
          var bH = boxRatio >= 1 ? Math.max(1, Math.round(CENSOR_BLOCKS / boxRatio)) : CENSOR_BLOCKS;
          var sw = img.naturalWidth, sh = img.naturalHeight;
          if (!sw || !sh) return; // broken image — leave as-is rather than throw
          var srcRatio = sw / sh, cropW = sw, cropH = sh, sx = 0, sy = 0;
          if (srcRatio > boxRatio) { cropW = sh * boxRatio; sx = (sw - cropW) / 2; }
          else { cropH = sw / boxRatio; sy = (sh - cropH) / 2; }
          var c = document.createElement('canvas');
          c.width = bW; c.height = bH;
          var ctx = c.getContext('2d');
          ctx.drawImage(img, sx, sy, cropW, cropH, 0, 0, bW, bH);
          img.src = c.toDataURL('image/png');
          img.removeAttribute('crossorigin');
        } catch (e) {
          // Most likely a CORS-tainted canvas on some future image host.
          // Leave the plain (unpixelated) <img> up rather than crash the
          // grid — not ideal, but the no-zoom guard for "Hidden" pieces and
          // the fact this is a grid-view convenience, not a security
          // boundary, mean failing open here is the lesser problem.
        }
      }
      if (img.complete && img.naturalWidth) run(); else img.addEventListener('load', run, { once: true });
    });
  }
  function bindGridEvents() {
    var grid = document.getElementById('grid');
    if (!grid) return;
    pixelateCensoredThumbs(grid);
    updateDescToggles(grid);
    if (!grid.__descWired) {
      grid.__descWired = true;
      grid.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('[data-desc-toggle]') : null;
        if (!btn) return;
        e.stopPropagation();
        var desc = btn.previousElementSibling;
        var open = !desc.classList.contains('expanded');
        desc.classList.toggle('expanded', open);
        if (open) state.descOpen[btn.getAttribute('data-desc-toggle')] = true;
        else delete state.descOpen[btn.getAttribute('data-desc-toggle')];
        updateDescToggles(grid);
      });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { updateDescToggles(document.getElementById('grid')); });
    }
    grid.querySelectorAll('[data-toggle-sold]').forEach(function (el) {
      el.addEventListener('click', function () { toggleSold(el.getAttribute('data-toggle-sold')); });
    });
    grid.querySelectorAll('[data-toggle-nfs]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation(); // sits inside the card-image lightbox trigger
        toggleNotForSale(el.getAttribute('data-toggle-nfs'));
      });
    });
    grid.querySelectorAll('[data-edit-painting]').forEach(function (el) {
      el.addEventListener('click', function () { openPaintingModal(el.getAttribute('data-edit-painting')); });
    });
    grid.querySelectorAll('[data-del-painting]').forEach(function (el) {
      el.addEventListener('click', function () { confirmDelete(el); });
    });
    grid.querySelectorAll('[data-assign-set]').forEach(function (el) {
      el.addEventListener('click', function () { openSetPrompt(el.getAttribute('data-assign-set')); });
    });
    grid.querySelectorAll('[data-toggle-censor]').forEach(function (el) {
      el.addEventListener('click', function () { toggleCensored(el.getAttribute('data-toggle-censor')); });
    });
    setupThumbMove(grid);
    grid.querySelectorAll('[data-view-set]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation(); // sits inside the card-image lightbox trigger
        openSetModal(el.getAttribute('data-view-set'));
      });
    });
    grid.querySelectorAll('[data-lightbox]').forEach(function (el) {
      el.addEventListener('click', function () {
        var src = el.getAttribute('data-lightbox');
        /* When embedded in someone else's page (e.g. the Wix site), this app
           only occupies whatever box the host page gave its iframe — often
           much smaller than the visitor's actual screen, and we have no way
           to resize a cross-origin host's iframe from in here. A "fullscreen"
           overlay confined to that small box just looks like a cropped,
           broken zoom. Opening the photo in its own browser tab sidesteps
           the whole problem: the browser's native image view always shows
           the complete picture, however the visitor zooms. */
        if (isEmbedded) { window.open(src, '_blank', 'noopener'); return; }
        openLightbox(src, el);
      });
    });
    wireInlineEdit(grid);
  }

  /* ---------------- inline (double-click) field editing ----------------
     A quicker alternative to the full "Edit" modal for touching up one
     field at a time — double-click Name/Number/Date/Size/Description
     right on the card, type the new value, then Enter/blur to save (Esc
     to back out). Only the elements the render carries data-inline-field
     on exist at all (admin, real saved piece, no PDF-import preview open
     — see canInlineEdit in renderGrid), so this only needs to wire them. */
  function wireInlineEdit(grid) {
    grid.querySelectorAll('[data-inline-field]').forEach(function (el) {
      el.addEventListener('dblclick', function () {
        beginInlineEdit(el, el.getAttribute('data-inline-pid'), el.getAttribute('data-inline-field'));
      });
    });
  }

  function beginInlineEdit(fieldEl, id, field) {
    if (fieldEl.querySelector('.inline-edit-input')) return; // already editing
    var p = state.paintings.find(function (x) { return x.id === id; });
    if (!p) return;
    var tab = tabById(p.tab_id);
    var isYearOnlyTab = !!(tab && !tab.prefix);
    var isMultiline = field === 'description';
    var raw;
    if (field === 'number') raw = p.number || '';
    else if (field === 'date') raw = p.date ? (isYearOnlyTab ? String(p.date).slice(0, 4) : String(p.date).slice(0, 10)) : '';
    else if (field === 'size') raw = p.size || '';
    else if (field === 'description') raw = p.description || '';
    else raw = p.name || '';

    var input = document.createElement(isMultiline ? 'textarea' : 'input');
    input.className = 'inline-edit-input';
    var isFullDate = field === 'date' && !isYearOnlyTab;
    if (!isMultiline) input.type = (field === 'date' ? (isYearOnlyTab ? 'number' : 'text') : 'text');
    if (field === 'date' && isYearOnlyTab) { input.min = '1000'; input.max = '9999'; input.step = '1'; }
    /* The native <input type="date"> picker used to sit here, but its
       year segment doesn't reliably hand off to month after 4 digits —
       Chromium keeps accepting more (a "202626" year is what tipped this
       off) since it stays open to a 6-digit year per the HTML date spec.
       A plain digits-only text field with a hand-rolled YYYY-MM-DD mask
       sidesteps that entirely: reformatDateInput below caps the year at
       exactly 4 digits before it inserts the next dash, so typing never
       drifts into a slot it shouldn't. */
    if (isFullDate) { input.inputMode = 'numeric'; input.placeholder = 'YYYY-MM-DD'; input.maxLength = 10; }
    if (isMultiline) input.rows = 3;
    input.value = raw;
    fieldEl.innerHTML = '';
    fieldEl.appendChild(input);
    input.focus();
    if (input.select) input.select();
    if (isFullDate) input.addEventListener('input', function () { reformatDateInput(input); });

    var settled = false;
    function commit() {
      if (settled) return;
      settled = true;
      saveInlineField(id, field, input.value.trim(), isYearOnlyTab);
    }
    function cancel() {
      if (settled) return;
      settled = true;
      renderAll(); // no state change — just redraw to drop the temp input
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      else if (e.key === 'Enter' && (!isMultiline || e.metaKey || e.ctrlKey)) { e.preventDefault(); input.blur(); }
    });
  }

  /* Reformats a date field's raw typing into YYYY-MM-DD as-you-go: strip
     everything but digits, cap at 8 of them (4 year + 2 month + 2 day),
     and drop the dashes back in after the 4th and 6th digit. Always
     rewrites the whole value from the digits rather than patching around
     the cursor — simple, and correct for the overwhelmingly common case
     of typing left-to-right; a caret parked mid-value and used to insert
     digits will jump to the end, same trade-off most masked-input fields
     make. */
  function reformatDateInput(input) {
    var digits = input.value.replace(/\D/g, '').slice(0, 8);
    var out = digits.slice(0, 4);
    if (digits.length > 4) out += '-' + digits.slice(4, 6);
    if (digits.length > 6) out += '-' + digits.slice(6, 8);
    input.value = out;
  }

  async function saveInlineField(id, field, newRaw, isYearOnlyTab) {
    var p = state.paintings.find(function (x) { return x.id === id; });
    if (!p) return;
    var newValue;
    if (field === 'date') {
      if (isYearOnlyTab) {
        newValue = /^\d{4}$/.test(newRaw) ? (newRaw + '-01-01') : null;
      } else if (!newRaw) {
        newValue = null;
      } else if (/^\d{4}-\d{2}-\d{2}$/.test(newRaw) && !isNaN(new Date(newRaw + 'T00:00:00').getTime())) {
        newValue = newRaw;
      } else {
        renderAll();
        toast('That date looks incomplete — try YYYY-MM-DD.');
        return;
      }
    } else {
      newValue = newRaw;
    }
    var prevValue = p[field];
    if (newValue === (prevValue || (field === 'date' ? null : ''))) { renderAll(); return; } // unchanged
    p[field] = newValue; renderAll(); // optimistic
    var data = {}; data[field] = newValue;
    var res = await sb.from('paintings').update(data).eq('id', id);
    if (res.error) { p[field] = prevValue; renderAll(); toast('Could not save — try again.'); }
  }

  /* ---------------- lightbox (full-size view, never affects card layout) ---------------- */
  function lightboxEscHandler(e) { if (e.key === 'Escape') closeLightbox(); }
  /* Mobile browsers (iOS Safari in particular) keep a "fixed" element pinned
     to the layout viewport, not the visual one — so once the page is pinch-
     zoomed, a plain position:fixed;inset:0 overlay drifts out of alignment
     and only part of it (and so only part of the painting) stays on screen.
     Actively sizing/positioning the backdrop from window.visualViewport
     keeps it exactly matching whatever is actually visible, at any zoom
     level, on any device. */
  function syncLightboxToViewport() {
    var backdrop = document.getElementById('lbBackdrop');
    if (!backdrop) return;
    var vv = window.visualViewport;
    if (vv) {
      backdrop.style.width = vv.width + 'px';
      backdrop.style.height = vv.height + 'px';
      backdrop.style.left = vv.offsetLeft + 'px';
      backdrop.style.top = vv.offsetTop + 'px';
    } else {
      backdrop.style.width = '100%'; backdrop.style.height = '100%';
      backdrop.style.left = '0'; backdrop.style.top = '0';
    }
  }
  function openLightbox(src, sourceEl) {
    var root = document.getElementById('lightboxRoot');
    var cardEl = sourceEl ? sourceEl.closest('[data-card]') : null;
    var nameEl = cardEl ? cardEl.querySelector('.card-name') : null;
    var caption = nameEl ? nameEl.textContent.replace(/^Name:\s*/, '') : '';
    root.innerHTML = '<div class="lightbox-backdrop" id="lbBackdrop">' +
      '<button class="lightbox-close" id="lbClose" type="button" aria-label="Close full-size view">' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>' +
      '<img class="lightbox-img" id="lbImg" src="' + esc(src) + '" alt="">' +
      (caption ? '<div class="lightbox-cap">' + esc(caption) + '</div>' : '') +
      '<div class="lightbox-zoom-hint" id="lbZoomHint">Click image to zoom</div>' +
      '</div>';
    document.getElementById('lbBackdrop').addEventListener('click', function (e) {
      if (e.target.id === 'lbBackdrop' || e.target.closest('#lbClose')) closeLightbox();
    });
    document.addEventListener('keydown', lightboxEscHandler);
    syncLightboxToViewport();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncLightboxToViewport);
      window.visualViewport.addEventListener('scroll', syncLightboxToViewport);
    }

    /* Click to zoom toward the clicked point (transform-origin does the work),
       then move the mouse (or drag a finger) over the zoomed image to pan
       around and inspect detail — no separate pan gesture to learn. */
    var lbImg = document.getElementById('lbImg');
    var hintEl = document.getElementById('lbZoomHint');
    var ZOOM_SCALE = 2.5;
    var zoomed = false;
    function setOriginFromPoint(clientX, clientY) {
      var rect = lbImg.getBoundingClientRect();
      var px = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
      var py = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));
      lbImg.style.transformOrigin = px + '% ' + py + '%';
    }
    lbImg.addEventListener('click', function (e) {
      if (!zoomed) {
        setOriginFromPoint(e.clientX, e.clientY);
        lbImg.classList.add('zoomed');
        lbImg.style.transform = 'scale(' + ZOOM_SCALE + ')';
        zoomed = true;
        if (hintEl) hintEl.textContent = 'Move to explore · click to reset';
      } else {
        lbImg.classList.remove('zoomed');
        lbImg.style.transform = 'scale(1)';
        lbImg.style.transformOrigin = 'center center';
        zoomed = false;
        if (hintEl) hintEl.textContent = 'Click image to zoom';
      }
    });
    lbImg.addEventListener('mousemove', function (e) {
      if (zoomed) setOriginFromPoint(e.clientX, e.clientY);
    });
    lbImg.addEventListener('touchmove', function (e) {
      if (zoomed && e.touches && e.touches[0]) {
        setOriginFromPoint(e.touches[0].clientX, e.touches[0].clientY);
        e.preventDefault();
      }
    }, { passive: false });
  }
  function closeLightbox() {
    document.getElementById('lightboxRoot').innerHTML = '';
    document.removeEventListener('keydown', lightboxEscHandler);
    if (window.visualViewport) {
      window.visualViewport.removeEventListener('resize', syncLightboxToViewport);
      window.visualViewport.removeEventListener('scroll', syncLightboxToViewport);
    }
  }

  function confirmDelete(btn) {
    var id = btn.getAttribute('data-del-painting');
    var p = state.paintings.find(function (x) { return x.id === id; });
    openDeleteModal(id, p ? p.name : '');

  function openDeleteModal(id, name) {

      '<h2>Delete painting?</h2>' +

      '<div class="modal-actions"><button class="btn btn-ghost" id="delCancel" type="button">Cancel</button>' +
      '<button class="btn btn-danger" id="delConfirm" type="button">Delete</button></div>' +
      '</div></div>';
    document.getElementById('delBackdrop').addEventListener('click', function (e) { if (e.target.id === 'delBackdrop') closeModal(); });
    document.getElementById('delCancel').addEventListener('click', closeModal);
    document.getElementById('delConfirm').addEventListener('click', function () {
      closeModal();
      deletePainting(id);
    });
  }

  async function toggleSold(id) {
    var p = state.paintings.find(function (x) { return x.id === id; });
    if (!p) return;
    var next = !p.sold;
    p.sold = next; renderAll(); // optimistic
    var res = await sb.from('paintings').update({ sold: next }).eq('id', id);
    if (res.error) { p.sold = !next; renderAll(); toast('Could not update — try again.'); }
  }
  async function toggleNotForSale(id) {
    var p = state.paintings.find(function (x) { return x.id === id; });
    if (!p) return;
    var next = !p.not_for_sale;
    p.not_for_sale = next; renderAll(); // optimistic
    var res = await sb.from('paintings').update({ not_for_sale: next }).eq('id', id);
    if (res.error) { p.not_for_sale = !next; renderAll(); toast('Could not update — try again.'); }
  }
  /* Blurs the grid/list thumbnail only — the stored files never change, and
     the lightbox opens the same full-size image (unblurred) as always, so
     this is purely a "don't show it at a glance" toggle, not real redaction
     of the underlying photo. */
  function thumbPosStyle(p) {
    var pos = state.thumbPos[p.id] || [50, 50], x = pos[0], y = pos[1];
    return (x === 50 && y === 50) ? '' : ' style="object-position:' + x + '% ' + y + '%"';
  }
  /* Admin: hold ~1s on a thumbnail (red corners blink), then drag to reposition the crop. */
  function setupThumbMove(grid) {
    if (!isAdmin) return;
    grid.querySelectorAll('.card-image').forEach(function (box) {
      var img = box.querySelector('img'); if (!img) return;
      var id = box.parentNode.getAttribute('data-card');
      var timer = null, active = false, sx = 0, sy = 0, startX = 50, startY = 50, curX = 50, curY = 50, pid = null, downX = 0, downY = 0;
      function cancelTimer() { if (timer) { clearTimeout(timer); timer = null; } }
      box.addEventListener('contextmenu', function (e) { if (timer || active) e.preventDefault(); });
      box.addEventListener('pointerdown', function (e) {
        if (e.button && e.button !== 0) return;
        if (e.target.closest('button')) return;
        downX = sx = e.clientX; downY = sy = e.clientY; pid = e.pointerId;
        var pos0 = state.thumbPos[id] || [50, 50];
        startX = curX = pos0[0]; startY = curY = pos0[1];
        cancelTimer();
        timer = setTimeout(function () {
          timer = null; active = true; box.classList.add('moving');
          try { box.setPointerCapture(pid); } catch (err) {}
          if (navigator.vibrate) { try { navigator.vibrate(30); } catch (err) {} }
        }, 1000);
      });
      box.addEventListener('pointermove', function (e) {
        if (!active) {
          if (timer && Math.hypot(e.clientX - downX, e.clientY - downY) > 8) cancelTimer();
          return;
        }
        e.preventDefault();
        var bw = box.clientWidth, bh = box.clientHeight, nw = img.naturalWidth || bw, nh = img.naturalHeight || bh;
        var scale = Math.max(bw / nw, bh / nh), ow = nw * scale - bw, oh = nh * scale - bh;
        // image follows the cursor: dragging right/down reveals the left/top part
        if (ow > 0.5) curX = Math.max(0, Math.min(100, startX - (e.clientX - sx) / ow * 100));
        if (oh > 0.5) curY = Math.max(0, Math.min(100, startY - (e.clientY - sy) / oh * 100));
        img.style.objectPosition = curX + '% ' + curY + '%';
      });
      function finish(e) {
        cancelTimer();
        if (!active) return;
        active = false; box.classList.remove('moving');
        try { box.releasePointerCapture(pid); } catch (err) {}
        var swallow = function (ev) { ev.stopPropagation(); ev.preventDefault(); };
        box.addEventListener('click', swallow, { capture: true, once: true });
        setTimeout(function () { box.removeEventListener('click', swallow, true); }, 400);
        curX = Math.round(curX * 10) / 10; curY = Math.round(curY * 10) / 10;
        if (curX === startX && curY === startY) return;
        var prev = state.thumbPos[id];
        state.thumbPos[id] = [curX, curY];
        sb.from('site_theme').upsert({ id: 2, colors: state.thumbPos, updated_at: new Date().toISOString() }).then(function (res) {
          if (res.error) {
            if (prev) state.thumbPos[id] = prev; else delete state.thumbPos[id];
            renderAll(); toast('Could not save position — try again.');
          } else toast('Thumbnail position saved.');
        });
      }
      box.addEventListener('pointerup', finish);
      box.addEventListener('pointercancel', finish);
      box.addEventListener('touchmove', function (e) { if (active) e.preventDefault(); }, { passive: false });
    });
  }

  async function toggleCensored(id) {
    var p = state.paintings.find(function (x) { return x.id === id; });
    if (!p) return;
    var next = !p.censored;
    p.censored = next; renderAll(); // optimistic
    var res = await sb.from('paintings').update({ censored: next }).eq('id', id);
    if (res.error) { p.censored = !next; renderAll(); toast('Could not update — try again.'); }
  }
  async function deletePainting(id) {
    var idx = state.paintings.findIndex(function (x) { return x.id === id; });
    if (idx === -1) return;
    var removed = state.paintings[idx];
    state.paintings.splice(idx, 1); renderAll(); // optimistic
    var res = await sb.from('paintings').delete().eq('id', id);
    if (res.error) { state.paintings.splice(idx, 0, removed); renderAll(); toast('Could not delete — try again.'); return; }
    // best-effort cleanup of stored images; ignore failures
    var paths = [removed.image_path, removed.thumb_path].filter(Boolean);
    if (paths.length) r2Remove(paths).catch(function () {});
  }

  async function saveSetBucket(id, bucketRaw) {
    var p = state.paintings.find(function (x) { return x.id === id; });
    if (!p) return;
    var trimmed = String(bucketRaw == null ? '' : bucketRaw).trim();
    var next = trimmed === '' ? null : parseInt(trimmed, 10);
    if (next !== null && (isNaN(next) || next <= 0)) { toast('Set bucket must be a positive number.'); return; }
    var prev = p.set_id;
    p.set_id = next; renderAll(); // optimistic — and instantly reversible by re-opening and clearing
    var res = await sb.from('paintings').update({ set_id: next }).eq('id', id);
    if (res.error) { p.set_id = prev; renderAll(); toast('Could not update — try again.'); }
  }

    var extraDatesWrap = document.getElementById('extraDatesWrap');

        function (inp) {
          var raw = inp.value.trim();

        }
      ).filter(function (d) { return d && d !== date; });
      // De-duplicate in case the same date was added twice.
      extraDates = extraDates.filter(function (d, i) { return extraDates.indexOf(d) === i; });

      var size = document.getElementById('pSize').value.trim();

        tab_id: state.activeTabId, name: name, number: number, date: date, extra_dates: extraDates,
        price: isNaN(price) ? 0 : price, size: size, description: description,
        sold: p ? !!p.sold : false, not_for_sale: p ? !!p.not_for_sale : false,
        censored: p ? !!p.censored : false,
        hue: p ? p.hue : Math.floor(Math.random() * 360),
        suffix_id: suffixId
      };

      if (pendingFile) {
        saveBtn.textContent = 'Uploading…'; saveBtn.disabled = true;
        try {
          var uid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2);
          var processed = await processPhoto(pendingFile, 900, 0.78);
          var fullBase = (pendingFile.name || 'photo').replace(/\.[^.]+$/, '');
          var fullPath = 'full/' + uid + '-' + fullBase + extForType(processed.fullBlob.type, pendingFile.name);
          var thumbPath = 'thumb/' + uid + '.jpg';
          var uploads = [r2Upload(fullPath, processed.fullBlob, processed.fullBlob.type || pendingFile.type || 'image/jpeg')];
          if (processed.thumbBlob) uploads.push(r2Upload(thumbPath, processed.thumbBlob, 'image/jpeg'));
          var results = await Promise.all(uploads);
          if (results[0].error) throw results[0].error;
          data.image_path = fullPath;
          data.thumb_path = (results[1] && !results[1].error) ? thumbPath : fullPath;
        } catch (e) {
          toast('Photo upload failed — saved without it.');
          saveBtn.disabled = false;
        }
      } else if (p) {
        data.image_path = p.image_path || null;
        data.thumb_path = p.thumb_path || null;
      }

      saveBtn.textContent = p ? 'Save' : 'Add painting'; saveBtn.disabled = false;

      if (p) {
        var res = await sb.from('paintings').update(data).eq('id', p.id).select().single();
        if (res.error) { toast('Could not save painting.'); }
        else { Object.assign(p, res.data); renderAll(); }
      } else {
        var res2 = await sb.from('paintings').insert(data).select().single();
        if (res2.error) { toast('Could not add painting.'); }
        else { state.paintings.unshift(res2.data); renderAll(); }
      }

    });

  async function runBulkUpload(files) {
    var tabId = state.activeTabId;
    var tab = tabById(tabId);
    /* Same reasoning as the single "Add painting" form: a no-prefix tab has
       no catalogue numbers for a PDF sync to match against later, so give
       each bulk-uploaded piece the tab's name as a starting Name rather
       than leaving it blank forever. */
    var defaultName = (tab && !tab.prefix) ? tab.name : '';
    var total = files.length;
    var cancelled = false;
    var root = document.getElementById('modalRoot');
    root.innerHTML = '<div class="modal-backdrop" id="bulkBackdrop"><div class="modal">' +
      '<h2>Uploading photos…</h2>' +
      '<p class="field-hint" id="bulkStatus">Starting…</p>' +
      '<div class="bulk-progress-track"><div class="bulk-progress-fill" id="bulkProgressFill" style="width:0%"></div></div>' +
      '<div class="modal-actions"><button class="btn btn-ghost" id="bulkStop" type="button">Stop</button></div>' +
      '</div></div>';
    document.getElementById('bulkStop').addEventListener('click', function () {
      cancelled = true; this.disabled = true; this.textContent = 'Stopping…';
    });

    var added = 0, failed = 0;
    for (var i = 0; i < total; i++) {
      if (cancelled) break;
      var f = files[i];
      var statusEl = document.getElementById('bulkStatus');
      if (statusEl) statusEl.textContent = 'Uploading ' + (i + 1) + ' of ' + total + ' — ' + f.name;
      var fillEl = document.getElementById('bulkProgressFill');
      if (fillEl) fillEl.style.width = Math.round((i / total) * 100) + '%';
      try {
        var uid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2);
        var processed = await processPhoto(f, 900, 0.78);
        var fullBase = (f.name || 'photo').replace(/\.[^.]+$/, '');
        var fullPath = 'full/' + uid + '-' + fullBase + extForType(processed.fullBlob.type, f.name);
        var thumbPath = 'thumb/' + uid + '.jpg';
        var uploads = [r2Upload(fullPath, processed.fullBlob, processed.fullBlob.type || f.type || 'image/jpeg')];
        if (processed.thumbBlob) uploads.push(r2Upload(thumbPath, processed.thumbBlob, 'image/jpeg'));
        var results = await Promise.all(uploads);
        if (results[0].error) throw results[0].error;
        var data = {
          tab_id: tabId, name: defaultName, number: (tab && !tab.prefix) ? 'N/A' : stripExt(f.name), date: null,
          price: 0, size: '', description: '', sold: false, not_for_sale: false, censored: false,
          hue: Math.floor(Math.random() * 360),
          image_path: fullPath,
          thumb_path: (results[1] && !results[1].error) ? thumbPath : fullPath
        };
        var res = await sb.from('paintings').insert(data).select().single();
        if (res.error) throw res.error;
        state.paintings.unshift(res.data);
        added++;
      } catch (e) {
        failed++;
      }
    }
    var fillEl2 = document.getElementById('bulkProgressFill');
    if (fillEl2) fillEl2.style.width = '100%';
    closeModal();
    renderAll();
    toast(added + ' photo' + (added === 1 ? '' : 's') + ' added' +
      (failed ? ', ' + failed + ' failed' : '') +
      (cancelled ? ' (stopped early)' : '') + '.');
  }

  /* ---------------- update from PDF ----------------
     The inventory PDF lists rows like "2024-01-18  O-06-1.1/4  Some Painting Name  60 x 80 cm"
     (date, number, name, size), one per line once the page text is reconstructed.
     The leading date is optional — some rows have it blank. Some rows have no usable
     size ("Dont Exist", "not done", trailing placeholder dashes) — those are still
     parsed and kept (with size: null) rather than skipped, since they're still
     part of the list and may still carry a name correction. */
  async function extractPdfLines(file) {
    var buf = await file.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    var lines = [];
    for (var pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      var page = await pdf.getPage(pageNum);
      var content = await page.getTextContent();
      var current = '';
      content.items.forEach(function (item) {
        current += item.str;
        if (item.hasEOL) { lines.push(current); current = ''; }
      });
      if (current) lines.push(current);
    }
    return lines;
  }

  function parseInventoryLines(lines) {
    var numberLineRe = /^(?:(\d{4}-\d{2}-\d{2})\s+)?([A-Za-z]+-[A-Za-z0-9.\-\/]*\d)\s+(.*)$/;
    var sizeRe = /(\d+)\s*[x×]\s*(\d+)\s*cm(\s*\(thick\))?\s*$/i;
    var rows = [];
    lines.forEach(function (line) {
      var trimmed = String(line).trim();
      if (!trimmed) return;
      var m = trimmed.match(numberLineRe);
      if (!m) return;
      var date = m[1] || null;
      var number = m[2];
      var rest = m[3].trim();
      var sizeMatch = rest.match(sizeRe);
      var size = null, name = rest;
      if (sizeMatch) {
        size = sizeMatch[1] + ' x ' + sizeMatch[2] + ' cm' + (sizeMatch[3] ? ' (thick)' : '');
        name = rest.slice(0, sizeMatch.index).trim();
      }
      /* No size match: row is still kept in full, name is whatever text remains
         (e.g. "Dont Exist", "not done—") — never dropped. */
      name = name.replace(/[\s\-\u2013\u2014]+$/, ''); /* trailing "---" placeholder in the size column */
      rows.push({ number: number, name: name, size: size, date: date });
    });
    return rows;
  }

  /* Matches by the LEADING catalogue number only ("13" out of "O-13-1.3/4"),
     not the full compound number. The part after that first number is
     always set/piece metadata, never part of the catalogue identity, and
     its punctuation isn't consistent — dashes, dots, slashes, more
     numbers, in any combination or order. Some pieces even have that
     full descriptor saved as their number in the database (e.g.
     "06-1-1-4"), others were only ever saved with the bare leading
     number ("13") — either way, comparing just the first digit run
     matches correctly and ignores everything after it. */
  function normalizeNumKey(raw) {
    var m = String(raw === null || raw === undefined ? '' : raw).match(/\d+/);
    return m ? m[0] : '';
  }

  /* ---------------- import descriptions from PDF ----------------
     A different kind of PDF than the inventory one above: a page-per-piece
     book/catalogue where each piece has a small yellow "O-12" style number
     tag and a paragraph of description text near it (sometimes two pieces
     side by side on one page, sharing one tag line like "O-11 O-12"). This
     reads the description text near each tag and proposes it as a change
     to that piece's Description field, through the exact same red-preview
     / edit / discard / Apply flow as "Import from PDF" above.

     Some source PDFs (this book included) have a broken font somewhere
     that maps a handful of punctuation glyphs to the wrong codepoints —
     curly quotes and dashes come out as "í"/"ó"/"ì"/"î"/"Ö". FIX_CHARS
     repairs exactly those; anything else non-ASCII is left alone since
     it might be genuine (accented names, etc). Stray control characters
     (a different, page-local font bug on a few pages) are stripped. */
  var DESC_FIX_CHARS = { 'í': '’', 'ó': '—', 'ì': '“', 'î': '”', 'Ö': '…', 'ë': '’' };
  function fixDescChars(s) {
    return String(s || '')
      .replace(/[íóìîÖë]/g, function (c) { return DESC_FIX_CHARS[c] || c; })
      .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, '');
  }

  /* Same per-line grouping as extractPdfLines(), but keeping each line's
     position so pieces that share a page can be told apart by column. */
  async function extractDescPdfPages(file) {
    var buf = await file.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    var pages = [];
    for (var pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      var page = await pdf.getPage(pageNum);
      var content = await page.getTextContent();
      var lines = [], current = '', curX = null, curY = null;
      content.items.forEach(function (item) {
        if (curX === null) { curX = item.transform[4]; curY = item.transform[5]; }
        current += item.str;
        if (item.hasEOL) { lines.push({ text: current, x: curX, y: curY }); current = ''; curX = null; curY = null; }
      });
      if (current) lines.push({ text: current, x: curX, y: curY });
      /* a handful of pages carry a duplicate, truncated copy of a few lines
         at the exact same position (a rendering artifact) — keep only the
         longer line at each position */
      var byPos = {};
      lines.forEach(function (ln) {
        var key = Math.round(ln.x) + ',' + Math.round(ln.y);
        if (!byPos[key] || ln.text.length > byPos[key].text.length) byPos[key] = ln;
      });
      pages.push(Object.keys(byPos).map(function (k) { return byPos[k]; }));
    }
    return { pdf: pdf, pages: pages };
  }

  /* A page's tag numbers can come as one combined line ("O-11-2.1/2
     O-12-2.2/2") or, just as often, as two separate standalone lines (two
     yellow boxes that don't happen to land on the same text-row) — both
     count, so every anchor-shaped line on the page is collected. */
  function getPageAnchorNums(lines) {
    var nums = [];
    lines.forEach(function (ln) {
      if (!DESC_ANCHOR_RE.test(ln.text.trim())) return;
      var m = ln.text.trim().match(DESC_NUM_RE);
      if (m) nums = nums.concat(m);
    });
    return nums;
  }

  /* Every independently-selectable chunk of text on a page (every column,
     every gap-separated block within a column — titles/captions included),
     used by the manual review modal so the person can tick whichever
     chunk(s) actually belong to a given catalogue number. Left-to-right,
     top-to-bottom order. */
  function getPageCandidateBlocks(lines) {
    var anchorLines = lines.filter(function (ln) { return DESC_ANCHOR_RE.test(ln.text.trim()); });
    var body = lines.filter(function (ln) { return anchorLines.indexOf(ln) === -1; });
    var cols = clusterLinesByColumn(body);
    var blocks = [];
    cols.forEach(function (col) {
      var sorted = col.lines.slice().sort(function (a, b) { return b.y - a.y; });
      var subBlocks = [];
      sorted.forEach(function (ln, i) {
        var prev = sorted[i - 1];
        if (!prev || (prev.y - ln.y) > DESC_BLOCK_GAP) subBlocks.push([]);
        subBlocks[subBlocks.length - 1].push(ln);
      });
      subBlocks.forEach(function (b) {
        var out = '', prevY = null;
        b.forEach(function (ln) {
          var t = ln.text.trim();
          if (!t) return;
          if (prevY === null) out = t;
          else if ((prevY - ln.y) > DESC_PARA_GAP) out += '\n\n' + t;
          else out += ' ' + t;
          prevY = ln.y;
        });
        out = fixDescChars(out).replace(/[ \t]+/g, ' ').trim();
        if (out) blocks.push({ text: out, avgX: b.reduce(function (s, l) { return s + l.x; }, 0) / b.length, topY: b[0].y });
      });
    });
    blocks.sort(function (a, b) { return a.avgX - b.avgX || b.topY - a.topY; });
    return blocks;
  }

  var DESC_ANCHOR_RE = /^([A-Za-z]{1,4}-\d[\w.\-\/]*(?:\s+[A-Za-z]{1,4}-\d[\w.\-\/]*)*)$/;
  var DESC_NUM_RE = /[A-Za-z]{1,4}-\d[\w.\-\/]*/g;
  var DESC_COLUMN_GAP = 50, DESC_BLOCK_GAP = 48, DESC_PARA_GAP = 28;

  /* Groups a page's body lines (the tag line already excluded) into
     left-to-right columns — two pieces sharing a page sit in separate
     columns, each with its own description text and (often) its own
     leaked title caption above/below it. */
  function clusterLinesByColumn(lines) {
    var sorted = lines.slice().sort(function (a, b) { return a.x - b.x; });
    var cols = [];
    sorted.forEach(function (ln) {
      var last = cols[cols.length - 1];
      if (last && ln.x - last.lines[last.lines.length - 1].x <= DESC_COLUMN_GAP) last.lines.push(ln);
      else cols.push({ lines: [ln] });
    });
    cols.forEach(function (c) { c.chars = c.lines.reduce(function (s, l) { return s + l.text.length; }, 0); });
    return cols;
  }

  /* Within one piece's column, the real description is the tallest block
     of lines with normal line-to-line spacing; a caption/title sitting in
     the same column is set off by a much bigger vertical gap and — being
     short — loses out to the real paragraph(s) by character count. Within
     the winning block, a blank-line-sized gap becomes a paragraph break. */
  function buildDescFromColumn(col) {
    var sorted = col.lines.slice().sort(function (a, b) { return b.y - a.y; });
    var blocks = [];
    sorted.forEach(function (ln, i) {
      var prev = sorted[i - 1];
      if (!prev || (prev.y - ln.y) > DESC_BLOCK_GAP) blocks.push([]);
      blocks[blocks.length - 1].push(ln);
    });
    var winner = blocks.reduce(function (best, b) {
      var chars = b.reduce(function (s, l) { return s + l.text.length; }, 0);
      return chars > best.chars ? { lines: b, chars: chars } : best;
    }, { lines: [], chars: -1 }).lines;
    var out = '', prevY = null;
    winner.forEach(function (ln) {
      var t = ln.text.trim();
      if (!t) return;
      if (prevY === null) out = t;
      else if ((prevY - ln.y) > DESC_PARA_GAP) out += '\n\n' + t;
      else out += ' ' + t;
      prevY = ln.y;
    });
    return fixDescChars(out).replace(/[ \t]+/g, ' ').trim();
  }

  /* One page can hold one piece (most pages) or two side by side sharing
     ONE tag line like "O-11-2.1/2 O-12-2.2/2" — there the tag lists the
     numbers in the same left-to-right order as their columns below, and
     auto-assigning is reliable enough to propose straight into the red
     preview. A page with two SEPARATE tag lines (two yellow boxes that
     just don't land on the same text-row) is a shakier bet — layouts seen
     in this book range from simple side-by-side to a crossed diagonal
     (piece A's text sits where piece B's image is, and vice versa), so
     rather than guess, this returns nothing for that page and leaves it
     entirely to the manual review modal, which the caller flags it for. */
  function extractDescEntriesFromPage(lines, pageNum) {
    var anchorLines = lines.filter(function (ln) { return DESC_ANCHOR_RE.test(ln.text.trim()); });
    if (anchorLines.length !== 1) return [];
    var anchorLine = anchorLines[0];
    var nums = anchorLine.text.trim().match(DESC_NUM_RE) || [];
    if (!nums.length) return [];
    var body = lines.filter(function (ln) { return ln !== anchorLine; });
    var cols = clusterLinesByColumn(body);
    cols.sort(function (a, b) { return b.chars - a.chars; });
    var top = cols.slice(0, nums.length);
    top.sort(function (a, b) {
      var ax = a.lines.reduce(function (s, l) { return s + l.x; }, 0) / a.lines.length;
      var bx = b.lines.reduce(function (s, l) { return s + l.x; }, 0) / b.lines.length;
      return ax - bx;
    });
    var out = [];
    nums.forEach(function (num, i) {
      var col = top[i];
      if (!col) return;
      var desc = buildDescFromColumn(col);
      if (desc) out.push({ number: num, description: desc, pageNum: pageNum });
    });
    return out;
  }

  async function runDescPdfSync(file) {
    if (!window.pdfjsLib) { toast('PDF reader failed to load — check your connection and try again.'); return; }
    toast('Reading PDF…');
    try {
      var loaded = await extractDescPdfPages(file);
      var pdf = loaded.pdf, pages = loaded.pages;
      var entries = [];
      var pageAnchorNums = {}; /* pageNum -> [numbers on that page's tag line] */
      pages.forEach(function (lines, idx) {
        var pageNum = idx + 1;
        var nums = getPageAnchorNums(lines);
        if (!nums.length) return;
        pageAnchorNums[pageNum] = nums;
        entries = entries.concat(extractDescEntriesFromPage(lines, pageNum));
      });
      if (!entries.length) { toast('Could not find any numbered entries in that PDF.'); return; }

      var byKey = {};
      entries.forEach(function (e) {
        var pm = e.number.match(/^([A-Za-z]+)-/);
        byKey[(pm ? pm[1] : '') + ':' + normalizeNumKey(e.number)] = e;
      });

      var changes = [];
      state.paintings.forEach(function (p) {
        var tab = tabById(p.tab_id);
        var prefixLetter = (tab && tab.prefix ? tab.prefix : '').replace(/[^A-Za-z]/g, '');
        var entry = byKey[prefixLetter + ':' + normalizeNumKey(p.number)];
        if (!entry) return;
        var newDesc = entry.description;
        if (newDesc !== (p.description || '')) changes.push({ id: p.id, fields: { description: newDesc } });
      });
      var matchedKeys = {};
      state.paintings.forEach(function (p) {
        var tab = tabById(p.tab_id);
        var prefixLetter = (tab && tab.prefix ? tab.prefix : '').replace(/[^A-Za-z]/g, '');
        var key = prefixLetter + ':' + normalizeNumKey(p.number);
        if (byKey[key]) matchedKeys[key] = true;
      });
      var noMatchCount = Object.keys(byKey).length - Object.keys(matchedKeys).length;

      /* Pages worth a manual look: a number the PDF has but no painting
         matches, a page shared by two pieces (worth double-checking the
         split either way), or a tag with no description text found near it. */
      var flagged = {};
      function flag(pageNum, reason) {
        if (!flagged[pageNum]) flagged[pageNum] = [];
        if (flagged[pageNum].indexOf(reason) === -1) flagged[pageNum].push(reason);
      }
      Object.keys(byKey).forEach(function (key) {
        if (!matchedKeys[key]) flag(byKey[key].pageNum, 'No painting numbered ' + byKey[key].number + ' found');
      });
      Object.keys(pageAnchorNums).forEach(function (pnStr) {
        var pn = Number(pnStr), nums = pageAnchorNums[pnStr];
        if (nums.length > 1) flag(pn, 'Two pieces share this page — double-check the split');
        var foundNums = entries.filter(function (e) { return e.pageNum === pn; }).map(function (e) { return e.number; });
        nums.forEach(function (n) { if (foundNums.indexOf(n) === -1) flag(pn, 'No description text found near ' + n); });
      });
      var flaggedPageNums = Object.keys(flagged).map(Number).sort(function (a, b) { return a - b; });
      descReviewState = flaggedPageNums.length ? { pdf: pdf, pages: pages, flagged: flagged, order: flaggedPageNums } : null;

      if (!changes.length) {
        toast(noMatchCount
          ? 'Found ' + entries.length + ' entries in the PDF, but none needed changes (' + noMatchCount + ' didn\'t match an existing painting).'
          : 'Found ' + entries.length + ' entries in the PDF — descriptions already match, nothing to change.');
        if (descReviewState) { testOverlay = { kind: 'desc', byId: {}, extras: [] }; wireTestGrid(); updateTestBanner(); openDescReviewModal(); }
        return;
      }
      startPdfTest(changes, [], 'desc');
      var msg = changes.length + ' description' + (changes.length === 1 ? '' : 's') + ' ready to preview — red = from the PDF.';
      if (flaggedPageNums.length) msg += ' ' + flaggedPageNums.length + ' page' + (flaggedPageNums.length === 1 ? '' : 's') +
        ' need a manual check (unmatched numbers, shared pages, or no text found) — click "Review pages" in the preview bar.';
      toast(msg);
    } catch (e) {
      toast('Could not read that PDF — is it a valid catalogue PDF?');
    }
  }

  /* Renders one PDF page to an <img> inside the review modal, on demand —
     only the flagged pages ever get rendered, not all 199. */
  async function renderReviewPageImage(pageNum) {
    var container = document.getElementById('reviewImg-' + pageNum);
    if (!container || !descReviewState) return;
    try {
      var page = await descReviewState.pdf.getPage(pageNum);
      var viewport = page.getViewport({ scale: 1.3 });
      var canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
      if (!document.getElementById('reviewImg-' + pageNum)) return; /* modal closed mid-render */
      var img = document.createElement('img');
      img.src = canvas.toDataURL('image/jpeg', 0.85);
      img.alt = 'PDF page ' + pageNum;
      container.innerHTML = '';
      container.appendChild(img);
    } catch (e) {
      if (container) container.innerHTML = '<span class="field-hint">Could not render this page.</span>';
    }
  }

  /* The manual-fix companion to "Import descriptions from PDF": for every
     flagged page, shows the page image plus every independently-selectable
     chunk of text found on it (see getPageCandidateBlocks) as a checklist —
     the person ticks which chunk(s) belong to which catalogue number and
     the result joins the very same red preview / Apply flow. */
  function openDescReviewModal() {
    if (!descReviewState) return;
    var root = document.getElementById('modalRoot');
    var pageNums = descReviewState.order;
    root.innerHTML = '<div class="modal-backdrop" id="descReviewBackdrop"><div class="modal modal-xwide">' +
      '<h2>Review flagged pages</h2>' +
      '<p class="modal-sub">' + pageNums.length + ' page' + (pageNums.length === 1 ? '' : 's') + ' from the description PDF need a manual look — ' +
      'a number that didn\'t match a painting, two pieces sharing a page, or no description text found nearby. ' +
      'Tick the block(s) of text that belong to a number, fix the number if needed, then "Use checked blocks". ' +
      'Nothing is saved here either — it joins the same red preview, ready for Apply.</p>' +
      '<div id="descReviewList" class="review-list"></div>' +
      '<div class="modal-actions"><button class="btn btn-primary" id="descReviewDone" type="button">Done</button></div>' +
      '</div></div>';
    document.getElementById('descReviewBackdrop').addEventListener('click', function (e) { if (e.target.id === 'descReviewBackdrop') closeModal(); });
    document.getElementById('descReviewDone').addEventListener('click', closeModal);

    var list = document.getElementById('descReviewList');
    var html = '';
    pageNums.forEach(function (pageNum) {
      var lines = descReviewState.pages[pageNum - 1];
      var reasons = descReviewState.flagged[pageNum] || [];
      var nums = getPageAnchorNums(lines);
      var blocks = getPageCandidateBlocks(lines);
      html += '<div class="review-page" id="reviewPage-' + pageNum + '" data-next-idx="' + nums.length + '">' +
        '<h3>Page ' + pageNum + '</h3>' +
        '<div class="review-page-reasons">' + reasons.map(function (r) { return '<span class="review-reason-chip">' + esc(r) + '</span>'; }).join('') + '</div>' +
        '<div class="review-page-body">' +
        '<div class="review-page-img" id="reviewImg-' + pageNum + '"><span class="field-hint">Rendering page…</span></div>' +
        '<div class="review-blocks">' +
        blocks.map(function (b, i) {
          return '<label class="review-block-row"><input type="checkbox" data-block="' + i + '"><span>' + esc(b.text.slice(0, 220)) + (b.text.length > 220 ? '…' : '') + '</span></label>';
        }).join('') +
        '<div class="review-assign-rows">' +
        nums.map(function (num, idx) { return reviewAssignRowHtml(pageNum, idx, num); }).join('') +
        '</div>' +
        '<button type="button" class="btn btn-ghost btn-sm review-add-num" data-page="' + pageNum + '">+ Add another number</button>' +
        '</div></div></div>';
    });
    list.innerHTML = html;

    list.addEventListener('click', function (e) {
      var addBtn = e.target.closest('.review-add-num');
      if (addBtn) {
        var pageNum = Number(addBtn.getAttribute('data-page'));
        var section = document.getElementById('reviewPage-' + pageNum);
        var idx = Number(section.getAttribute('data-next-idx'));
        section.setAttribute('data-next-idx', String(idx + 1));
        var row = document.createElement('div');
        row.innerHTML = reviewAssignRowHtml(pageNum, idx, '');
        section.querySelector('.review-assign-rows').appendChild(row.firstChild);
        return;
      }
      var btn = e.target.closest('[data-num-idx]');
      if (!btn || btn.tagName !== 'BUTTON') return;
      var pageNum = Number(btn.getAttribute('data-page'));
      var numIdx = btn.getAttribute('data-num-idx');
      var section = document.getElementById('reviewPage-' + pageNum);
      var checked = Array.prototype.slice.call(section.querySelectorAll('.review-blocks input[type="checkbox"]:checked'));
      if (!checked.length) { toast('Tick at least one block of text first.'); return; }
      var numField = section.querySelector('input[data-role="numfield"][data-num-idx="' + numIdx + '"]');
      var number = numField ? numField.value.trim() : '';
      if (!number) { toast('Enter a catalogue number first.'); return; }
      var pageBlocks = getPageCandidateBlocks(descReviewState.pages[pageNum - 1]);
      var chosen = checked.map(function (cb) { return pageBlocks[Number(cb.getAttribute('data-block'))]; }).filter(Boolean);
      var text = fixDescChars(chosen.map(function (b) { return b.text; }).join('\n\n')).trim();
      var pm = number.match(/^([A-Za-z]*)-?\s*(.+)$/);
      var prefixLetter = (pm ? pm[1] : '').replace(/[^A-Za-z]/g, '').toUpperCase();
      var normNum = normalizeNumKey(number);
      var painting = state.paintings.find(function (p) {
        var tab = tabById(p.tab_id);
        var tp = (tab && tab.prefix ? tab.prefix : '').replace(/[^A-Za-z]/g, '').toUpperCase();
        return tp === prefixLetter && normNum && normalizeNumKey(p.number) === normNum;
      });
      if (!painting) { toast('No painting numbered ' + number + ' found in any tab.'); return; }
      if (!testOverlay) { testOverlay = { kind: 'desc', byId: {}, extras: [] }; wireTestGrid(); }
      testOverlay.byId[painting.id] = { description: text };
      var tag = document.getElementById('reviewResolved-' + pageNum + '-' + numIdx);
      if (tag) { tag.hidden = false; tag.textContent = '✓ applied to "' + esc(painting.name || 'Untitled') + '"'; }
      updateTestBanner();
      renderAll();
      toast('Description for ' + number + ' added to the preview.');
    });

    (async function () {
      for (var i = 0; i < pageNums.length; i++) await renderReviewPageImage(pageNums[i]);
    })();
  }
  function reviewAssignRowHtml(pageNum, idx, num) {
    return '<div class="review-assign-row">' +
      '<input type="text" class="mono" value="' + esc(num) + '" placeholder="e.g. O-57" data-role="numfield" data-num-idx="' + idx + '">' +
      '<button type="button" class="btn btn-ghost btn-sm" data-page="' + pageNum + '" data-num-idx="' + idx + '">Use checked blocks →</button>' +
      '<span class="review-resolved-tag" id="reviewResolved-' + pageNum + '-' + idx + '" hidden></span>' +
      '</div>';
  }

  async function runPdfSync(file) {
    if (!window.pdfjsLib) { toast('PDF reader failed to load — check your connection and try again.'); return; }
    toast('Reading PDF…');
    try {
      var lines = await extractPdfLines(file);
      var rows = parseInventoryLines(lines);
      if (!rows.length) { toast('Could not find any inventory rows in that PDF.'); return; }

      var byKey = {};
      rows.forEach(function (r) {
        var prefixMatch = String(r.number).match(/^([A-Za-z]+)-/);
        var prefixLetter = prefixMatch ? prefixMatch[1] : '';
        byKey[prefixLetter + ':' + normalizeNumKey(r.number)] = r;
      });

      var changes = [];
      var unmatchedCount = 0;
      var matchedKeys = {};
      state.paintings.forEach(function (p) {
        var tab = tabById(p.tab_id);
        var prefixLetter = (tab && tab.prefix ? tab.prefix : '').replace(/[^A-Za-z]/g, '');
        var row = byKey[prefixLetter + ':' + normalizeNumKey(p.number)];
        if (!row) { unmatchedCount++; return; }
        matchedKeys[prefixLetter + ':' + normalizeNumKey(p.number)] = true;
        var newName = row.name || '';
        var newSize = row.size; /* null = PDF has no usable size — never overwrite existing size with it */
        var newDate = row.date; /* null = PDF row has no date — never overwrite existing date with it */
        var nameChanged = newName !== (p.name || '');
        var sizeChanged = newSize !== null && newSize !== (p.size || '');
        var dateChanged = newDate !== null && newDate !== (p.date ? String(p.date).slice(0, 10) : '');
        if (nameChanged || sizeChanged || dateChanged) {
          var fields = {};
          if (nameChanged) fields.name = newName;
          if (sizeChanged) fields.size = newSize;
          if (dateChanged) fields.date = newDate;
          changes.push({ id: p.id, fields: fields });
        }
      });

      /* Any PDF row that matches no existing painting is proposed as a new
         one — not just rows literally named "Dont Exist". A PDF that's
         grown past the gallery (more catalogue numbers on the physical
         list than have been entered here yet) is exactly this case, and
         it used to be silently dropped instead of offered for creation.
         Still shown and saved as a photo-less black tile either way —
         a real "Dont Exist" or a real new painting both need a photo
         added later via the ordinary edit pencil. */
      var creates = [];
      Object.keys(byKey).forEach(function (key) {
        var r = byKey[key];
        if (matchedKeys[key]) return;
        var pm = String(r.number).match(/^([A-Za-z]+)-(.+)$/);
        if (!pm) return;
        var tab = state.tabs.find(function (t) { return t.prefix && t.prefix.replace(/[^A-Za-z]/g, '') === pm[1]; });
        if (!tab) return;
        var leadNum = normalizeNumKey(r.number) || pm[2];
        creates.push({ tab_id: tab.id, number: leadNum, name: r.name || '', size: r.size || '', date: r.date || null,
                       catalog: (tab.prefix || '') + pm[2] });
      });

      startPdfTest(changes, creates);
    } catch (e) {
      toast('Could not read that PDF — is it a valid inventory PDF?');
    }
  }

  async function applyPdfChanges(changes, btn, creates) {
    creates = creates || [];
    btn.disabled = true;
    var cancelBtn = document.getElementById('pdfPreviewCancel');
    if (cancelBtn) cancelBtn.disabled = true;
    var ok = 0, failed = 0;
    for (var i = 0; i < changes.length; i++) {
      var c = changes[i];
      btn.textContent = 'Updating ' + (i + 1) + ' of ' + changes.length + '…';
      var patch = Object.assign({}, c.fields);
      try {
        var res = await sb.from('paintings').update(patch).eq('id', c.id).select().single();
        if (res.error) throw res.error;
        var p = state.paintings.find(function (x) { return x.id === c.id; });
        if (p) Object.assign(p, res.data);
        ok++;
      } catch (e) {
        failed++;
      }
    }
    var added = 0;
    for (var j = 0; j < creates.length; j++) {
      var cr = creates[j];
      btn.textContent = 'Adding ' + (j + 1) + ' of ' + creates.length + '…';
      try {
        var ins = await sb.from('paintings').insert({
          tab_id: cr.tab_id, name: cr.name, number: cr.number, date: cr.date, extra_dates: [],
          price: 0, size: cr.size || '', description: '', sold: false, not_for_sale: false, censored: false,
          hue: 0, suffix_id: null
        }).select().single();
        if (ins.error) throw ins.error;
        state.paintings.unshift(ins.data);
        added++;
      } catch (e) {
        failed++;
      }
    }
    testOverlay = null; descReviewState = null; updateTestBanner();
    closeModal();
    renderAll();
    toast(ok + ' painting' + (ok === 1 ? '' : 's') + ' updated from PDF' +
      (added ? ', ' + added + ' placeholder' + (added === 1 ? '' : 's') + ' added' : '') +
      (failed ? ', ' + failed + ' failed' : '') + '.');
  }

  /* ---------------- site theme ---------------- */
  function hexOfVar(varName) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)) {
      return v.length === 4 ? '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3] : v;
    }
    return '#888888';
  }
  var DERIVED_INK_VARS = [
    '--ink-2', '--ink-on-accent', '--ink-soft-2', '--ink-faint', '--ink-faint-2', '--sold-2',
    '--sold-on-bg', '--toast-ink', '--hover-ink', '--ochre-on-bg', '--ochre-readable', '--ochre-card'
  ];
  function applyThemeColors(colors) {
    var rootStyle = document.documentElement.style;
    THEME_VARS.map(function (v) { return v.varName; }).concat(DERIVED_INK_VARS).forEach(function (varName) {
      if (colors && colors[varName]) rootStyle.setProperty(varName, colors[varName]);
      else rootStyle.removeProperty(varName);
    });
  }
  /* -- contrast safety: Text (--ink) sits on top of Background/Panels/Cards, so
     whichever colors those are set to, the text must stay legible against all
     three. If the chosen text color already reads fine everywhere, it is left
     exactly as picked; it's only overridden (to pure black or white, whichever
     contrasts better) when it would otherwise be unreadable somewhere. -- */
  function hexToRgb(hex) {
    hex = String(hex).replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
    var num = parseInt(hex, 16);
    return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
  }
  function relLuminance(hex) {
    var rgb = hexToRgb(hex).map(function (c) {
      c /= 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
  }
  function contrastRatio(hexA, hexB) {
    var l1 = relLuminance(hexA), l2 = relLuminance(hexB);
    var hi = Math.max(l1, l2), lo = Math.min(l1, l2);
    return (hi + 0.05) / (lo + 0.05);
  }
  var READABLE_CONTRAST = 7;
  /* Pick black or white based on how light or dark a group of surfaces is on
     the whole, rather than chasing a single worst-case pairing. */
  function pickReadableAgainst(candidate, surfaceHexes) {
    var failsAny = surfaceHexes.some(function (s) { return contrastRatio(candidate, s) < READABLE_CONTRAST; });
    if (!failsAny) return candidate;
    var avgLum = surfaceHexes.reduce(function (sum, s) { return sum + relLuminance(s); }, 0) / surfaceHexes.length;
    return avgLum > 0.5 ? '#000000' : '#ffffff';
  }
  /* Three independent text/surface pairings exist in the app, and each is
     corrected on its own: main text (--ink) sits on Background + Panels,
     text inside cards/buttons/inputs (--ink-2) sits on Cards, and text on
     the accent-filled primary button (--ink-on-accent) sits on Accent.
     Correcting each pairing separately (rather than forcing one shared text
     color to satisfy all of them) is what lets Panels and Cards be picked
     as very different colors — even opposite extremes — without any of
     them going unreadable. If a color already reads fine where it's used,
     it's left exactly as picked. */
  function deriveTextColors(colors) {
    var get = function (v) { return (colors && colors[v]) || hexOfVar(v); };
    return {
      '--ink': pickReadableAgainst(get('--ink'), [get('--canvas'), get('--paper')]),
      '--ink-2': pickReadableAgainst(get('--ink'), [get('--paper-2')]),
      '--ink-on-accent': pickReadableAgainst(get('--paper-2'), [get('--ochre')]),
      '--ink-soft': pickReadableAgainst(get('--ink-soft'), [get('--canvas'), get('--paper')]),
      '--ink-soft-2': pickReadableAgainst(get('--ink-soft'), [get('--paper-2')]),
      '--ink-faint': pickReadableAgainst(get('--ink-faint'), [get('--canvas'), get('--paper')]),
      '--ink-faint-2': pickReadableAgainst(get('--ink-faint'), [get('--paper-2')]),
      '--sold-2': pickReadableAgainst(get('--sold'), [get('--paper-2')]),
      '--ochre-card': pickReadableAgainst(get('--ochre'), [get('--paper-2')]),
      /* Fixed (non-editable) surfaces text can also land on: the sold price
         tag's pale sold-bg chip, the toast's ink-colored background, the
         line-soft/ochre-bg hover highlights, and canvas/paper behind the
         accent color itself. Each gets its own correction because these
         surfaces don't move when Panels/Cards are recolored. */
      '--sold-on-bg': pickReadableAgainst(get('--sold'), [hexOfVar('--sold-bg')]),
      '--toast-ink': pickReadableAgainst(get('--canvas'), [get('--ink')]),
      '--hover-ink': pickReadableAgainst(get('--ink'), [hexOfVar('--line-soft'), hexOfVar('--ochre-bg')]),
      '--ochre-on-bg': pickReadableAgainst(get('--ochre'), [hexOfVar('--ochre-bg')]),
      '--ochre-readable': pickReadableAgainst(get('--ochre'), [get('--canvas'), get('--paper')])
    };
  }
  async function loadTheme() {
    var res = await sb.from('site_theme').select('colors').eq('id', 1).maybeSingle();
    if (!res.error && res.data && res.data.colors) {
      var colors = Object.assign({}, res.data.colors, deriveTextColors(res.data.colors));
      applyThemeColors(colors);
    }
  }
  function openThemeModal() {
    var root = document.getElementById('modalRoot');
    root.innerHTML = '<div class="modal-backdrop" id="themeBackdrop"><div class="modal">' +
      '<h2>Site theme</h2>' +
      '<p class="field-hint">Changes preview instantly and apply for every visitor — including the Wix embed — once you save.</p>' +
      '<div class="tl-appcolors" id="themeColors" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;">' +
      THEME_VARS.map(function (v) {
        return '<label style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink-soft);text-align:center;">' +
          '<input type="color" data-var="' + v.varName + '" value="' + hexOfVar(v.varName) + '" style="width:100%;height:30px;border:1px solid var(--line);border-radius:4px;padding:1px;background:var(--paper-2);cursor:pointer;">' +
          '<span>' + v.label + '</span></label>';
      }).join('') +
      '</div>' +
      '<div class="modal-actions"><button class="btn btn-ghost" id="themeResetDefault" type="button">Reset to default</button>' +
      '<button class="btn btn-ghost" id="themeCancel" type="button">Close</button>' +
      '<button class="btn btn-primary" id="themeSave" type="button">Save for everyone</button></div>' +
      '</div></div>';

    var colorsEl = document.getElementById('themeColors');
    function currentPickerColors() {
      var current = {};
      colorsEl.querySelectorAll('input[data-var]').forEach(function (inp) { current[inp.getAttribute('data-var')] = inp.value; });
      return current;
    }
    function reguardTextReadability() {
      var current = currentPickerColors();
      var derived = deriveTextColors(current);
      var rootStyle = document.documentElement.style;
      DERIVED_INK_VARS.forEach(function (v) { rootStyle.setProperty(v, derived[v]); });
      ['--ink', '--ink-soft'].forEach(function (v) {
        if (derived[v] !== current[v]) {
          rootStyle.setProperty(v, derived[v]);
          var input = colorsEl.querySelector('input[data-var="' + v + '"]');
          if (input) input.value = derived[v];
        }
      });
    }
    colorsEl.addEventListener('input', function (e) {
      var input = e.target.closest('input[data-var]');
      if (!input) return;
      document.documentElement.style.setProperty(input.getAttribute('data-var'), input.value);
      reguardTextReadability();
    });
    reguardTextReadability(); /* self-heal if the panel opened onto an already-unreadable preview */
    document.getElementById('themeBackdrop').addEventListener('click', function (e) { if (e.target.id === 'themeBackdrop') closeModal(); });
    document.getElementById('themeCancel').addEventListener('click', closeModal);
    document.getElementById('themeResetDefault').addEventListener('click', async function () {
      applyThemeColors(null);
      colorsEl.querySelectorAll('input[data-var]').forEach(function (input) {
        input.value = hexOfVar(input.getAttribute('data-var'));
      });
      var res = await sb.from('site_theme').delete().eq('id', 1);
      if (res.error) toast('Could not clear the saved theme.');
      else toast('Theme reset to default for everyone.');
    });
    document.getElementById('themeSave').addEventListener('click', async function () {
      var colors = currentPickerColors();
      var originalInk = colors['--ink'], originalInkSoft = colors['--ink-soft'];
      var derived = deriveTextColors(colors);
      Object.assign(colors, derived);
      var adjusted = colors['--ink'] !== originalInk || colors['--ink-soft'] !== originalInkSoft;
      applyThemeColors(colors);
      var res = await sb.from('site_theme').upsert({ id: 1, colors: colors, updated_at: new Date().toISOString() });
      if (res.error) toast('Could not save theme: ' + res.error.message);
      else { toast(adjusted ? 'Saved — text color adjusted to stay readable.' : 'Theme saved for everyone.'); closeModal(); }
    });
  }

  /* Suffix manager: a small admin-editable list of colored tags (label +
     color), Diablo-rarity style — "Painting set" is the first, more get
     added here over time. Rows are edited in place and only written to
     Supabase on Save, diffed against what was loaded (new rows insert,
     changed rows update, removed rows delete — deleting a suffix still in
     use is safe: paintings.suffix_id just falls back to null via the
     column's ON DELETE SET NULL). */
  function openSuffixManagerModal() {
    var rows = state.suffixes.map(function (s) { return { id: s.id, label: s.label, color: s.color }; });
    var nextTempId = 1;
    var root = document.getElementById('modalRoot');

    function rowHTML(row, i) {
      return '<div class="suffix-row" data-row="' + i + '" style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">' +
        '<input type="color" class="suffix-row-color" value="' + esc(row.color) + '" style="width:36px;height:32px;border:1px solid var(--line);border-radius:4px;padding:1px;background:var(--paper-2);cursor:pointer;flex-shrink:0;">' +
        '<input type="text" class="suffix-row-label" value="' + esc(row.label) + '" placeholder="Suffix name" style="flex:1;">' +
        '<button class="icon-btn danger suffix-row-remove" type="button" aria-label="Remove" title="Remove">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>' +
        '</button></div>';
    }
    function renderRows() {
      document.getElementById('suffixRows').innerHTML = rows.length
        ? rows.map(rowHTML).join('')
        : '<p class="field-hint">No suffixes yet — add one below.</p>';
      wireRowEvents();
    }
    function wireRowEvents() {
      var wrap = document.getElementById('suffixRows');
      wrap.querySelectorAll('[data-row]').forEach(function (rowEl) {
        var i = parseInt(rowEl.getAttribute('data-row'), 10);
        rowEl.querySelector('.suffix-row-color').addEventListener('input', function () { rows[i].color = this.value; });
        rowEl.querySelector('.suffix-row-label').addEventListener('input', function () { rows[i].label = this.value; });
        rowEl.querySelector('.suffix-row-remove').addEventListener('click', function () { rows.splice(i, 1); renderRows(); });
      });
    }

    root.innerHTML = '<div class="modal-backdrop" id="suffixBackdrop"><div class="modal">' +
      '<h2>Suffixes</h2>' +
      '<p class="field-hint" style="margin-bottom:14px;">Colored tags any piece can wear, one at a time — pick the color, ' +
      'the label shows on the card in that color. Removing one here clears it from any piece wearing it, nothing else changes.</p>' +
      '<div id="suffixRows"></div>' +
      '<button class="btn btn-ghost" id="suffixAddRow" type="button" style="margin-top:2px;">+ Add suffix</button>' +
      '<div class="modal-actions"><button class="btn btn-ghost" id="suffixCancel" type="button">Cancel</button>' +
      '<button class="btn btn-primary" id="suffixSave" type="button">Save</button></div>' +
      '</div></div>';

    renderRows();
    document.getElementById('suffixBackdrop').addEventListener('click', function (e) { if (e.target.id === 'suffixBackdrop') closeModal(); });
    document.getElementById('suffixCancel').addEventListener('click', closeModal);
    document.getElementById('suffixAddRow').addEventListener('click', function () {
      rows.push({ id: 'new-' + (nextTempId++), label: '', color: '#2f9e56' });
      renderRows();
    });
    document.getElementById('suffixSave').addEventListener('click', async function () {
      var saveBtn = this;
      var cleaned = rows.map(function (r) { return { id: r.id, label: r.label.trim(), color: r.color }; })
        .filter(function (r) { return r.label; });
      if (rows.some(function (r) { return !r.label.trim(); }) && cleaned.length !== rows.length) {
        toast('Blank suffix names were dropped.');
      }
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

      var original = state.suffixes;
      // ids of rows that survived the edit and already existed server-side
      var keptExistingIds = cleaned.filter(function (r) { return original.some(function (o) { return o.id === r.id; }); })
        .map(function (r) { return r.id; });
      var toDelete = original.filter(function (o) { return keptExistingIds.indexOf(o.id) === -1; });
      var toInsert = cleaned.filter(function (r) { return String(r.id).indexOf('new-') === 0; });
      var toUpdate = cleaned.filter(function (r) {
        if (String(r.id).indexOf('new-') === 0) return false;
        var orig = original.find(function (o) { return o.id === r.id; });
        return orig && (orig.label !== r.label || orig.color !== r.color);
      });

      var ok = true;
      for (var i = 0; i < toDelete.length; i++) {
        var res = await sb.from('suffixes').delete().eq('id', toDelete[i].id);
        if (res.error) { ok = false; toast('Could not remove "' + toDelete[i].label + '".'); }
      }
      for (var j = 0; j < toUpdate.length; j++) {
        var r2 = toUpdate[j];
        var res2 = await sb.from('suffixes').update({ label: r2.label, color: r2.color }).eq('id', r2.id);
        if (res2.error) { ok = false; toast('Could not update "' + r2.label + '".'); }
      }
      if (toInsert.length) {
        var startOrder = cleaned.length - toInsert.length;
        var payload = toInsert.map(function (r, idx) { return { label: r.label, color: r.color, sort_order: startOrder + idx }; });
        var res3 = await sb.from('suffixes').insert(payload);
        if (res3.error) { ok = false; toast(res3.error.message.indexOf('duplicate') !== -1 ? 'A suffix with that name already exists.' : 'Could not add new suffix.'); }
      }
      // Reorder to match the on-screen list order (cheap: only the ones that moved).
      var reorderTargets = cleaned.filter(function (r) { return String(r.id).indexOf('new-') !== 0; });
      for (var k = 0; k < reorderTargets.length; k++) {
        var orig2 = original.find(function (o) { return o.id === reorderTargets[k].id; });
        if (orig2 && orig2.sort_order !== k) await sb.from('suffixes').update({ sort_order: k }).eq('id', reorderTargets[k].id);
      }

      await fetchSuffixes();
      renderAll();
      saveBtn.disabled = false; saveBtn.textContent = 'Save';
      if (ok) { toast('Suffixes saved.'); closeModal(); }
    });
  }

  /* Opens a plain, ink-light checklist of missing numbers in a new tab and

  /* ---------------- missing numbers finder ---------------- */

  function openMissingNumbersModal() {

    root.innerHTML = '<div class="modal-backdrop" id="missingBackdrop"><div class="modal modal-wide">' +
