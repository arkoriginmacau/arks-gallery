<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ark's Gallery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --canvas: #f1ece1;
    --paper: #faf7f0;
    --paper-2: #ffffff;
    --ink: #221f1c;
    --ink-2: var(--ink);
    --ink-on-accent: var(--paper-2);
    --ink-soft: #6b6459;
    --ink-soft-2: var(--ink-soft);
    --ink-faint: #9a9285;
    --ink-faint-2: var(--ink-faint);
    --line: #dbd1bd;
    --line-soft: #e8e0d0;
    --ochre: #a5661f;
    --ochre-ink: #7d4c17;
    --ochre-soft: #e9d6b2;
    --ochre-bg: #f4e9d3;
    --sold: #a53a2a;
    --sold-2: var(--sold);
    --ochre-card: var(--ochre);
    --sold-on-bg: var(--sold);
    --sold-ink: #7e2c20;
    --sold-soft: #ecd2cb;
    --sold-bg: #f7e3de;
    --not-for-sale: #2f5f8a;
    --toast-ink: var(--canvas);
    --hover-ink: var(--ink);
    --ochre-on-bg: var(--ochre);
    --ochre-readable: var(--ochre);
    --shadow: 220 20% 10%;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #17130f;
      --paper: #201a14;
      --paper-2: #241e17;
      --ink: #ece4d6;
      --ink-soft: #b2a894;
      --ink-faint: #7c7364;
      --line: #392f24;
      --line-soft: #2c251c;
      --ochre: #dc9d4f;
      --ochre-ink: #f0bd7d;
      --ochre-soft: #4c3a20;
      --ochre-bg: #33281a;
      --sold: #d97158;
      --sold-ink: #e8917a;
      --sold-soft: #4a2721;
      --sold-bg: #3a2019;
      --not-for-sale: #6ba3d6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #17130f;
    --paper: #201a14;
    --paper-2: #241e17;
    --ink: #ece4d6;
    --ink-soft: #b2a894;
    --ink-faint: #7c7364;
    --line: #392f24;
    --line-soft: #2c251c;
    --ochre: #dc9d4f;
    --ochre-ink: #f0bd7d;
    --ochre-soft: #4c3a20;
    --ochre-bg: #33281a;
    --sold: #d97158;
    --sold-ink: #e8917a;
    --sold-soft: #4a2721;
    --sold-bg: #3a2019;
    --not-for-sale: #6ba3d6;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 0 20px 64px;
    min-height: 100vh;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  h1, h2, h3, .display { font-family: 'Fraunces', Georgia, serif; text-wrap: balance; }

  a { color: inherit; }
  button { font-family: inherit; }

  /* ---------- shell ---------- */
  .wrap { max-width: 1120px; margin: 0 auto; }

  header.top {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    padding: 36px 0 22px;
    border-bottom: 1px solid var(--line);
  }
  .brand-eyebrow {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ochre-readable); font-weight: 600; margin: 0 0 6px;
  }
  header.top h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 600; margin: 0; line-height: 1.05; }
  .top-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--paper-2); color: var(--ink-2);
    padding: 10px 16px; border-radius: 3px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; line-height: 1; transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--ochre); }
  .btn:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
  .btn-primary { background: var(--ochre); border-color: var(--ochre); color: var(--ink-on-accent); }
  .btn-primary:hover { background: var(--ochre-ink); border-color: var(--ochre-ink); }
  .btn-ghost { background: transparent; border-color: transparent; padding: 10px 10px; }
  .btn-ghost:hover { border-color: var(--line); }
  .btn-sm { padding: 7px 11px; font-size: 12.5px; }
  .btn-danger { background: var(--sold-bg); border-color: var(--sold-2); color: var(--sold-2); }
  .btn-danger:hover { background: var(--sold-2); border-color: var(--sold-2); color: var(--paper); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn[disabled]:hover { border-color: var(--line); }

  /* ---------- admin / auth ---------- */
  .admin-pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line);
    padding: 6px 10px; border-radius: 20px;
  }
  .admin-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #4c8a5e; flex-shrink: 0; }
  .toast-root { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    background: var(--ink); color: var(--toast-ink); font-size: 13px; font-weight: 500;
    padding: 10px 18px; border-radius: 5px; box-shadow: 0 6px 24px rgba(0,0,0,.25);
    animation: toastIn .18s ease-out;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .view-badge {
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ---------- tabs ---------- */
  .tabbar {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    padding: 18px 0; margin-bottom: 6px;
  }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 8px 9px 16px; border-radius: 3px 3px 0 0;
    border: 1px solid transparent; border-bottom: none;
    cursor: pointer; font-weight: 600; font-size: 14.5px; color: var(--ink-soft);
    position: relative; top: 1px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    color: var(--ink); background: var(--paper); border-color: var(--line);
    box-shadow: 0 -1px 0 var(--paper);
  }
  .tab .prefix-chip {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
    color: var(--ochre-ink); background: var(--ochre-bg); border-radius: 3px;
    padding: 2px 6px; letter-spacing: .02em;
  }
  .tab .count { color: var(--ink-faint); font-size: 12px; font-weight: 500; }
  .tab-edit-btn {
    border: none; background: none; color: var(--ink-faint); cursor: pointer;
    padding: 3px; border-radius: 3px; display: flex;
  }
  .tab-edit-btn:hover { color: var(--ochre-on-bg); background: var(--ochre-bg); }
  .tab-add {
    padding: 9px 14px; border-radius: 3px; border: 1px dashed var(--line);
    background: none; color: var(--ink-faint); cursor: pointer; font-size: 13px; font-weight: 600;
    margin-left: 4px;
  }
  .tab-add:hover { color: var(--ochre-readable); border-color: var(--ochre-readable); }

  .panel {
    background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
    padding: 24px; min-height: 200px;
  }

  /* ---------- grid ---------- */
  .grid-toolbar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin-bottom: 18px; flex-wrap: wrap;
  }
  .grid-toolbar .tab-title { font-size: 20px; font-weight: 600; margin: 0; }
  .grid-toolbar .tab-sub { color: var(--ink-soft); font-size: 13px; margin-top: 2px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }

  .card {
    background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--line); border-radius: 4px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .card-image {
    position: relative; aspect-ratio: 4/3; overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  .card-image img, .card-image .swatch { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-image.move-ready { cursor: grab; }
  .card-image.moving { cursor: grabbing; touch-action: none; user-select: none; }
  .card-image.moving img { -webkit-user-drag: none; }
  .card-image.moving::before, .card-image.moving::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 6; animation: moveBlink .6s steps(1) infinite;
    background:
      linear-gradient(#e11,#e11) top left / 22px 4px no-repeat, linear-gradient(#e11,#e11) top left / 4px 22px no-repeat,
      linear-gradient(#e11,#e11) top right / 22px 4px no-repeat, linear-gradient(#e11,#e11) top right / 4px 22px no-repeat,
      linear-gradient(#e11,#e11) bottom left / 22px 4px no-repeat, linear-gradient(#e11,#e11) bottom left / 4px 22px no-repeat,
      linear-gradient(#e11,#e11) bottom right / 22px 4px no-repeat, linear-gradient(#e11,#e11) bottom right / 4px 22px no-repeat; }
  .card-image.moving::after { display: none; }
  @keyframes moveBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.card-image .swatch { display: flex; align-items: center; justify-content: center; }
  .card-image .swatch span {
    font-family: 'Fraunces', serif; font-size: 44px; color: rgba(255,255,255,.78);
    font-weight: 500;
  }
  .price-tag {
    position: absolute; left: 8px; bottom: 8px;
    background: var(--paper-2); border: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600;
    padding: 3px 8px; border-radius: 3px; font-variant-numeric: tabular-nums;
  }
  .sold-slash {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, transparent calc(50% - 1.6px), var(--sold) 50%, transparent calc(50% + 1.6px));
    opacity: .85;
  }
  .sold-stamp {
    position: absolute; left: 50%; top: 50%; pointer-events: none;
    transform: translate(-50%, -50%) rotate(-11deg);
    border: 3px solid var(--sold); color: var(--sold);
    font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 18px;
    text-transform: uppercase;
    letter-spacing: .14em; padding: 4px 14px 3px; border-radius: 4px;
    background: #faf7f0;
    box-shadow: 0 0 0 3px #faf7f0;
  }

  .expand-hint {
    position: absolute; right: 8px; bottom: 8px; width: 24px; height: 24px; border-radius: 5px;
    background: rgba(34,31,28,.55); color: #fff; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .12s; pointer-events: none;
  }
  .card-image:hover .expand-hint { opacity: 1; }

  /* "Not for sale" mirrors the sold slash/stamp, just in blue, and only
     shows when the piece isn't also marked sold (sold wins). */
  .notforsale-slash {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, transparent calc(50% - 1.6px), var(--not-for-sale) 50%, transparent calc(50% + 1.6px));
    opacity: .85;
  }
  .notforsale-stamp {
    position: absolute; left: 50%; top: 50%; pointer-events: none;
    transform: translate(-50%, -50%) rotate(-11deg);
    border: 3px solid var(--not-for-sale); color: var(--not-for-sale);
    font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 12.5px;
    text-transform: uppercase; white-space: nowrap;
    letter-spacing: .1em; padding: 4px 12px 3px; border-radius: 4px;
    background: #faf7f0;
    box-shadow: 0 0 0 3px #faf7f0;
  }
  .nfs-toggle {
    position: absolute; left: 8px; top: 8px; z-index: 2;
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700;
    letter-spacing: .04em; padding: 3px 7px; border-radius: 3px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.35); background: rgba(34,31,28,.55); color: #fff;
    transition: background .12s, border-color .12s;
  }
  .nfs-toggle:hover { background: rgba(34,31,28,.8); }
  .nfs-toggle.active { background: var(--not-for-sale); border-color: var(--not-for-sale); }

  /* Censored thumbnail: pixel-mosaic only the <img> itself, so every badge
     layered on top (price tag, sold/not-for-sale stamp, set badge) stays
     crisp. For a plain manually-censored piece the lightbox still points at
     the real full-size photo and opens sharp; for a "Hidden"-suffix piece
     no lightbox link is added at all (see the grid render), so there is no
     way to reach the original. Nothing about the stored files changes
     either way — pixelateCensoredThumbs() (below, in JS) does the actual
     mosaic work by drawing the real photo onto a small canvas and swapping
     the <img> src for that tiny result; this image-rendering rule is just
     what makes the browser upscale that tiny result in blocky squares
     instead of smoothing it back out. (An earlier pure-CSS version of this
     — a small layout box plus a scale() transform, no canvas — looked right
     on some images and rendered fully sharp on others depending on how the
     browser's compositor chose to resample the transform, which isn't
     something to gamble a "hidden" image's privacy on.) */
  .card-image.is-censored img {
    image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges;
  }
  .censored-badge {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .censored-chip {
    display: flex; align-items: center; gap: 6px;
    background: rgba(23,19,15,.65); color: #fff;
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.3);
  }
  .censor-toggle-btn.active { color: var(--ochre); }

  /* ---------- missing numbers finder ---------- */
  .missing-input-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 4px; }
  .missing-input-row .field { flex: 1; margin-bottom: 0; }
  .missing-summary { font-size: 13px; color: var(--ink-soft); margin: 16px 0 10px; }
  .missing-summary strong { color: var(--ink); }
  .missing-list { max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; }
  .missing-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); }
  .missing-row:last-child { border-bottom: none; }
  .missing-row .missing-num { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 13.5px; flex: 0 0 auto; min-width: 56px; }
  .missing-status-btns { display: flex; gap: 6px; margin-left: auto; }
  .missing-status-btn {
    font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 3px; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft);
  }
  .missing-status-btn:hover { border-color: var(--ochre); color: var(--ink); }
  .missing-status-btn.status-sold:hover { border-color: var(--sold); color: var(--sold); }
  .missing-status-btn.status-nfs:hover { border-color: var(--not-for-sale); color: var(--not-for-sale); }
  .missing-status-btn:disabled { opacity: .5; cursor: default; }
  .missing-row.is-logged .missing-num { color: var(--ink-faint); }
  .missing-logged-tag { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); display: flex; align-items: center; gap: 10px; }
  .missing-undo-btn { font-size: 11px; color: var(--ink-faint); text-decoration: underline; background: none; border: none; cursor: pointer; padding: 0; }
  .missing-undo-btn:hover { color: var(--ink); }

  /* ---------- painting sets ---------- */
  /* Badge on a card whose piece belongs to a set with 2+ tagged members —
     click opens the set overlay. Sits top-right, mirroring nfs-toggle's
     top-left, so it never collides with it in admin view. */
  .set-badge {
    position: absolute; right: 8px; top: 8px; z-index: 2;
    display: flex; align-items: center; gap: 4px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700;
    letter-spacing: .04em; padding: 3px 7px 3px 6px; border-radius: 3px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.35); background: rgba(34,31,28,.55); color: #fff;
    transition: background .12s;
  }
  /* The pill itself is ~70×21px — well under the ~44px a thumb reliably
     lands on — sitting right on top of the much bigger photo, which has
     its own tap target (opens the full-size image, and on the embedded
     Wix site that's a window.open() a mobile browser's popup blocker can
     silently swallow). A slightly-off tap on a real phone misses the
     badge, hits the photo instead, and the "view the set" action never
     fires — reads as the button doing nothing. This ::before pads the
     actual hit area out to a proper touch-target size on every side that
     faces open image (not the opposite top-left corner, where the N/S
     admin toggle sits) without changing how the pill itself looks. */
  .set-badge::before { content: ''; position: absolute; top: -10px; right: -10px; bottom: -16px; left: -8px; }
  .set-badge:hover { background: rgba(34,31,28,.8); }
  .set-assign-btn.has-set { color: var(--ochre); }

  /* Attention ring on the Set badge — a dot travels the pill's outline,
     switching red/white as it goes, on an endless loop. Pure CSS (no
     images or scripts), so it adds effectively nothing to load time. */
  .set-badge-ring { position: absolute; inset: 0; border-radius: 3px; pointer-events: none; }
  .set-badge-ring::before {
    content: ''; position: absolute; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; background: #ff2d2d; box-shadow: 0 0 5px 1.5px rgba(255,45,45,.85);
    offset-path: inset(0 round 3px); offset-distance: 0%;
    animation: set-badge-run-lap 2.4s linear infinite;
  }
  @keyframes set-badge-run-lap {
    0%    { offset-distance: 0%;   background: #ff2d2d; box-shadow: 0 0 5px 1.5px rgba(255,45,45,.85); }
    49.9% { background: #ff2d2d; box-shadow: 0 0 5px 1.5px rgba(255,45,45,.85); }
    50%   { offset-distance: 50%;  background: #ffffff; box-shadow: 0 0 5px 1.5px rgba(255,255,255,.85); }
    99.9% { background: #ffffff; box-shadow: 0 0 5px 1.5px rgba(255,255,255,.85); }
    100%  { offset-distance: 100%; background: #ff2d2d; box-shadow: 0 0 5px 1.5px rgba(255,45,45,.85); }
  }

  .set-modal-backdrop {
    position: fixed; inset: 0; background: rgba(23,19,15,.55);
    display: flex; align-items: center; justify-content: center;
    padding: 4vh 16px; overflow-y: auto; z-index: 55;
  }
  .set-modal {
    position: relative;
    background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
    width: 100%; max-width: 860px; padding: 26px 26px 22px; margin: auto;
  }
  .set-modal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 4px; padding-right: 40px; }
  .set-modal h2 { font-size: 18px; margin: 0; font-weight: 600; }
  .set-modal .set-count { font-size: 12px; color: var(--ink-faint); font-family: 'IBM Plex Mono', monospace; }
  .set-modal-close {
    position: absolute; top: 16px; right: 16px; width: 34px; height: 34px; border-radius: 50%;
    background: none; border: 1px solid var(--line); color: var(--ink-soft); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .set-modal-close:hover { background: var(--line-soft); color: var(--ink); }
  .set-row {
    display: flex; justify-content: center; flex-wrap: wrap;
    gap: 4px; padding: 6px 0 2px;
  }
  /* When there's room, pieces overlap slightly like a fanned hand of cards;
     hovering one lifts it clear so it can be read/clicked without the
     overlap getting in the way. On narrow screens they wrap to their own
     rows and the overlap collapses via the media query below. */
  .set-piece {
    position: relative; width: 168px; flex: 0 0 auto; cursor: pointer;
    transition: transform .15s ease, z-index 0s;
    margin: 0 -22px 0 0;
  }
  .set-row[data-count="1"] .set-piece,
  .set-row[data-count="2"] .set-piece,
  .set-row[data-count="3"] .set-piece { margin-right: 0; }
  .set-piece:hover { transform: translateY(-8px) scale(1.04); z-index: 5; }
  .set-piece-img {
    width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 4px;
    border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,.18);
    display: block; background: var(--paper-2);
  }
  .set-piece-cap { margin-top: 6px; font-size: 11px; text-align: center; color: var(--ink-soft-2); line-height: 1.3; }
  .set-piece-cap .mono { display: block; font-size: 10px; color: var(--ink-faint); margin-top: 1px; }
  @media (max-width: 620px) {
    /* Narrow screens don't wrap into a cramped 2-up grid anymore -- the
       row becomes a horizontally swipeable strip instead, so each piece
       stays big enough to actually see. Desktop (above 620px) never
       enters this block, so the PC layout is untouched. */
    .set-row {
      flex-wrap: nowrap; justify-content: flex-start;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory; scrollbar-width: none;
      gap: 10px;
    }
    .set-row::-webkit-scrollbar { display: none; }
    .set-piece {
      width: 62%; flex: 0 0 auto; margin-right: 0 !important;
      scroll-snap-align: start;
    }
    .set-piece:hover { transform: none; } /* avoid a stuck hover-lift after a tap */
  }

  .lightbox-backdrop {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%; box-sizing: border-box;
    background: rgba(12, 10, 8, .92); z-index: 90;
    display: flex; align-items: center; justify-content: center; padding: 5%;
    overflow: hidden;
  }
  .lightbox-img {

  .inline-field { cursor: text; border-radius: 2px; }

  /* A suffix is a small admin-managed vocabulary of colored tags (see
     openSuffixManagerModal) — "Painting set" is the first, more follow
     later, each with its own color, Diablo-rarity style. A piece carries
     at most one. The color itself always comes from the suffix record, so
     recoloring or renaming one updates every card wearing it at once. */
  .suffix-tag {
    text-align: center; font-size: 12.5px; font-weight: 600; letter-spacing: .01em;
    margin-top: 6px; margin-bottom: 6px;
  }
  /* "In Progress" is the one suffix that gets an animated rainbow fill
     instead of the usual flat suffix color (see the suffix ? ... render
     line) — pure CSS, no images/canvas, negligible cost even with many of
     these on screen at once since only background-position is animated.
     prefers-reduced-motion freezes it to a still gradient instead of
     turning it off outright, so the tag still reads as "special" for
     anyone who's asked their OS to cut down on motion. Print has no use
     for a hue-cycling animation and some print engines render
     background-clip:text as invisible text, so print gets a plain solid
     color instead of gambling on that. */
  .suffix-tag.rainbow {
    background: linear-gradient(90deg, #ff0000, #ff9900, #ffff00, #33ff00, #00ffee, #3300ff, #ff00cc, #ff0000);
    background-size: 300% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: suffixRainbow 4s linear infinite;
  }
  @keyframes suffixRainbow { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
  @media (prefers-reduced-motion: reduce) { .suffix-tag.rainbow { animation: none; background-position: 0% 50%; } }
  @media print { .suffix-tag.rainbow { background: none; -webkit-text-fill-color: currentColor; color: #b0479a; } }

  /* "Pending for remake" gets the same treatment as "In Progress" above,
     just a red pulse instead of a full rainbow — same mechanism, same
     reduced-motion and print fallbacks, different gradient/keyframe name so
     the two don't collide if a piece could ever carry both animated
     styles' CSS at once. */
  .suffix-tag.redshift {
    background: linear-gradient(90deg, #3a0000, #7a0000, #b30000, #ff1a1a, #ff6666, #ff1a1a, #b30000, #7a0000, #3a0000);
    background-size: 300% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: suffixRedshift 4s linear infinite;
  }
  @keyframes suffixRedshift { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
  @media (prefers-reduced-motion: reduce) { .suffix-tag.redshift { animation: none; background-position: 0% 50%; } }
  @media print { .suffix-tag.redshift { background: none; -webkit-text-fill-color: currentColor; color: #b30000; } }
  /* Wraps the optional suffix tag + the footer as one unit and pins the

     every card, so they line up across a grid row regardless of how long
     the description above happens to be. */

  .pa-head-text { display: flex; flex-direction: column; align-items: flex-end; gap: 0.6mm; text-align: right; }
  .pa-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 6mm; border-bottom: 0.5mm solid #1a1712; padding-bottom: 2.5mm; margin-bottom: 4mm; }
  .pa-header h3 { font-family: 'Fraunces', serif; font-size: 6mm; margin: 0; font-weight: 600; }
  .pa-header .pa-hsite { font-family: 'IBM Plex Mono', monospace; font-size: 2.8mm; color: #6b6459; }
  .pa-grid { flex: 1; min-height: 0; display: grid; gap: 4mm; }
  .pa-cell { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; border: 0.25mm solid #e2dacb; border-radius: 1mm; padding: 2mm; break-inside: avoid; }
  .pa-cell.no-border { border-color: transparent; }
  .pa-photo { flex: 1; min-height: 8mm; position: relative; overflow: hidden; border-radius: 0.6mm; background: #f3efe7; }
  .pa-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .pa-photo.contain img { object-fit: contain; }
  .pa-photo.swatch { display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; color: rgba(255,255,255,.85); font-size: calc(7mm * var(--s)); }
  .pa-photo.hidden-photo { display: flex; align-items: center; justify-content: center; color: #9a9285; font-family: 'Archivo', sans-serif; font-size: calc(2.4mm * var(--s)); text-transform: uppercase; letter-spacing: .06em; }
  .pa-text { padding-top: 1.6mm; display: flex; flex-direction: column; gap: 0.5mm; flex-shrink: 0; }
  .pa-cell.text-only .pa-text { padding-top: 0; }
  .pa-top { display: flex; justify-content: space-between; align-items: baseline; gap: 2mm; }
  .pa-num { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: calc(2.8mm * var(--s)); }
  .pa-status { font-family: 'Archivo', sans-serif; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: calc(2.2mm * var(--s)); color: #6b6459; white-space: nowrap; }
  .pa-status.sold { color: #a53a2a; }
  .pa-status.nfs { color: #2f5f8a; }
  .pa-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: calc(3.5mm * var(--s)); line-height: 1.2; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .pa-meta { font-family: 'IBM Plex Mono', monospace; font-size: calc(2.4mm * var(--s)); color: #6b6459; }
  .pa-price { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: calc(3mm * var(--s)); }
  .pa-cell.sold .pa-price, .pa-cell.sold .pa-name { color: #a53a2a; }
  .pa-desc { font-size: calc(2.4mm * var(--s)); color: #4a443b; line-height: 1.35; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--dl, 3); overflow: hidden; }
  .pa-footer { display: flex; justify-content: space-between; align-items: flex-end; gap: 6mm; border-top: 0.25mm solid #d9cfbc; padding-top: 3mm; margin-top: 4mm; }
  .pa-foot-left { display: flex; align-items: center; gap: 4mm; min-width: 0; }
  .pa-qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 1mm; flex-shrink: 0; }
  .pa-qr { width: 17mm; height: 17mm; flex-shrink: 0; }
  .pa-scanme { font-family: 'Archivo', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; font-size: 2.4mm; color: #1a1712; }
  .pa-qr img, .pa-qr svg { width: 100%; height: 100%; object-fit: contain; display: block; }
  .pa-foot-text { display: flex; flex-direction: column; gap: 0.8mm; min-width: 0; }
  .pa-qr-label { font-family: 'Archivo', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 2.3mm; color: #6b6459; }
  .pa-site { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 3mm; color: #1a1712; overflow-wrap: anywhere; }
  .pa-contact { font-size: 2.6mm; color: #6b6459; }
  .pa-pnum { font-family: 'IBM Plex Mono', monospace; font-size: 2.6mm; color: #9a9285; white-space: nowrap; }

  .a4 { width: 210mm; height: 297mm; }
  .a3 { width: 297mm; height: 420mm; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; left: 0; top: 0; margin: 0; padding: 0; }
    .print-scroll { overflow: visible; }
    .page-stack { gap: 0; align-items: flex-start; }
    .print-page { box-shadow: none; page-break-after: always; }
    .print-page:last-child { page-break-after: auto; }
  }

  #printPageStyle { display: none; }

  /* Red blinking X in the top-right corner of the print planner — closes it. */
  #printView { position: relative; padding-top: 52px; }
  @media print { #printView { padding-top: 0; position: static; } }
  .print-close {
    position: absolute; top: 8px; right: 12px; z-index: 20;
    width: 40px; height: 40px; padding: 0; border: 0; background: none;
    color: #b00020; display: flex; align-items: center; justify-content: center;
    cursor: pointer; animation: printCloseBlink 1.1s ease-in-out infinite;
  }
  .print-close:hover { animation-play-state: paused; opacity: 1; color: #8a0019; }
  .print-close:focus-visible { outline: 2px solid #b00020; outline-offset: 2px; border-radius: 4px; }
  @keyframes printCloseBlink { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
  @media (max-width: 640px) { .print-close { top: 6px; right: 6px; } }
  @media print { .print-close { display: none !important; } }

  /* Admin-chosen grid layout (see openGridLayoutModal). "Auto" keeps the
     plain auto-fill rule above; a fixed count overrides it on either device. */
  .grid.fixed-cols { grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr)); }
  .grid.fixed-cols .card { min-width: 0; }
  .grid-pager { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 22px; }
  .grid-pager:empty { display: none; }
  .grid-pager button.pg { min-width: 36px; height: 36px; padding: 0 8px; border: 1px solid var(--line); background: var(--paper-2); color: var(--ink-2); border-radius: 4px; cursor: pointer; font: inherit; font-variant-numeric: tabular-nums; }
  .grid-pager button.pg.on { background: var(--ochre); border-color: var(--ochre); color: #fff; }
  .grid-pager button.pg:disabled { opacity: .4; cursor: default; }
  .grid-pager .pg-gap { color: var(--ink-faint); padding: 0 2px; }
  .grid-pager .pg-info { width: 100%; text-align: center; font-size: 12px; color: var(--ink-soft); }
  .grid-layout-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0 4px; }
  .grid-layout-cols fieldset { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px 4px; margin: 0; min-width: 0; }
  .grid-layout-cols legend { font-weight: 600; font-size: 13px; padding: 0 6px; }
  .grid-layout-cols select { width: 100%; }
  .grid-layout-calc { font-size: 12px; color: var(--ochre-readable); margin-bottom: 10px; min-height: 2.8em; }
  @media (max-width: 520px) { .grid-layout-cols { grid-template-columns: 1fr; } }
  @media print { .grid-pager { display: none; } }

  @media (max-width: 640px) {
    header.top { padding-top: 24px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .grid.fixed-cols.dense { gap: 8px; }
    /* 3-4 columns on a phone: stack label over value and tighten the card so text fits */
    .grid.fixed-cols.dense .card-body { padding: 8px 8px 9px; gap: 4px; }
    .grid.fixed-cols.dense .card-name { font-size: 13px; }
    .grid.fixed-cols.dense .card-meta { flex-direction: column; gap: 0; font-size: 11px; }
    .grid.fixed-cols.dense .card-meta > span:not(.field-label) { overflow-wrap: anywhere; }
    .grid.fixed-cols.dense .field-label { font-size: 8.5px; }
    .print-toolbar { padding: 14px; gap: 14px; }
  }
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <p class="brand-eyebrow">Arkorigin Studio</p>
      <h1>Ark's Gallery</h1>
    </div>
    <div class="top-actions" id="topActions"></div>
  </header>

  <nav class="tabbar" id="tabbar"></nav>

  <main class="panel" id="browseView">
    <div class="grid-toolbar">
      <div>
        <p class="tab-title" id="tabTitle">&nbsp;</p>
        <p class="tab-sub" id="tabSub"></p>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="grid-pager" id="gridPager"></div>
  </main>

  <main class="panel" id="printView" hidden></main>
</div>

<div id="modalRoot"></div>
<div id="lightboxRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
(function () {
  "use strict";

  /* ---------------- Cloudflare backend config ----------------

  var ADMIN_EMAIL = 'arkoriginmacau@gmail.com';
  var IMAGE_BASE = 'https://arks-gallery-images.arkoriginmacau.workers.dev';
  var SESSION_KEY = 'arks_admin_session';

  /* Small client that keeps the same call shape the rest of this file

  var sb = (function () {
    var listeners = [];
    function readSession() {
      try {

        if (!s || !s.token || !s.expires_at || s.expires_at < Date.now() / 1000) return null;

      } catch (e) { return null; }
    }

    function Query(table) {
      this.table = table; this.op = null; this.values = null; this.filters = [];
      this.orderBy = null; this.returning = false; this.mode = null;
    }
    Query.prototype.select = function () { if (this.op) this.returning = true; else this.op = 'select'; return this; };
    Query.prototype.insert = function (v) { this.op = 'insert'; this.values = v; return this; };
    Query.prototype.update = function (v) { this.op = 'update'; this.values = v; return this; };
    Query.prototype.upsert = function (v) { this.op = 'upsert'; this.values = v; return this; };
    Query.prototype.delete = function () { this.op = 'delete'; return this; };
    Query.prototype.eq = function (col, val) { this.filters.push({ col: col, val: val }); return this; };
    Query.prototype.order = function (col, opts) { this.orderBy = { col: col, ascending: !(opts && opts.ascending === false) }; return this; };

    Query.prototype.maybeSingle = function () { this.mode = 'maybe'; return this; };

      try {
        var headers = { 'Content-Type': 'application/json' };
        var sess = readSession();
        if (sess) headers.Authorization = 'Bearer ' + sess.access_token;
        var res = await fetch(IMAGE_BASE + '/api/db', {
          method: 'POST', headers: headers,
          body: JSON.stringify({ table: this.table, op: this.op, values: this.values, filters: this.filters,
            order: this.orderBy, returning: this.returning })
        });

        if (!res.ok) return { data: null, error: { message: body.error || ('Request failed (' + res.status + ')') } };
        var rows = body.rows || [];
        if (this.op === 'select' || this.returning) {
          if (this.mode === 'single') {
            if (rows.length !== 1) return { data: null, error: { message: 'Expected one row, got ' + rows.length } };
            return { data: rows[0], error: null };
          }
          if (this.mode === 'maybe') return { data: rows[0] || null, error: null };
          return { data: rows, error: null };

    };

      from: function (table) { return new Query(table); },
      auth: {

        onAuthStateChange: function (cb) { listeners.push(cb); },

            if (!res.ok) return { error: { message: body.error || 'Could not send the sign-in link' } };

        verifyLink: async function (token) {

            var res = await fetch(IMAGE_BASE + '/api/auth/verify', {

  }

  var isEmbedded = (function () {

  })();

  /* ---------------- site theme (admin-editable, applies for every visitor) ---------------- */
  var THEME_VARS = [
    { varName: '--canvas', label: 'Background' },
    { varName: '--paper', label: 'Panels' },
    { varName: '--paper-2', label: 'Cards' },
    { varName: '--ink', label: 'Text' },
    { varName: '--ink-soft', label: 'Muted text' },
    { varName: '--ochre', label: 'Accent' },

  /* ---------------- toast ---------------- */
  function toast(msg) {
    var root = document.getElementById('toastRoot');
    var el = document.createElement('div');

    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () { el.remove(); }, 3400);
  }

  /* ---------------- helpers ---------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtPrice(n) {
    if (n === '' || n == null || isNaN(n)) return '—';
    return '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }
  function fmtDate(d) {
    if (!d) return '—';
    return String(d).replace(/-/g, '/');
  }
  function tabById(id) { return state.tabs.find(function (t) { return t.id === id; }); }
  /* No-prefix tabs only ever collect a year (see openPaintingModal), stored
     as Jan 1 of that year since the database needs a full date — so when
     displaying a piece from one of those tabs, show just the year rather
     than a misleading "2024/01/01". */
  function fmtPieceDate(p) {
    var t = tabById(p.tab_id);
    var isYearOnly = !!(t && !t.prefix);
    var all = [p.date].concat(Array.isArray(p.extra_dates) ? p.extra_dates : []).filter(Boolean);
    if (!all.length) return '—';
    all.sort();
    var parts = all.map(function (d) { return isYearOnly ? String(d).slice(0, 4) : fmtDate(d); });
    var seen = {};
    parts = parts.filter(function (s) { if (seen[s]) return false; seen[s] = true; return true; });
    return parts.join(', ');
  }
  function catalogNum(p) {
    var t = tabById(p.tab_id);
    return ((t && t.prefix) || '') + (p.number || '');
  }

  /* Numbers are usually plain ("13"), but some pieces use a compound
     format like "06-1-1-4" (initial number 06, set 1, piece 1 of 4).
     For sequencing we only care about that leading initial number —
     the set/piece parts are ignored for now. */
  function initialNumber(raw) {
    if (raw === null || raw === undefined) return null;
    var m = String(raw).match(/\d+/);
    if (!m) return null;
    return parseInt(m[0], 10);
  }
  /* Display order follows the catalogue number, not upload order —
     editing a piece's number moves it to match, wherever it's listed.
     Pieces with no parseable number sort after numbered ones, keeping
     their relative order. */
  function sortByNumber(list) {
    return list.slice().sort(function (a, b) {
      var na = initialNumber(a.number), nb = initialNumber(b.number);
      if (na === null && nb === null) return 0;
      if (na === null) return 1;
      if (nb === null) return -1;
      return nb - na;
    });
  }
  /* A piece belongs to a set when an admin has tagged it with a set_id —
     a plain per-tab bucket number typed by hand (see openSetPrompt). Two
     pieces are in the same set when they share both tab_id and set_id.
     Ordered by catalogue number ascending (1 of N first) rather than the
     gallery's newest-first order, since a set reads front-to-back. */
  function setMembers(p) {
    if (!p || p.set_id === null || p.set_id === undefined || p.set_id === '') return [];
    return state.paintings
      .filter(function (x) { return x.tab_id === p.tab_id && String(x.set_id) === String(p.set_id); })
      .sort(function (a, b) {
        var na = initialNumber(a.number), nb = initialNumber(b.number);
        if (na === null && nb === null) return 0;
        if (na === null) return 1;
        if (nb === null) return -1;
        return na - nb;
      });
  }
  function nextNumberForTab(tabId) {
    var max = null;
    state.paintings.forEach(function (p) {
      if (p.tab_id !== tabId) return;

    });

  }
  function publicImgUrl(path) {
    if (!path) return null;
    return IMAGE_BASE + '/' + encodePath(path);
  }
  async function r2AuthHeader() {
    var sess = await sb.auth.getSession();
    var token = sess && sess.data && sess.data.session && sess.data.session.access_token;
    return token ? { Authorization: 'Bearer ' + token } : null;
  }
  /* Same shape as the old Supabase call: resolves to { error } (null on success). */
  async function r2Upload(path, blob, contentType) {
    try {
      var auth = await r2AuthHeader();
      if (!auth) return { error: new Error('Not signed in') };
      var headers = { 'Content-Type': contentType || 'application/octet-stream' };
      headers.Authorization = auth.Authorization;
      var res = await fetch(IMAGE_BASE + '/' + encodePath(path), { method: 'PUT', headers: headers, body: blob });

      return { error: null };
    } catch (e) { return { error: e }; }
  }
  async function r2Remove(paths) {
    var auth = await r2AuthHeader();
    if (!auth) return;
    await Promise.all(paths.map(function (p) {
      return fetch(IMAGE_BASE + '/' + encodePath(p), { method: 'DELETE', headers: auth }).catch(function () {});
    }));
  }
  /* A "Dont Exist" placeholder: a catalogue number that was never painted.
     Shown as a plain black tile — no photo, so it can't be opened/zoomed. */
  function isNoPiece(p) {
    return !p.thumb_path && !p.image_path && /^\s*don['\u2019]?t\s+exist\s*$/i.test(p.name || '');
  }

    return 'linear-gradient(135deg, hsl(' + hue + ' 46% 42%), hsl(' + ((hue + 40) % 360) + ' 40% 28%))';

  /* Decodes a photo once and produces two uploads from it:

         CSS box is always a mild downscale from the stored file, however
         high the viewer's screen density — a big enough safety margin that
         the browser's own image scaling doesn't need any help to avoid
         aliasing on fine, regular detail like a canvas' woven texture.

         (falling back to JPEG if the browser can't produce a WebP blob).
         Camera-original photos are routinely 6000-8000px on the long

     downscale is always a mild ratio the browser handles cleanly on its
     own, rather than trying to out-guess it with a blur.) */
  function drawHQDownscale(source, srcW, srcH, destW, destH) {
    var curSource = source, curW = srcW, curH = srcH;
    while (curW * 0.5 > destW && curH * 0.5 > destH) {
      var nextW = Math.max(1, Math.round(curW * 0.5));
      var nextH = Math.max(1, Math.round(curH * 0.5));
      var stepCanvas = document.createElement('canvas');
      stepCanvas.width = nextW; stepCanvas.height = nextH;
      var sctx = stepCanvas.getContext('2d');
      sctx.imageSmoothingEnabled = true;
      sctx.imageSmoothingQuality = 'high';
      sctx.drawImage(curSource, 0, 0, curW, curH, 0, 0, nextW, nextH);
      curSource = stepCanvas; curW = nextW; curH = nextH;
    }
    var finalCanvas = document.createElement('canvas');
    finalCanvas.width = destW; finalCanvas.height = destH;
    var fctx = finalCanvas.getContext('2d');
    fctx.imageSmoothingEnabled = true;
    fctx.imageSmoothingQuality = 'high';
    fctx.drawImage(curSource, 0, 0, curW, curH, 0, 0, destW, destH);
    return finalCanvas;
  }

  function processPhoto(file, thumbMaxDim, thumbQuality) {
    return new Promise(function (resolve) {
      var fallback = { fullBlob: file, thumbBlob: null, reencoded: false };
      if (!file || !/^image\//.test(file.type) || file.type === 'image/gif' || file.type === 'image/svg+xml') {
        resolve(fallback);
        return;
      }
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) { URL.revokeObjectURL(url); resolve(fallback); return; }

        /* The "full" image is what the lightbox zoom view serves — it is
           NOT the untouched camera original. Camera photos routinely land
           at 6000-8000px on the long edge (40-60+ megapixels); no screen
           can show anywhere near that, and downloading it just to view a
           painting zoomed in was the actual cause of the slow zoom load.
           Cap it at a size that still shows individual brushstrokes
           clearly on any display (including a 2x/3x retina screen) while
           being a fraction of the download. */
        var ZOOM_MAX_DIM = 1600;
        var fScale = Math.min(1, ZOOM_MAX_DIM / Math.max(w, h));
        var fw = Math.max(1, Math.round(w * fScale)), fh = Math.max(1, Math.round(h * fScale));
        var fullCanvas = drawHQDownscale(img, w, h, fw, fh);

        var tScale = Math.min(1, thumbMaxDim / Math.max(w, h));
        var tw = Math.max(1, Math.round(w * tScale)), th = Math.max(1, Math.round(h * tScale));
        var thumbCanvas = drawHQDownscale(img, w, h, tw, th);

        var MAX_FULL_BYTES = 15 * 1024 * 1024;
        function finishFull(fullBlob) {
          thumbCanvas.toBlob(function (thumbBlob) {
            URL.revokeObjectURL(url);
            var reencoded = !!fullBlob && fullBlob.size < file.size;
            resolve({
              fullBlob: reencoded ? fullBlob : file,
              thumbBlob: thumbBlob || null,
              reencoded: reencoded
            });
          }, 'image/jpeg', thumbQuality || 0.72);
        }
        function encodeFullJpegFallback() {
          fullCanvas.toBlob(function (jpegBlob) { finishFull(jpegBlob); }, 'image/jpeg', 0.9);
        }
        function encodeFull(quality, attempts) {
          fullCanvas.toBlob(function (fullBlob) {
            if (!fullBlob) { encodeFullJpegFallback(); return; } // browser can't encode WebP — fall back to JPEG
            if (fullBlob.size > MAX_FULL_BYTES && quality > 0.6 && attempts < 4) {
              encodeFull(quality - 0.1, attempts + 1);
              return;
            }
            finishFull(fullBlob);
          }, 'image/webp', quality);
        }
        encodeFull(0.85, 0);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(fallback); };
      img.src = url;
    });
  }

  /* Grid layout (columns / rows per page, separately for PC and mobile), kept in

    desktop: { cols: 'auto', rows: 'all', mode: 'pages', descLines: 4 },

    var out = JSON.parse(JSON.stringify(GRID_LAYOUT_DEFAULTS));

      var r = raw && raw[d];
      if (!r) return;
      if (r.cols === 'auto' || (+r.cols >= 1 && +r.cols <= 8)) out[d].cols = r.cols === 'auto' ? 'auto' : +r.cols;

  /* Advanced print settings — the admin can save them as the default for

  /* ---------------- export to Excel ----------------
     One sheet per tab with Date / Number / Name / Size, styled like the
     hand-made inventory sheet. Print any sheet to PDF and bring it back with
     "Import from PDF" — the columns are in the order that importer expects. */
  function loadExcelJs() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
      sc.onload = function () { window.ExcelJS ? resolve(window.ExcelJS) : reject(new Error('ExcelJS missing')); };
      sc.onerror = function () { reject(new Error('ExcelJS failed to load')); };
      document.head.appendChild(sc);
    });
  }
  function inventoryRowsForTab(tab) {
    var list = state.paintings.filter(function (p) { return p.tab_id === tab.id; });
    list.sort(function (a, b) {
      var na = initialNumber(a.number), nb = initialNumber(b.number);
      if (na === null && nb === null) return String(a.number || '').localeCompare(String(b.number || ''), undefined, { numeric: true });
      if (na === null) return 1;
      if (nb === null) return -1;
      if (na !== nb) return na - nb;
      return String(a.number || '').localeCompare(String(b.number || ''), undefined, { numeric: true });
    });
    return list.map(function (p) {
      var name = p.name || '';
      var isNone = /^\s*don['\u2019]?t\s+exist\s*$/i.test(name);
      var size = String(p.size || '').replace(/(\d)\s*[x\u00d7]\s*(\d)/i, '$1x$2');
      return [p.date ? String(p.date).slice(0, 10) : '', catalogNum(p), name, size || (isNone ? '---' : '')];
    });
  }
  function buildInventoryWorkbook(ExcelJS, sheets) {
    var wb = new ExcelJS.Workbook();
    var used = {};
    sheets.forEach(function (sh) {
      var nm = String(sh.name || 'Sheet').replace(/[\[\]:*?\/\\]/g, ' ').trim().slice(0, 31) || 'Sheet';
      var base = nm, k = 2;
      while (used[nm.toLowerCase()]) { nm = base.slice(0, 28) + ' ' + (k++); }
      used[nm.toLowerCase()] = true;
      var ws = wb.addWorksheet(nm, { views: [{ state: 'frozen', ySplit: 1 }] });
      ws.columns = [{ width: 14 }, { width: 18 }, { width: 40 }, { width: 20 }];
      var thin = { style: 'thin', color: { argb: 'FFBFBFBF' } };
      var border = { top: thin, left: thin, bottom: thin, right: thin };
      var head = ws.addRow(['Date', 'Number', 'Name', 'Size']);
      head.eachCell(function (c) {
        c.font = { name: 'Arial', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
        c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2C3E50' } };
        c.alignment = { vertical: 'middle' };
        c.border = border;
      });
      sh.rows.forEach(function (r, i) {
        var row = ws.addRow(r);
        row.eachCell({ includeEmpty: true }, function (c) {
          c.font = { name: 'Arial', size: 11 };
          c.alignment = { vertical: 'middle' };
          c.border = border;
          c.numFmt = '@';
          if (i % 2 === 0) c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF2F2F2' } };
        });
      });
    });
    return wb;
  }
  async function exportInventoryXlsx() {
    if (!state.tabs.length) { toast('Nothing to export yet.'); return; }
    toast('Building Excel file…');
    try {
      var ExcelJS = await loadExcelJs();
      var wb = buildInventoryWorkbook(ExcelJS, state.tabs.map(function (t) {
        return { name: t.name, rows: inventoryRowsForTab(t) };
      }));
      var buf = await wb.xlsx.writeBuffer();
      var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'painting_inventory.xlsx';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      toast('Downloaded painting_inventory.xlsx (one sheet per tab).');
    } catch (e) {
      toast('Could not build the Excel file — check your connection and try again.');
    }
  }

  /* ---------------- export as a re-importable PDF ----------------
     A plain, monospaced listing of the CURRENT gallery — one line per
     painting, in exactly the shape "Import from PDF" reads back
     (optional date, catalogue number, name, size) — so this file can
     become the running master copy: download it, note additions or
     removals, hand-correct anything, then bring it straight back in
     with Import from PDF next time the count has moved.
     Note: the built-in PDF font here only covers Latin text. A name
     written in Japanese, Chinese or similar won't render in this
     download — it'll come out blank on that line — though re-importing
     the same painting's *number* still works fine since matching never
     depends on the name. */
  function loadScriptOnce(src) {
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = src;
      sc.onload = function () { resolve(); };
      sc.onerror = function () { reject(new Error('script failed to load: ' + src)); };
      document.head.appendChild(sc);
    });
  }
  function loadJsPdf() {
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
    // Two mirrors are tried in order: some CDNs occasionally prune an exact
    // pinned version (this happened to the cdnjs copy of 2.5.2), so a single
    // hardcoded URL is a single point of failure for this button.
    var urls = [
      'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js'
    ];
    var i = 0;
    function tryNext() {
      if (i >= urls.length) return Promise.reject(new Error('jsPDF failed to load'));
      var url = urls[i++];
      return loadScriptOnce(url).then(function () {
        if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
        return tryNext();
      }, function () {
        return tryNext();
      });
    }
    return tryNext();
  }
  function padTo(str, len) { str = String(str || ''); return str.length >= len ? str + '  ' : str + new Array(len - str.length + 2).join(' '); }
  /* jsPDF's built-in helvetica/courier fonts only cover WinAnsi/Latin-1
     glyphs. Passing a string with CJK (or other non-Latin) characters to
     doc.text() doesn't just render those characters blank — it corrupts the
     ENTIRE line's text encoding in the PDF, including the date/number/size
     columns that Import from PDF depends on for matching. So every string
     handed to doc.text() is sanitized down to printable ASCII first; a
     shortened name is fine, a garbled catalogue number is not. */
  function sanitizeForPdf(str) { return String(str || '').replace(/[^\x20-\x7E]/g, ''); }
  async function exportInventoryPdf() {
    if (!state.tabs.length) { toast('Nothing to export yet.'); return; }
    toast('Building PDF…');
    try {
      var jsPDF = await loadJsPdf();
      var doc = new jsPDF({ unit: 'pt', format: 'a4' });
      var marginX = 36, top = 44, bottom = 800, lineH = 13;
      var first = true;
      state.tabs.forEach(function (tab) {
        var rows = inventoryRowsForTab(tab);
        if (!rows.length) return;
        if (!first) doc.addPage(); first = false;
        var y = top;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
        doc.text(sanitizeForPdf(tab.name + (tab.prefix ? ' (' + tab.prefix + ')' : '')), marginX, y);
        y += 20;
        doc.setFont('courier', 'normal'); doc.setFontSize(9);
        rows.forEach(function (r) {
          if (y > bottom) { doc.addPage(); y = top; }
          var line = padTo(sanitizeForPdf(r[0]), 12) + padTo(sanitizeForPdf(r[1]), 13) + padTo(sanitizeForPdf(r[2]), 32) + sanitizeForPdf(r[3] || '');
          doc.text(line, marginX, y);
          y += lineH;
        });
      });
      if (first) { toast('Nothing to export yet.'); return; }
      doc.save('painting_inventory.pdf');

  /* ---------------- PDF test preview (nothing is saved) ---------------- */
  var testOverlay = null; /* { kind: 'pdf'|'desc', byId: {id: {field: value}}, extras: [placeholder paintings] } */
  var descReviewState = null; /* { pdf, pages, flagged: {pageNum: [reasons]}, order: [pageNum,...] } — pages needing a manual look after "Import descriptions from PDF" */
  function testView(p) {
    if (!testOverlay) return p;
    var o = testOverlay.byId[p.id];
    if (!o) return p;
    var v = Object.assign({}, p);
    v.__red = {};
    Object.keys(o).forEach(function (k) { v[k] = o[k]; v.__red[k] = true; });
    return v;
  }
  function updateTestBanner() {
    var el = document.getElementById('testBanner');

    if (!el) { el = document.createElement('div'); el.id = 'testBanner'; document.body.appendChild(el); }
    var changed = Object.keys(testOverlay.byId).length, added = testOverlay.extras.length;
    var srcLabel = testOverlay.kind === 'desc' ? 'the description PDF' : 'the PDF';

      '<button type="button" id="testApplyBtn" class="is-primary">Apply…</button>' +
      '<button type="button" id="testClearBtn">Cancel</button>';

      testOverlay = null; descReviewState = null; updateTestBanner(); renderAll();
    });
    if (reviewCount) document.getElementById('testReviewBtn').addEventListener('click', openDescReviewModal);
    document.getElementById('testApplyBtn').addEventListener('click', openPdfApplyConfirm);

  var testGridWired = false;
  function wireTestGrid() {
    if (testGridWired) return;
    var grid = document.getElementById('grid');
    if (!grid) return;
    testGridWired = true;
    grid.addEventListener('change', function (e) {
      var t = e.target;
      if (!testOverlay || !t.classList || !t.classList.contains('test-edit')) return;
      var id = t.getAttribute('data-tid'), f = t.getAttribute('data-f');
      var tgt = String(id).indexOf('test-') === 0
        ? testOverlay.extras.find(function (x) { return x.id === id; })
        : testOverlay.byId[id];
      if (!tgt) return;
      if (f === 'date') tgt.date = t.value || null;
      else tgt[f] = t.value.trim();
    });
    grid.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.test-discard') : null;
      if (!btn || !testOverlay) return;
      var id = btn.getAttribute('data-tid');
      if (String(id).indexOf('test-') === 0) {
        testOverlay.extras = testOverlay.extras.filter(function (x) { return x.id !== id; });
      } else {
        delete testOverlay.byId[id];
      }

  }
  function startPdfTest(changes, creates, kind) {
    testOverlay = { kind: kind || 'pdf', byId: {}, extras: [] };
    changes.forEach(function (c) {
      testOverlay.byId[c.id] = Object.assign({}, c.fields);
    });
    creates.forEach(function (c, i) {
      testOverlay.extras.push({
        id: 'test-' + i, tab_id: c.tab_id, number: c.number, name: c.name || '', date: c.date, extra_dates: [],
        price: 0, size: c.size || '', description: '', sold: false, not_for_sale: false, censored: false, hue: 0,
        __testNew: true, __red: { name: true, number: true, date: true, size: true }

    renderAll();
    toast('Preview loaded: red = from the PDF. Nothing is saved until you Apply.');

  /* Confirmation popup, then save the (possibly hand-corrected) preview for real. */
  function openPdfApplyConfirm() {
    if (!testOverlay) return;

    Object.keys(testOverlay.byId).forEach(function (id) {
      var o = testOverlay.byId[id], p = state.paintings.find(function (x) { return String(x.id) === String(id); });
      if (!p || !Object.keys(o).length) return;
      changes.push({ id: p.id, fields: Object.assign({}, o) });
    });

      creates.push({ tab_id: x.tab_id, number: x.number, name: x.name || '', size: x.size || '', date: x.date || null });

      '<h2>Save these changes?</h2>' +

      (creates.length ? ' and ' + creates.length + ' new painting' + (creates.length === 1 ? '' : 's') + ' added' : '') +
      '. This writes to the live gallery and overwrites ' + fieldsDesc + ' on those paintings.</p>' +
      '<div class="modal-actions"><button class="btn btn-ghost" id="pdfConfirmCancel" type="button">Go back</button>' +
      '<button class="btn btn-primary" id="pdfConfirmGo" type="button">Yes, save</button></div>' +
      '</div></div>';
    document.getElementById('pdfConfirmBackdrop').addEventListener('click', function (e) { if (e.target.id === 'pdfConfirmBackdrop') closeModal(); });
    document.getElementById('pdfConfirmCancel').addEventListener('click', closeModal);

  /* ---------------- grid layout: columns + paging ---------------- */
  function currentGridLayout() {
    return (state.gridLayout || GRID_LAYOUT_DEFAULTS)[gridDevice()];
  }
  function applyGridColumns(grid) {
    var L = currentGridLayout();
    var fixed = L.cols !== 'auto';
    grid.classList.toggle('fixed-cols', fixed);
    grid.classList.toggle('dense', fixed && L.cols >= 3);
    if (fixed) grid.style.setProperty('--grid-cols', L.cols); else grid.style.removeProperty('--grid-cols');
    grid.style.setProperty('--desc-lines', L.descLines === 'all' ? 999 : L.descLines);
  }
  /* Show "More" only on descriptions that actually overflow their clamp. */
  function updateDescToggles(grid) {
    if (!grid) return;
    grid.querySelectorAll('.card-desc.clamped').forEach(function (el) {
      var btn = el.nextElementSibling;
      if (!btn || !btn.classList.contains('desc-more')) return;
      if (el.classList.contains('expanded')) { btn.hidden = false; btn.textContent = 'Less'; return; }
      btn.hidden = !(el.scrollHeight > el.clientHeight + 2);
      btn.textContent = 'More';
    });
  }
  /* How many columns the browser is actually drawing — needed when columns
     are "Auto", so "N rows" still means N full rows at any screen width. */
  function measuredGridCols(grid) {
    var L = currentGridLayout();
    if (L.cols !== 'auto') return L.cols;
    var tracks = getComputedStyle(grid).gridTemplateColumns.split(' ').filter(function (t) { return t && t !== 'none'; });
    return Math.max(1, tracks.length);
  }
  var lastGridSignature = null;
  function paginateGridItems(grid, items, pagerEl) {
    var L = currentGridLayout();
    var cols = measuredGridCols(grid);
    lastGridSignature = gridDevice() + ':' + cols;
    /* A PDF-import preview needs every red row on screen to review, so paging
       is switched off while one is open. */
    if (L.rows === 'all' || testOverlay) return items;
    var per = cols * L.rows;
    var pages = Math.max(1, Math.ceil(items.length / per));
    var key = state.activeTabId + '|' + lastGridSignature + '|' + L.rows + '|' + L.mode;
    if (state.gridPageKey !== key) { state.gridPageKey = key; state.gridPage = 1; state.gridShown = 1; }
    if (state.gridPage > pages) state.gridPage = pages;
    if (pages <= 1) return items;

    var slice, html;
    if (L.mode === 'more') {
      slice = items.slice(0, per * state.gridShown);
      html = slice.length < items.length
        ? '<button class="btn" type="button" data-grid-more>Load more</button><div class="pg-info">Showing ' + slice.length + ' of ' + items.length + '</div>'
        : '<div class="pg-info">Showing all ' + items.length + '</div>';
    } else {
      var cur = state.gridPage;
      slice = items.slice((cur - 1) * per, cur * per);
      html = '<button class="pg" type="button" data-grid-page="' + (cur - 1) + '"' + (cur === 1 ? ' disabled' : '') + ' aria-label="Previous page">&lsaquo;</button>';
      var gap = false;
      for (var i = 1; i <= pages; i++) {
        if (pages > 7 && i > 1 && i < pages && Math.abs(i - cur) > 1) {
          if (!gap) { html += '<span class="pg-gap">&hellip;</span>'; gap = true; }
          continue;
        }
        gap = false;
        html += '<button class="pg' + (i === cur ? ' on' : '') + '" type="button" data-grid-page="' + i + '">' + i + '</button>';
      }
      html += '<button class="pg" type="button" data-grid-page="' + (cur + 1) + '"' + (cur === pages ? ' disabled' : '') + ' aria-label="Next page">&rsaquo;</button>' +
        '<div class="pg-info">Page ' + cur + ' of ' + pages + ' &middot; ' + items.length + ' pieces</div>';
    }
    pagerEl.innerHTML = html;
    return slice;
  }
  function bindGridPager() {
    var pagerEl = document.getElementById('gridPager');
    if (!pagerEl || pagerEl.__wired) return;
    pagerEl.__wired = true;
    pagerEl.addEventListener('click', function (e) {
      var more = e.target.closest('[data-grid-more]');
      var pg = e.target.closest('[data-grid-page]');
      if (more) { state.gridShown++; renderAll(); return; }
      if (pg && !pg.disabled) {
        state.gridPage = +pg.getAttribute('data-grid-page');
        renderAll();
        var top = document.getElementById('browseView');
        if (top) top.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  }
  /* Re-flow when the window crosses the mobile breakpoint or the "Auto"
     column count changes, so pages always hold full rows. */
  var gridResizeTimer = null;

    clearTimeout(gridResizeTimer);

  function openGridLayoutModal() {
    var saved = JSON.parse(JSON.stringify(state.gridLayout || GRID_LAYOUT_DEFAULTS));

    }

    var colOpts = {
      desktop: [['auto', 'Auto (fit screen)']].concat([2, 3, 4, 5, 6, 7, 8].map(function (n) { return [n, n + ' columns']; })),
      mobile: [['auto', 'Auto (fit screen)']].concat([1, 2, 3, 4].map(function (n) { return [n, n + (n === 1 ? ' column' : ' columns')]; }))
    };

        '<div class="grid-layout-calc" id="glCalc-' + d + '"></div></fieldset>';

      '<div class="grid-layout-cols">' + side('desktop', 'PC') + side('mobile', 'Mobile') + '</div>' +
      '<div class="modal-actions"><button class="btn btn-ghost" id="glReset" type="button" style="margin-right:auto">Reset to default</button>' +
      '<button class="btn btn-ghost" id="glCancel" type="button">Cancel</button>' +
      '<button class="btn btn-primary" id="glSave" type="button">Save for everyone</button></div>' +
      '</div></div>';

    function readForm() {
      var raw = { desktop: {}, mobile: {} };

        var k = sel.getAttribute('data-gl').split('.');

    }
    function writeForm(L) {
      root.querySelectorAll('[data-gl]').forEach(function (sel) {
        var k = sel.getAttribute('data-gl').split('.');

    function cancel() { state.gridLayout = saved; closeModal(); renderAll(); }
    root.querySelectorAll('[data-gl]').forEach(function (sel) { sel.addEventListener('change', preview); });
    document.getElementById('glBackdrop').addEventListener('click', function (e) { if (e.target.id === 'glBackdrop') cancel(); });
    document.getElementById('glCancel').addEventListener('click', cancel);
    document.getElementById('glReset').addEventListener('click', function () { writeForm(GRID_LAYOUT_DEFAULTS); preview(); });

  /* ---------------- render: grid ---------------- */
  function renderGrid() {

  /* ---------------- render: print planner ---------------- */
  function pageDims() { return state.printMode === 'A3' ? { w: 297, h: 420, cls: 'a3' } : { w: 210, h: 297, cls: 'a4' }; }

      var items = sortByNumber(list.filter(function (p) { return p.tab_id === t.id; }));

  /* ---------- advanced print ---------- */

  function normalizeUrl(u) {
    u = String(u || '').trim();

  function advancedPanelHtml(a) {

          [2, 3, 4, 5, 6, 8, 10, 99].map(function (n) { return '<option value="' + n + '"' + (a.descLines === n ? ' selected' : '') + '>' + (n === 99 ? 'Full' : n) + '</option>'; }).join('') +

        '<div class="pa-stack">Title<input type="text" data-adv="title" value="' + esc(a.title) + '" placeholder="Ark\'s Gallery"></div>' +

          : '') +
        (a.qr === 'auto'
          ? '<div class="pa-stack">Link for the QR code<input type="text" data-adv="qrLink" value="' + esc(a.qrLink || '') + '" placeholder="' + esc(a.website.trim() || 'e.g. instagram.com/yourname') + '"></div>' +
            '<div class="pa-note">Paste any link — your site, Instagram, a shop page. ' + (a.website.trim() ? 'Left empty, it uses your website. ' : '') + 'A plain QR code: it never expires.</div>'

        (a.qr !== 'none' ? '<div class="pa-stack">Text beside it<input type="text" data-adv="qrLabel" value="' + esc(a.qrLabel) + '" placeholder="e.g. Scan to visit"></div>' : '') +
      '</fieldset>' +
      '<fieldset><legend>Filter</legend>' +
        '<div class="pa-row">' + chk('skipNoPiece', 'Leave out &ldquo;Dont Exist&rdquo;', a.skipNoPiece) + '</div>' +
        '<div class="pa-row">' + chk('onlyAvailable', 'Only available (not sold)', a.onlyAvailable) + '</div>' +
        '<div class="pa-row">' + chk('hideCensored', 'Blank out censored photos', a.hideCensored) + '</div>' +
      '</fieldset>' +

  }
  function advancedPagesHtml() {
    var a = state.printAdv, sh = a.show, dims = advDims(a);
    var items = printSourceItems().filter(function (e) {
      if (a.skipNoPiece && isNoPiece(e.p)) return false;
      if (a.onlyAvailable && (e.p.sold || e.p.not_for_sale)) return false;
      return true;
    });
    var per = a.cols * a.rows, pages = [];
    for (var i = 0; i < items.length; i += per) pages.push(items.slice(i, i + per));
    if (!pages.length) pages = [[]];
    var cellW = (dims.w - 20 - (a.cols - 1) * 4) / a.cols;
    var scale = Math.max(0.55, Math.min(1.35, cellW / 62));
    var tabLabel = state.printScope === 'all' ? 'Full catalogue' : ((tabById(state.activeTabId) || {}).name || '');
    var title = a.title.trim() + (a.showTab && tabLabel ? (a.title.trim() ? ' — ' : '') + tabLabel : '');
    var qrHtml = advQrHtml(a);
    var site = a.website.trim();

    return pages.map(function (list, pi) {
      var cells = list.map(function (e) {
        var p = e.p;
        var photo = '';
        if (sh.photo) {
          var src = publicImgUrl(p.thumb_path) || publicImgUrl(p.image_path);
          if (a.hideCensored && p.censored) photo = '<div class="pa-photo hidden-photo">Photo hidden</div>';
          else if (src) photo = '<div class="pa-photo' + (a.fit === 'contain' ? ' contain' : '') + '"><img src="' + esc(src) + '" alt=""' + (a.fit === 'contain' ? '' : thumbPosStyle(p)) + '></div>';
          else if (isNoPiece(p)) photo = '<div class="pa-photo" style="background:#000"></div>';
          else photo = '<div class="pa-photo swatch" style="background:' + swatchGradient(p.hue || 30) + '">' + esc((p.name || '?').charAt(0).toUpperCase()) + '</div>';
        }
        var status = p.sold ? '<span class="pa-status sold">Sold</span>' : (p.not_for_sale ? '<span class="pa-status nfs">Not for sale</span>' : '<span class="pa-status">Available</span>');
        var top = (sh.number || sh.status) ? '<div class="pa-top">' + (sh.number ? '<span class="pa-num">' + esc(catalogNum(p)) + '</span>' : '<span></span>') + (sh.status ? status : '') + '</div>' : '';
        var meta = [];
        if (sh.date) meta.push(esc(fmtPieceDate(p)));
        if (sh.size && p.size) meta.push(esc(p.size));
        var text = top +
          (sh.name ? '<div class="pa-name">' + esc(p.name || 'Untitled') + '</div>' : '') +
          (meta.length ? '<div class="pa-meta">' + meta.join(' &middot; ') + '</div>' : '') +
          (sh.price && p.price ? '<div class="pa-price">' + fmtPrice(p.price) + '</div>' : '') +
          (sh.desc && p.description ? '<div class="pa-desc">' + esc(p.description) + '</div>' : '');
        return '<div class="pa-cell' + (p.sold ? ' sold' : '') + (a.borders ? '' : ' no-border') + (photo ? '' : ' text-only') + '">' +
          photo + (text ? '<div class="pa-text">' + text + '</div>' : '') + '</div>';
      }).join('');
      if (!list.length) cells = '<p style="color:#9a9285;font-size:12px;">No pieces to list.</p>';
      return '<div class="print-page adv" style="width:' + dims.w + 'mm;height:' + dims.h + 'mm;--s:' + scale.toFixed(3) + ';--dl:' + a.descLines + '">' +
        /* Header: title on the left; website (+ QR text) and the QR code on the right. */
        (title || site || qrHtml
          ? '<div class="pa-header"><h3>' + esc(title) + '</h3>' +
              ((site || qrHtml)
                ? '<div class="pa-head-right">' +
                    ((site || (qrHtml && a.qrLabel.trim()))
                      ? '<div class="pa-head-text">' +

                          (site ? '<div class="pa-site">' + esc(site) + '</div>' : '') +

          ? '<div class="pa-footer"><div class="pa-contact">' + esc(a.contact) + '</div>' +
              (a.pageNum ? '<div class="pa-pnum">Page ' + (pi + 1) + ' / ' + pages.length + '</div>' : '') +
            '</div>'
          : '') +
        '</div>';
    }).join('');
  }
  /* Uploaded QR images are shrunk to a crisp 600px PNG so saving them as the default stays small. */
  function readQrImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 600, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        var ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/png'));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Not an image')); };
      img.src = url;
    });
  }
  function wirePrintView(view) {
    if (view.__printWired) return;
    view.__printWired = true;
    var typeTimer = null;
    function setAdv(key, val) {
      var a = state.printAdv;
      if (key.indexOf('show.') === 0) a.show[key.slice(5)] = val; else a[key] = val;
    }
    view.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('button') : null;
      if (!t) return;
      if (t.id === 'btnClosePrint') { showBrowse(); return; }
      if (t.id === 'btnDoPrint') { doPrint(); return; }
      if (t.id === 'btnQrUpload') { document.getElementById('qrFileInput').click(); return; }
      if (t.id === 'btnSavePrintDefaults') { savePrintDefaults(t); return; }
      if (t.hasAttribute('data-pstyle')) { state.printStyle = t.getAttribute('data-pstyle'); renderPrint(); return; }
      if (t.hasAttribute('data-page')) { state.printMode = t.getAttribute('data-page'); renderPrint(); return; }
      if (t.hasAttribute('data-advseg')) { state.printAdv[t.getAttribute('data-advseg')] = t.getAttribute('data-val'); renderPrint(); return; }
      if (t.hasAttribute('data-step')) {
        var k = t.getAttribute('data-step'), d = +t.getAttribute('data-d');
        if (k === 'stdrows') state.printRows = Math.min(30, Math.max(1, state.printRows + d));
        else if (k === 'cols') state.printAdv.cols = Math.min(6, Math.max(1, state.printAdv.cols + d));
        else if (k === 'rows') state.printAdv.rows = Math.min(10, Math.max(1, state.printAdv.rows + d));
        renderPrint();
      }
    });
    view.addEventListener('change', function (e) {
      var t = e.target;
      if (t.id === 'printScopeSel') { state.printScope = t.value; renderPrint(); return; }
      if (t.id === 'qrFileInput') {
        var f = t.files && t.files[0];
        t.value = '';
        if (!f) return;
        readQrImage(f).then(function (data) { state.printAdv.qrImage = data; state.printAdv.qr = 'upload'; renderPrint(); })
          .catch(function () { toast('Could not read that image.'); });
        return;
      }
      var key = t.getAttribute && t.getAttribute('data-adv');
      if (!key) return;
      if (t.type === 'checkbox') setAdv(key, t.checked);
      else if (key === 'descLines') setAdv(key, +t.value);
      else if (t.type !== 'text') setAdv(key, t.value);
      if (key === 'show.desc') renderPrint(); else renderPrintPages();
    });
    view.addEventListener('input', function (e) {
      var t = e.target, key = t.getAttribute && t.getAttribute('data-adv');
      if (!key || t.type !== 'text') return;
      setAdv(key, t.value);
      clearTimeout(typeTimer);
      typeTimer = setTimeout(function () {
        renderPrintPages();
        if ((key === 'website' || key === 'qrLink') && state.printAdv.qr === 'auto') {
          var prev = document.getElementById('qrPreview');
          if (prev) prev.innerHTML = advQrHtml(state.printAdv);

    });
  }
  /* Full re-render while the admin is typing (e.g. the QR preview box needs to appear) without losing the cursor. */
  function renderPrintKeepFocus(input) {

  async function savePrintDefaults(btn) {

    btn.disabled = false;

  /* ---------------- events: tabs / grid ---------------- */
