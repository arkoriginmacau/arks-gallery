      '<div class="missing-input-row">' +
      '<div class="field"><label for="missingRange">Range</label>' +
      '<input type="text" id="missingRange" class="mono" placeholder="e.g. 200-59" inputmode="numeric"></div>' +
      '<button class="btn btn-primary" id="missingCheckBtn" type="button">Check</button>' +
      '</div>' +
      '<p class="field-hint">Either order works — highest and lowest, separated by a dash.</p>' +
      '<div id="missingResultsWrap"></div>' +
      '<div class="modal-actions"><button class="btn btn-ghost" id="missingPrintBtn" type="button" disabled title="Check a range first">Print list</button>' +
      '<button class="btn btn-ghost" id="missingCloseBtn" type="button">Close</button></div>' +
      '</div></div>';

    document.getElementById('missingBackdrop').addEventListener('click', function (e) { if (e.target.id === 'missingBackdrop') closeModal(); });
    document.getElementById('missingCloseBtn').addEventListener('click', closeModal);
    document.getElementById('missingPrintBtn').addEventListener('click', function () { printMissingList(tab, lastRange, currentMissingList()); });

    var input = document.getElementById('missingRange');
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') runCheck(); });
    document.getElementById('missingCheckBtn').addEventListener('click', runCheck);
    input.focus();

    function runCheck() {
      var raw = input.value.trim();
      var m = raw.match(/^(\d+)\s*-\s*(\d+)$/);
      if (!m) { toast('Enter a range like 200-59.'); return; }
      var a = parseInt(m[1], 10), b = parseInt(m[2], 10);
      var lo = Math.min(a, b), hi = Math.max(a, b);
      if (hi - lo > 5000) { toast('That range is too wide — try something narrower.'); return; }
      lastRange = { lo: lo, hi: hi };
      renderResults();
    }

    var lastMissing = [];
    function currentMissingList() { return lastMissing; }

    function currentNumbers() {
      var set = {};
      state.paintings.forEach(function (p) {
        if (p.tab_id !== tab.id) return;
        var n = initialNumber(p.number);
        if (n !== null) set[n] = true;
      });
      return set;
    }

    function renderResults() {
      var wrap = document.getElementById('missingResultsWrap');
      if (!wrap || !lastRange) return;
      var existing = currentNumbers();
      var missing = [];
      for (var n = lastRange.lo; n <= lastRange.hi; n++) if (!existing[n]) missing.push(n);
      var total = lastRange.hi - lastRange.lo + 1;
      lastMissing = missing;
      var printBtn = document.getElementById('missingPrintBtn');
      if (printBtn) { printBtn.disabled = !missing.length; printBtn.title = missing.length ? '' : 'Nothing missing to print'; }

      if (!missing.length) {
        wrap.innerHTML = '<p class="missing-summary">No gaps — every number from <strong>' + lastRange.lo + '</strong> to <strong>' + lastRange.hi + '</strong> is accounted for.</p>';
        return;
      }

      wrap.innerHTML = '<p class="missing-summary"><strong>' + missing.length + '</strong> of ' + total + ' numbers missing between <strong>' + lastRange.lo + '</strong> and <strong>' + lastRange.hi + '</strong>:</p>' +
        '<div class="missing-list" id="missingList">' + missing.map(rowHTML).join('') + '</div>';
      wireRows();
    }

    function rowHTML(n) {
      return '<div class="missing-row" data-num="' + n + '">' +
        '<span class="missing-num">' + esc((tab.prefix || '') + n) + '</span>' +
        '<div class="missing-status-btns">' +
        '<button class="missing-status-btn" data-log="available" type="button">Available</button>' +
        '<button class="missing-status-btn status-sold" data-log="sold" type="button">Sold</button>' +
        '<button class="missing-status-btn status-nfs" data-log="nfs" type="button">Not for sale</button>' +
        '</div></div>';
    }

    function loggedRowHTML(n, status, paintingId) {
      var label = status === 'sold' ? 'Logged — Sold' : (status === 'nfs' ? 'Logged — Not for sale' : 'Logged — Available');
      return '<div class="missing-row is-logged" data-num="' + n + '">' +
        '<span class="missing-num">' + esc((tab.prefix || '') + n) + '</span>' +
        '<span class="missing-logged-tag">' + label + '<button class="missing-undo-btn" data-undo="' + esc(paintingId) + '" type="button">Undo</button></span>' +
        '</div>';
    }

    function wireRows() {
      var list = document.getElementById('missingList');
      if (!list) return;
      list.querySelectorAll('[data-log]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var rowEl = btn.closest('[data-num]');
          logNumber(parseInt(rowEl.getAttribute('data-num'), 10), btn.getAttribute('data-log'), rowEl);
        });
      });
      list.querySelectorAll('[data-undo]').forEach(function (btn) {
        btn.addEventListener('click', function () { undoLog(btn.getAttribute('data-undo'), btn); });
      });
    }

    async function logNumber(n, status, rowEl) {
      var btns = rowEl.querySelectorAll('button');
      btns.forEach(function (b) { b.disabled = true; });
      var payload = {
        tab_id: tab.id, name: '', number: String(n), date: null, extra_dates: [],
        price: 0, size: '', description: '',
        sold: status === 'sold', not_for_sale: status === 'nfs', censored: false,
        hue: Math.floor(Math.random() * 360), suffix_id: null
      };
      var res = await sb.from('paintings').insert(payload).select().single();
      if (res.error) { toast('Could not log #' + n + ' — try again.'); btns.forEach(function (b) { b.disabled = false; }); return; }
      state.paintings.unshift(res.data);
      renderAll();
      rowEl.outerHTML = loggedRowHTML(n, status, res.data.id);
      wireRows();
      lastMissing = lastMissing.filter(function (x) { return x !== n; });
      var printBtn2 = document.getElementById('missingPrintBtn');
      if (printBtn2) printBtn2.disabled = !lastMissing.length;
    }

    async function undoLog(paintingId, btn) {
      btn.disabled = true;
      var before = state.paintings.slice();
      await deletePainting(paintingId);
      if (state.paintings.length === before.length) { btn.disabled = false; return; } // delete failed, deletePainting already toasted
      renderResults();
      if (lastRange) {
        lastMissing = [];
        var existingAfter = currentNumbers();
        for (var nn = lastRange.lo; nn <= lastRange.hi; nn++) if (!existingAfter[nn]) lastMissing.push(nn);
      }
    }
  }

  /* ---------------- init ---------------- */
  sb.auth.onAuthStateChange(function (_event, session) { refreshAuthFromSession(session); });
  (async function () {
    /* Arriving from the emailed link: swap the one-time token for a session. */
    try {
      var params = new URLSearchParams(window.location.search);
      var loginToken = params.get('login');
      if (loginToken) {
        params.delete('login');
        var qs = params.toString();
        window.history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
        var vr = await sb.auth.verifyLink(loginToken);
        if (vr.error) toast(vr.error.message); else toast('Signed in.');
      }
    } catch (e) { /* ignore */ }
    var sres = await sb.auth.getSession();
    refreshAuthFromSession(sres.data.session);
  })();
  loadTheme();
  loadAll();
})();
</script>
</body>
</html>
