<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ark's Gallery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --canvas: #f1ece1;
    --paper: #faf7f0;
    --paper-2: #ffffff;
    --ink: #221f1c;
    --ink-2: var(--ink);
    --ink-on-accent: var(--paper-2);
    --ink-soft: #6b6459;
    --ink-soft-2: var(--ink-soft);
    --ink-faint: #9a9285;
    --ink-faint-2: var(--ink-faint);
    --line: #dbd1bd;
    --line-soft: #e8e0d0;
    --ochre: #a5661f;
    --ochre-ink: #7d4c17;
    --ochre-soft: #e9d6b2;
    --ochre-bg: #f4e9d3;
    --sold: #a53a2a;
    --sold-2: var(--sold);
    --sold-on-bg: var(--sold);
    --sold-ink: #7e2c20;
    --sold-soft: #ecd2cb;
    --sold-bg: #f7e3de;
    --not-for-sale: #2f5f8a;
    --toast-ink: var(--canvas);
    --hover-ink: var(--ink);
    --ochre-on-bg: var(--ochre);
    --ochre-readable: var(--ochre);
    --shadow: 220 20% 10%;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #17130f;
      --paper: #201a14;
      --paper-2: #241e17;
      --ink: #ece4d6;
      --ink-soft: #b2a894;
      --ink-faint: #7c7364;
      --line: #392f24;
      --line-soft: #2c251c;
      --ochre: #dc9d4f;
      --ochre-ink: #f0bd7d;
      --ochre-soft: #4c3a20;
      --ochre-bg: #33281a;
      --sold: #d97158;
      --sold-ink: #e8917a;
      --sold-soft: #4a2721;
      --sold-bg: #3a2019;
      --not-for-sale: #6ba3d6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #17130f;
    --paper: #201a14;
    --paper-2: #241e17;
    --ink: #ece4d6;
    --ink-soft: #b2a894;
    --ink-faint: #7c7364;
    --line: #392f24;
    --line-soft: #2c251c;
    --ochre: #dc9d4f;
    --ochre-ink: #f0bd7d;
    --ochre-soft: #4c3a20;
    --ochre-bg: #33281a;
    --sold: #d97158;
    --sold-ink: #e8917a;
    --sold-soft: #4a2721;
    --sold-bg: #3a2019;
    --not-for-sale: #6ba3d6;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 0 20px 64px;
    min-height: 100vh;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  h1, h2, h3, .display { font-family: 'Fraunces', Georgia, serif; text-wrap: balance; }

  a { color: inherit; }
  button { font-family: inherit; }

  /* ---------- shell ---------- */
  .wrap { max-width: 1120px; margin: 0 auto; }

  header.top {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    padding: 36px 0 22px;
    border-bottom: 1px solid var(--line);
  }
  .brand-eyebrow {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ochre-readable); font-weight: 600; margin: 0 0 6px;
  }
  header.top h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 600; margin: 0; line-height: 1.05; }
  .top-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--paper-2); color: var(--ink-2);
    padding: 10px 16px; border-radius: 3px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; line-height: 1; transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--ochre); }
  .btn:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
  .btn-primary { background: var(--ochre); border-color: var(--ochre); color: var(--ink-on-accent); }
  .btn-primary:hover { background: var(--ochre-ink); border-color: var(--ochre-ink); }
  .btn-ghost { background: transparent; border-color: transparent; padding: 10px 10px; }
  .btn-ghost:hover { border-color: var(--line); }
  .btn-sm { padding: 7px 11px; font-size: 12.5px; }
  .btn-danger { background: var(--sold-bg); border-color: var(--sold-2); color: var(--sold-2); }
  .btn-danger:hover { background: var(--sold-2); border-color: var(--sold-2); color: var(--paper); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn[disabled]:hover { border-color: var(--line); }

  /* ---------- admin / auth ---------- */
  .admin-pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line);
    padding: 6px 10px; border-radius: 20px;
  }
  .admin-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #4c8a5e; flex-shrink: 0; }
  .toast-root { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    background: var(--ink); color: var(--toast-ink); font-size: 13px; font-weight: 500;
    padding: 10px 18px; border-radius: 5px; box-shadow: 0 6px 24px rgba(0,0,0,.25);
    animation: toastIn .18s ease-out;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .view-badge {
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ---------- tabs ---------- */
  .tabbar {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    padding: 18px 0; margin-bottom: 6px;
  }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 8px 9px 16px; border-radius: 3px 3px 0 0;
    border: 1px solid transparent; border-bottom: none;
    cursor: pointer; font-weight: 600; font-size: 14.5px; color: var(--ink-soft);
    position: relative; top: 1px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    color: var(--ink); background: var(--paper); border-color: var(--line);
    box-shadow: 0 -1px 0 var(--paper);
  }
  .tab .prefix-chip {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
    color: var(--ochre-ink); background: var(--ochre-bg); border-radius: 3px;
    padding: 2px 6px; letter-spacing: .02em;
  }
  .tab .count { color: var(--ink-faint); font-size: 12px; font-weight: 500; }
  .tab-edit-btn {
    border: none; background: none; color: var(--ink-faint); cursor: pointer;
    padding: 3px; border-radius: 3px; display: flex;
  }
  .tab-edit-btn:hover { color: var(--ochre-on-bg); background: var(--ochre-bg); }
  .tab-add {
    padding: 9px 14px; border-radius: 3px; border: 1px dashed var(--line);
    background: none; color: var(--ink-faint); cursor: pointer; font-size: 13px; font-weight: 600;
    margin-left: 4px;
  }
  .tab-add:hover { color: var(--ochre-readable); border-color: var(--ochre-readable); }

  .panel {
    background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
    padding: 24px; min-height: 200px;
  }

  /* ---------- grid ---------- */
  .grid-toolbar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin-bottom: 18px; flex-wrap: wrap;
  }
  .grid-toolbar .tab-title { font-size: 20px; font-weight: 600; margin: 0; }
  .grid-toolbar .tab-sub { color: var(--ink-soft); font-size: 13px; margin-top: 2px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }

  .card {
    background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--line); border-radius: 4px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .card-image {
    position: relative; aspect-ratio: 4/3; overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  .card-image img, .card-image .swatch { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-image.move-ready { cursor: grab; }
  .card-image.moving { cursor: grabbing; touch-action: none; user-select: none; }
  .card-image.moving img { -webkit-user-drag: none; }
  .card-image.moving::before, .card-image.moving::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 6; animation: moveBlink .6s steps(1) infinite;
    background:
      linear-gradient(#e11,#e11) top left / 22px 4px no-repeat, linear-gradient(#e11,#e11) top left / 4px 22px no-repeat,
      linear-gradient(#e11,#e11) top right / 22px 4px no-repeat, linear-gradient(#e11,#e11) top right / 4px 22px no-repeat,
      linear-gradient(#e11,#e11) bottom left / 22px 4px no-repeat, linear-gradient(#e11,#e11) bottom left / 4px 22px no-repeat,
      linear-gradient(#e11,#e11) bottom right / 22px 4px no-repeat, linear-gradient(#e11,#e11) bottom right / 4px 22px no-repeat; }
  .card-image.moving::after { display: none; }
  @keyframes moveBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.card-image .swatch { display: flex; align-items: center; justify-content: center; }
  .card-image .swatch span {
    font-family: 'Fraunces', serif; font-size: 44px; color: rgba(255,255,255,.78);
    font-weight: 500;
  }
  .price-tag {
    position: absolute; left: 8px; bottom: 8px;
    background: var(--paper-2); border: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600;
    padding: 3px 8px; border-radius: 3px; font-variant-numeric: tabular-nums;
  }
  .sold-slash {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, transparent calc(50% - 1.6px), var(--sold) 50%, transparent calc(50% + 1.6px));
    opacity: .85;
  }
  .sold-stamp {
    position: absolute; left: 50%; top: 50%; pointer-events: none;
    transform: translate(-50%, -50%) rotate(-11deg);
    border: 3px solid var(--sold); color: var(--sold);
    font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 18px;
    text-transform: uppercase;
    letter-spacing: .14em; padding: 4px 14px 3px; border-radius: 4px;
    background: #faf7f0;
    box-shadow: 0 0 0 3px #faf7f0;
  }

  .expand-hint {
    position: absolute; right: 8px; bottom: 8px; width: 24px; height: 24px; border-radius: 5px;
    background: rgba(34,31,28,.55); color: #fff; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .12s; pointer-events: none;
  }
  .card-image:hover .expand-hint { opacity: 1; }

  /* "Not for sale" mirrors the sold slash/stamp, just in blue, and only
     shows when the piece isn't also marked sold (sold wins). */
  .notforsale-slash {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, transparent calc(50% - 1.6px), var(--not-for-sale) 50%, transparent calc(50% + 1.6px));
    opacity: .85;
  }
  .notforsale-stamp {
    position: absolute; left: 50%; top: 50%; pointer-events: none;
    transform: translate(-50%, -50%) rotate(-11deg);
    border: 3px solid var(--not-for-sale); color: var(--not-for-sale);
    font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 12.5px;
    text-transform: uppercase; white-space: nowrap;
    letter-spacing: .1em; padding: 4px 12px 3px; border-radius: 4px;
    background: #faf7f0;
    box-shadow: 0 0 0 3px #faf7f0;
  }
  .nfs-toggle {
    position: absolute; left: 8px; top: 8px; z-index: 2;
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700;
    letter-spacing: .04em; padding: 3px 7px; border-radius: 3px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.35); background: rgba(34,31,28,.55); color: #fff;
    transition: background .12s, border-color .12s;
  }
  .nfs-toggle:hover { background: rgba(34,31,28,.8); }
  .nfs-toggle.active { background: var(--not-for-sale); border-color: var(--not-for-sale); }

  /* Censored thumbnail: pixel-mosaic only the <img> itself, so every badge
     layered on top (price tag, sold/not-for-sale stamp, set badge) stays
     crisp. For a plain manually-censored piece the lightbox still points at
     the real full-size photo and opens sharp; for a "Hidden"-suffix piece
     no lightbox link is added at all (see the grid render), so there is no
     way to reach the original. Nothing about the stored files changes
     either way — pixelateCensoredThumbs() (below, in JS) does the actual
     mosaic work by drawing the real photo onto a small canvas and swapping
     the <img> src for that tiny result; this image-rendering rule is just
     what makes the browser upscale that tiny result in blocky squares
     instead of smoothing it back out. (An earlier pure-CSS version of this
     — a small layout box plus a scale() transform, no canvas — looked right
     on some images and rendered fully sharp on others depending on how the
     browser's compositor chose to resample the transform, which isn't
     something to gamble a "hidden" image's privacy on.) */
  .card-image.is-censored img {
    image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges;
  }
  .censored-badge {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .censored-chip {
    display: flex; align-items: center; gap: 6px;
    background: rgba(23,19,15,.65); color: #fff;
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.3);
  }
  .censor-toggle-btn.active { color: var(--ochre); }

  /* ---------- missing numbers finder ---------- */
  .missing-input-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 4px; }
  .missing-input-row .field { flex: 1; margin-bottom: 0; }
  .missing-summary { font-size: 13px; color: var(--ink-soft); margin: 16px 0 10px; }
  .missing-summary strong { color: var(--ink); }
  .missing-list { max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; }
  .missing-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); }
  .missing-row:last-child { border-bottom: none; }
  .missing-row .missing-num { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 13.5px; flex: 0 0 auto; min-width: 56px; }
  .missing-status-btns { display: flex; gap: 6px; margin-left: auto; }
  .missing-status-btn {
    font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 3px; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft);
  }
  .missing-status-btn:hover { border-color: var(--ochre); color: var(--ink); }
  .missing-status-btn.status-sold:hover { border-color: var(--sold); color: var(--sold); }
  .missing-status-btn.status-nfs:hover { border-color: var(--not-for-sale); color: var(--not-for-sale); }
  .missing-status-btn:disabled { opacity: .5; cursor: default; }
  .missing-row.is-logged .missing-num { color: var(--ink-faint); }
  .missing-logged-tag { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); display: flex; align-items: center; gap: 10px; }
  .missing-undo-btn { font-size: 11px; color: var(--ink-faint); text-decoration: underline; background: none; border: none; cursor: pointer; padding: 0; }
  .missing-undo-btn:hover { color: var(--ink); }

  /* ---------- painting sets ---------- */
  /* Badge on a card whose piece belongs to a set with 2+ tagged members —
     click opens the set overlay. Sits top-right, mirroring nfs-toggle's
     top-left, so it never collides with it in admin view. */
  .set-badge {
    position: absolute; right: 8px; top: 8px; z-index: 2;
    display: flex; align-items: center; gap: 4px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700;
    letter-spacing: .04em; padding: 3px 7px 3px 6px; border-radius: 3px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.35); background: rgba(34,31,28,.55); color: #fff;
    transition: background .12s;
  }
  .set-badge:hover { background: rgba(34,31,28,.8); }
  .set-assign-btn.has-set { color: var(--ochre); }

  .set-modal-backdrop {
    position: fixed; inset: 0; background: rgba(23,19,15,.55);
    display: flex; align-items: center; justify-content: center;
    padding: 4vh 16px; overflow-y: auto; z-index: 55;
  }
  .set-modal {
    position: relative;
    background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
    width: 100%; max-width: 860px; padding: 26px 26px 22px; margin: auto;
  }
  .set-modal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 4px; }
  .set-modal h2 { font-size: 18px; margin: 0; font-weight: 600; }
  .set-modal .set-count { font-size: 12px; color: var(--ink-faint); font-family: 'IBM Plex Mono', monospace; }
  .set-modal-desc { font-size: 12.5px; color: var(--ink-soft-2); line-height: 1.45; margin: 4px 0 20px; }
  .set-modal-close {
    position: absolute; top: 16px; right: 16px; width: 34px; height: 34px; border-radius: 50%;
    background: none; border: 1px solid var(--line); color: var(--ink-soft); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .set-modal-close:hover { background: var(--line-soft); color: var(--ink); }
  .set-row {
    display: flex; justify-content: center; flex-wrap: wrap;
    gap: 4px; padding: 6px 0 2px;
  }
  /* When there's room, pieces overlap slightly like a fanned hand of cards;
     hovering one lifts it clear so it can be read/clicked without the
     overlap getting in the way. On narrow screens they wrap to their own
     rows and the overlap collapses via the media query below. */
  .set-piece {
    position: relative; width: 168px; flex: 0 0 auto; cursor: pointer;
    transition: transform .15s ease, z-index 0s;
    margin: 0 -22px 0 0;
  }
  .set-row[data-count="1"] .set-piece,
  .set-row[data-count="2"] .set-piece,
  .set-row[data-count="3"] .set-piece { margin-right: 0; }
  .set-piece:hover { transform: translateY(-8px) scale(1.04); z-index: 5; }
  .set-piece-img {
    width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 4px;
    border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,.18);
    display: block; background: var(--paper-2);
  }
  .set-piece-cap { margin-top: 6px; font-size: 11px; text-align: center; color: var(--ink-soft-2); line-height: 1.3; }
  .set-piece-cap .mono { display: block; font-size: 10px; color: var(--ink-faint); margin-top: 1px; }
  @media (max-width: 620px) {
    /* Percentage-of-row width (not vw) so two pieces reliably fit side by
       side regardless of the modal's actual rendered width. */
    .set-piece { width: calc(50% - 2px); margin-right: 0 !important; }
  }

  .lightbox-backdrop {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%; box-sizing: border-box;
    background: rgba(12, 10, 8, .92); z-index: 90;
    display: flex; align-items: center; justify-content: center; padding: 5%;
    overflow: hidden;
  }
  .lightbox-img {
    max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 3px;
    box-shadow: 0 10px 50px rgba(0,0,0,.5); cursor: zoom-in;
    transition: transform .18s ease; transform-origin: center center;
  }
  .lightbox-img.zoomed { cursor: zoom-out; }
  .lightbox-zoom-hint {
    position: absolute; right: 26px; bottom: 22px; color: rgba(255,255,255,.55);
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: .02em;
    pointer-events: none;
  }
  .lightbox-close {
    position: absolute; top: 22px; right: 26px; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.28); color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .lightbox-close:hover { background: rgba(255,255,255,.2); }
  .lightbox-cap {
    position: absolute; left: 26px; bottom: 22px; color: rgba(255,255,255,.75);
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px;
  }

  .card-body { padding: 13px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16.5px; line-height: 1.25; }
  .card-meta { display: flex; gap: 10px; color: var(--ink-soft-2); font-size: 12px; }
  .card-meta .mono { font-variant-numeric: tabular-nums; }
  .card-desc { font-size: 12.5px; color: var(--ink-soft-2); line-height: 1.45; }
  /* A suffix is a small admin-managed vocabulary of colored tags (see
     openSuffixManagerModal) — "Painting set" is the first, more follow
     later, each with its own color, Diablo-rarity style. A piece carries
     at most one. The color itself always comes from the suffix record, so
     recoloring or renaming one updates every card wearing it at once. */
  .suffix-tag {
    text-align: center; font-size: 12.5px; font-weight: 600; letter-spacing: .01em;
    margin-top: 6px;
  }
  /* "In Progress" is the one suffix that gets an animated rainbow fill
     instead of the usual flat suffix color (see the suffix ? ... render
     line) — pure CSS, no images/canvas, negligible cost even with many of
     these on screen at once since only background-position is animated.
     prefers-reduced-motion freezes it to a still gradient instead of
     turning it off outright, so the tag still reads as "special" for
     anyone who's asked their OS to cut down on motion. Print has no use
     for a hue-cycling animation and some print engines render
     background-clip:text as invisible text, so print gets a plain solid
     color instead of gambling on that. */
  .suffix-tag.rainbow {
    background: linear-gradient(90deg, #ff0000, #ff9900, #ffff00, #33ff00, #00ffee, #3300ff, #ff00cc, #ff0000);
    background-size: 300% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: suffixRainbow 4s linear infinite;
  }
  @keyframes suffixRainbow { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
  @media (prefers-reduced-motion: reduce) { .suffix-tag.rainbow { animation: none; background-position: 0% 50%; } }
  @media print { .suffix-tag.rainbow { background: none; -webkit-text-fill-color: currentColor; color: #b0479a; } }

  /* "Pending for remake" gets the same treatment as "In Progress" above,
     just a red pulse instead of a full rainbow — same mechanism, same
     reduced-motion and print fallbacks, different gradient/keyframe name so
     the two don't collide if a piece could ever carry both animated
     styles' CSS at once. */
  .suffix-tag.redshift {
    background: linear-gradient(90deg, #3a0000, #7a0000, #b30000, #ff1a1a, #ff6666, #ff1a1a, #b30000, #7a0000, #3a0000);
    background-size: 300% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: suffixRedshift 4s linear infinite;
  }
  @keyframes suffixRedshift { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
  @media (prefers-reduced-motion: reduce) { .suffix-tag.redshift { animation: none; background-position: 0% 50%; } }
  @media print { .suffix-tag.redshift { background: none; -webkit-text-fill-color: currentColor; color: #b30000; } }
  /* Wraps the optional suffix tag + the footer as one unit and pins the
     whole unit to the bottom of the card body (instead of putting
     margin-top: auto on the tag itself, which would split the leftover
     space between two separate auto-margins and let the tag drift to a
     different height per card). This keeps the tag — when present — and
     the footer divider at the same fixed distance from the bottom on
     every card, so they line up across a grid row regardless of how long
     the description above happens to be. */
  .card-bottom { margin-top: auto; }
  .suffix-swatch {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--line); box-sizing: border-box;
  }
  .field-label {
    font-family: 'Archivo', sans-serif; text-transform: uppercase; font-weight: 700;
    font-size: 10px; letter-spacing: .05em; color: var(--ink-faint-2);
  }
  .card.is-sold .card-name, .card.is-sold .card-meta { color: var(--sold-2); }
  .card.is-sold .price-tag { border-color: var(--sold-soft); background: var(--sold-bg); color: var(--sold-on-bg); }

  .card-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 10px; border-top: 1px solid var(--line-soft);
  }
  .sold-toggle {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-size: 12px; font-weight: 600; color: var(--ink-soft-2); border: none; background: none; padding: 4px 2px;
  }
  .switch {
    width: 32px; height: 18px; border-radius: 10px; background: var(--line);
    position: relative; transition: background .15s; flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--paper-2); transition: transform .15s;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .is-sold .switch { background: var(--sold); }
  .is-sold .switch::after { transform: translateX(14px); }
  .card-actions { display: flex; gap: 2px; }
  .icon-btn {
    border: none; background: none; color: var(--ink-faint-2); cursor: pointer;
    padding: 5px; border-radius: 3px; display: flex;
  }
  .icon-btn:hover { color: var(--hover-ink); background: var(--line-soft); }
  .icon-btn.danger:hover { color: var(--sold-2); background: var(--sold-bg); }
  .sold-static {
    display: block; width: 100%; text-align: center;
    font-size: 12px; font-weight: 600; color: var(--ink-faint-2);
  }
  .sold-static.is-sold { color: var(--sold); }
  .sold-static.is-nfs { color: var(--not-for-sale); }

  .empty-state {
    text-align: center; padding: 64px 20px; color: var(--ink-soft);
  }
  .empty-state h3 { margin: 0 0 6px; font-size: 19px; }
  .empty-state p { margin: 0 0 18px; font-size: 13.5px; }

  /* ---------- modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(23,19,15,.5);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 6vh 16px; overflow-y: auto; z-index: 50;
  }
  .modal {
    background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
    width: 100%; max-width: 440px; padding: 26px; margin-bottom: 40px;
  }
  .modal.modal-wide { max-width: 720px; }
  .pdf-diff-scroll {
    max-height: 320px; overflow-y: auto; border: 1px solid var(--line);
    border-radius: 4px; margin-bottom: 4px;
  }
  .pdf-diff-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .pdf-diff-table th, .pdf-diff-table td {
    padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top;
  }
  .pdf-diff-table th {
    position: sticky; top: 0; background: var(--paper); font-size: 11px;
    text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft);
  }
  .test-red { color: #ff2a2a !important; font-weight: 700; }
  .card.is-test-new { outline: 3px solid #ff2a2a; outline-offset: -3px; }
  .test-edit { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; color: #ff2a2a; background: rgba(255,42,42,.10); border: 1px solid #ff2a2a; border-radius: 4px; padding: 3px 6px; margin: 2px 0; }
  .test-edit:focus { outline: 2px solid #ff2a2a; background: rgba(255,42,42,.18); }
  textarea.test-edit { resize: vertical; line-height: 1.4; }
  .test-discard { background: transparent; color: #ff2a2a; border: 1px solid #ff2a2a; border-radius: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; margin: 4px 0 6px; cursor: pointer; }
  .test-discard:hover { background: #ff2a2a; color: #fff; }
  #testBanner button.is-primary { background: #111; color: #fff; }
  .test-new-tag { display: inline-block; background: #ff2a2a; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 2px 6px; border-radius: 3px; margin-bottom: 6px; }
  #testBanner { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 40; background: #ff2a2a; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.35); display: flex; gap: 14px; align-items: center; max-width: calc(100vw - 24px); }
  #testBanner button { background: #fff; color: #c00; border: 0; border-radius: 5px; padding: 5px 12px; font-weight: 700; cursor: pointer; }
  .pdf-diff-old { display: block; color: var(--ink-soft); text-decoration: line-through; }
  .pdf-diff-new { display: block; color: var(--ink); font-weight: 600; }
  .bulk-progress-track {
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 4px;
    height: 10px; overflow: hidden; margin: 4px 0 4px;
  }
  .bulk-progress-fill { background: var(--ochre); height: 100%; transition: width .2s ease; }
  .modal h2 { font-size: 19px; margin: 0 0 8px; font-weight: 600; }
  .modal p.modal-sub { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 18px; }
  .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
  .field input[type="text"], .field input[type="number"], .field input[type="date"], .field textarea {
    border: 1px solid var(--line); background: var(--paper-2); color: var(--ink-2);
    border-radius: 3px; padding: 9px 10px; font-size: 14px; font-family: inherit; width: 100%;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--ochre); outline-offset: 1px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .field-hint { font-size: 11.5px; color: var(--ink-faint); }
  .field-label-row { display: flex; align-items: center; justify-content: space-between; }
  .field-label-row label { margin: 0; }
  .date-add-btn { padding: 2px 9px; font-size: 13px; line-height: 1.5; }
  .extra-date-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .extra-date-row input { flex: 1; }
  .extra-date-remove { padding: 2px 9px; font-size: 14px; line-height: 1.4; }
  .upload-drop {
    border: 1px dashed var(--line); border-radius: 4px; padding: 16px; text-align: center;
    font-size: 13px; color: var(--ink-soft-2); cursor: pointer; background: var(--paper-2);
  }
  .upload-drop:hover { border-color: var(--ochre); color: var(--ink-2); }
  .upload-preview { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
  .upload-preview img { width: 44px; height: 44px; object-fit: cover; border-radius: 3px; border: 1px solid var(--line); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .modal-close { position: absolute; }
  .modal .btn-ghost { color: var(--ink-soft); border-color: var(--line); }

  /* ---------- print planner ---------- */
  .print-toolbar {
    display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-end;
    padding: 18px 22px; background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
    margin-bottom: 22px;
  }
  .print-field { display: flex; flex-direction: column; gap: 6px; }
  .print-field label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .seg button {
    border: none; background: var(--paper-2); color: var(--ink-soft-2); padding: 8px 16px;
    font-size: 13px; font-weight: 600; cursor: pointer; border-right: 1px solid var(--line);
  }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: var(--ochre); color: var(--ink-on-accent); }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .stepper button { border: none; background: var(--paper-2); width: 30px; height: 34px; font-size: 15px; cursor: pointer; color: var(--ink-2); }
  .stepper button:hover { background: var(--ochre-bg); color: var(--hover-ink); }
  .stepper span { width: 34px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; }
  select.print-select {
    border: 1px solid var(--line); background: var(--paper-2); color: var(--ink-2);
    padding: 8px 10px; border-radius: 3px; font-size: 13px; font-family: inherit;
  }

  .print-scroll { overflow-x: auto; padding-bottom: 8px; }
  .page-stack { display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .print-page {
    background: #fff; color: #1a1712; box-shadow: 0 2px 18px rgba(0,0,0,.18);
    position: relative; flex-shrink: 0;
  }
  .print-page .p-header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 12mm 12mm 4mm; border-bottom: 0.6mm solid #1a1712;
  }
  .print-page .p-header h3 { font-family: 'Fraunces', serif; font-size: 6.4mm; margin: 0; font-weight: 600; }
  .print-page .p-header .p-meta { font-family: 'IBM Plex Mono', monospace; font-size: 3mm; color: #6b6459; }
  .print-rows { padding: 0 12mm; }
  .print-row {
    display: flex; align-items: center; gap: 5mm;
    border-bottom: 0.25mm solid #d9cfbc; padding: 3mm 0;
  }
  .print-row .p-thumb {
    width: 16mm; height: 16mm; border-radius: 1mm; object-fit: cover; flex-shrink: 0; border: 0.25mm solid #d9cfbc;
  }
  .print-row .p-thumb.swatch { display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; color: rgba(255,255,255,.85); font-size: 5mm; }
  .print-row .p-num { font-family: 'IBM Plex Mono', monospace; font-size: 3mm; font-weight: 600; width: 16mm; flex-shrink: 0; }
  .print-row .p-info { flex: 1; min-width: 0; }
  .print-row .p-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 3.8mm; }
  .print-row .p-desc { font-size: 2.7mm; color: #6b6459; margin-top: 0.5mm; }
  .print-row .p-date-line { font-family: 'IBM Plex Mono', monospace; font-size: 2.6mm; color: #6b6459; margin-top: 0.5mm; }
  .print-row .p-label { font-family: 'Archivo', sans-serif; text-transform: uppercase; font-size: 2.2mm; letter-spacing: .04em; color: #9a9285; font-weight: 600; }
  .print-row .p-price { font-family: 'IBM Plex Mono', monospace; font-size: 3.4mm; font-weight: 600; width: 20mm; text-align: right; flex-shrink: 0; }
  .print-row.sold .p-name, .print-row.sold .p-price { color: #a53a2a; }
  .print-row .p-sold-mark { font-size: 2.6mm; font-weight: 700; color: #a53a2a; letter-spacing: .06em; width: 14mm; text-align: right; flex-shrink: 0; }
  .print-page .p-footer {
    position: absolute; bottom: 6mm; right: 12mm; font-family: 'IBM Plex Mono', monospace; font-size: 2.6mm; color: #9a9285;
  }

  .a4 { width: 210mm; height: 297mm; }
  .a3 { width: 297mm; height: 420mm; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; left: 0; top: 0; margin: 0; padding: 0; }
    .print-scroll { overflow: visible; }
    .page-stack { gap: 0; align-items: flex-start; }
    .print-page { box-shadow: none; page-break-after: always; }
  }

  #printPageStyle { display: none; }

  @media (max-width: 640px) {
    header.top { padding-top: 24px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .print-toolbar { padding: 14px; gap: 14px; }
  }
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <p class="brand-eyebrow">Arkorigin Studio</p>
      <h1>Ark's Gallery</h1>
    </div>
    <div class="top-actions" id="topActions"></div>
  </header>

  <nav class="tabbar" id="tabbar"></nav>

  <main class="panel" id="browseView">
    <div class="grid-toolbar">
      <div>
        <p class="tab-title" id="tabTitle">&nbsp;</p>
        <p class="tab-sub" id="tabSub"></p>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <main class="panel" id="printView" hidden></main>
</div>

<div id="modalRoot"></div>
<div id="lightboxRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------------- Cloudflare backend config ----------------
     One Cloudflare Worker serves everything: photos (R2), data (D1) and
     the admin password login. Reads are public; every write needs the
     admin session token issued at login. */
  var ADMIN_EMAIL = 'arkoriginmacau@gmail.com';
  var IMAGE_BASE = 'https://arks-gallery-images.arkoriginmacau.workers.dev';
  var SESSION_KEY = 'arks_admin_session';

  /* Small client that keeps the same call shape the rest of this file
     already uses (sb.from(...).select/insert/update/delete, sb.auth...). */
  var sb = (function () {
    var listeners = [];
    function readSession() {
      try {
        var raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        var s = JSON.parse(raw);
        if (!s || !s.token || !s.expires_at || s.expires_at < Date.now() / 1000) return null;
        return { access_token: s.token, expires_at: s.expires_at, user: { email: ADMIN_EMAIL } };
      } catch (e) { return null; }
    }
    function notify() { var s = readSession(); listeners.forEach(function (cb) { try { cb('CHANGED', s); } catch (e) {} }); }

    function Query(table) {
      this.table = table; this.op = null; this.values = null; this.filters = [];
      this.orderBy = null; this.returning = false; this.mode = null;
    }
    Query.prototype.select = function () { if (this.op) this.returning = true; else this.op = 'select'; return this; };
    Query.prototype.insert = function (v) { this.op = 'insert'; this.values = v; return this; };
    Query.prototype.update = function (v) { this.op = 'update'; this.values = v; return this; };
    Query.prototype.upsert = function (v) { this.op = 'upsert'; this.values = v; return this; };
    Query.prototype.delete = function () { this.op = 'delete'; return this; };
    Query.prototype.eq = function (col, val) { this.filters.push({ col: col, val: val }); return this; };
    Query.prototype.order = function (col, opts) { this.orderBy = { col: col, ascending: !(opts && opts.ascending === false) }; return this; };
    Query.prototype.single = function () { this.mode = 'single'; return this; };
    Query.prototype.maybeSingle = function () { this.mode = 'maybe'; return this; };
    Query.prototype.run = async function () {
      try {
        var headers = { 'Content-Type': 'application/json' };
        var sess = readSession();
        if (sess) headers.Authorization = 'Bearer ' + sess.access_token;
        var res = await fetch(IMAGE_BASE + '/api/db', {
          method: 'POST', headers: headers,
          body: JSON.stringify({ table: this.table, op: this.op, values: this.values, filters: this.filters,
            order: this.orderBy, returning: this.returning })
        });
        var body = await res.json().catch(function () { return {}; });
        if (!res.ok) return { data: null, error: { message: body.error || ('Request failed (' + res.status + ')') } };
        var rows = body.rows || [];
        if (this.op === 'select' || this.returning) {
          if (this.mode === 'single') {
            if (rows.length !== 1) return { data: null, error: { message: 'Expected one row, got ' + rows.length } };
            return { data: rows[0], error: null };
          }
          if (this.mode === 'maybe') return { data: rows[0] || null, error: null };
          return { data: rows, error: null };
        }
        return { data: null, error: null };
      } catch (e) { return { data: null, error: { message: e.message || String(e) } }; }
    };
    Query.prototype.then = function (resolve, reject) { return this.run().then(resolve, reject); };

    return {
      from: function (table) { return new Query(table); },
      auth: {
        getSession: function () { return Promise.resolve({ data: { session: readSession() } }); },
        onAuthStateChange: function (cb) { listeners.push(cb); },
        requestLink: async function () {
          try {
            var res = await fetch(IMAGE_BASE + '/api/auth/request', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ origin: window.location.origin })
            });
            var body = await res.json().catch(function () { return {}; });
            if (!res.ok) return { error: { message: body.error || 'Could not send the sign-in link' } };
            return { error: null };
          } catch (e) { return { error: { message: e.message || String(e) } }; }
        },
        verifyLink: async function (token) {
          try {
            var res = await fetch(IMAGE_BASE + '/api/auth/verify', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token })
            });
            var body = await res.json().catch(function () { return {}; });
            if (!res.ok || !body.token) return { error: { message: body.error || 'Sign-in failed' } };
            localStorage.setItem(SESSION_KEY, JSON.stringify({ token: body.token, expires_at: body.expires_at }));
            notify();
            return { error: null };
          } catch (e) { return { error: { message: e.message || String(e) } }; }
        },
        signOut: async function () { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} notify(); }
      }
    };
  })();
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  var state = { thumbPos: {}, tabs: [], paintings: [], suffixes: [], activeTabId: null, printMode: 'A4', printRows: 8, printScope: 'current', loaded: false };
  var isAdmin = false;
  var currentUserEmail = null;
  /* When this page is loaded inside someone else's site (e.g. embedded on the
     Wix website) it must always stay pure viewing mode — no "Admin" sign-in
     affordance, and no edit controls even if a stray admin session exists. */
  var isEmbedded = (function () {
    try { return window.self !== window.top; } catch (e) { return true; }
  })();

  /* ---------------- site theme (admin-editable, applies for every visitor) ---------------- */
  var THEME_VARS = [
    { varName: '--canvas', label: 'Background' },
    { varName: '--paper', label: 'Panels' },
    { varName: '--paper-2', label: 'Cards' },
    { varName: '--ink', label: 'Text' },
    { varName: '--ink-soft', label: 'Muted text' },
    { varName: '--ochre', label: 'Accent' },
    { varName: '--sold', label: 'Sold tag' },
    { varName: '--not-for-sale', label: 'Not-for-sale tag' }
  ];

  /* ---------------- toast ---------------- */
  function toast(msg) {
    var root = document.getElementById('toastRoot');
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () { el.remove(); }, 3400);
  }

  /* ---------------- helpers ---------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtPrice(n) {
    if (n === '' || n == null || isNaN(n)) return '—';
    return '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }
  function fmtDate(d) {
    if (!d) return '—';
    return String(d).replace(/-/g, '/');
  }
  function tabById(id) { return state.tabs.find(function (t) { return t.id === id; }); }
  /* No-prefix tabs only ever collect a year (see openPaintingModal), stored
     as Jan 1 of that year since the database needs a full date — so when
     displaying a piece from one of those tabs, show just the year rather
     than a misleading "2024/01/01". */
  function fmtPieceDate(p) {
    var t = tabById(p.tab_id);
    var isYearOnly = !!(t && !t.prefix);
    var all = [p.date].concat(Array.isArray(p.extra_dates) ? p.extra_dates : []).filter(Boolean);
    if (!all.length) return '—';
    all.sort();
    var parts = all.map(function (d) { return isYearOnly ? String(d).slice(0, 4) : fmtDate(d); });
    var seen = {};
    parts = parts.filter(function (s) { if (seen[s]) return false; seen[s] = true; return true; });
    return parts.join(', ');

  function catalogNum(p) {

    return ((t && t.prefix) || '') + (p.number || '');

  /* Numbers are usually plain ("13"), but some pieces use a compound
     format like "06-1-1-4" (initial number 06, set 1, piece 1 of 4).
     For sequencing we only care about that leading initial number —
     the set/piece parts are ignored for now. */
  function initialNumber(raw) {

  }

     Pieces with no parseable number sort after numbered ones, keeping
     their relative order. */
  function sortByNumber(list) {
    return list.slice().sort(function (a, b) {
      var na = initialNumber(a.number), nb = initialNumber(b.number);
      if (na === null && nb === null) return 0;
      if (na === null) return 1;
      if (nb === null) return -1;
      return nb - na;
    });
  }
  /* A piece belongs to a set when an admin has tagged it with a set_id —
     a plain per-tab bucket number typed by hand (see openSetPrompt). Two
     pieces are in the same set when they share both tab_id and set_id.
     Ordered by catalogue number ascending (1 of N first) rather than the
     gallery's newest-first order, since a set reads front-to-back. */
  function setMembers(p) {
    if (!p || p.set_id === null || p.set_id === undefined || p.set_id === '') return [];
    return state.paintings
      .filter(function (x) { return x.tab_id === p.tab_id && String(x.set_id) === String(p.set_id); })
      .sort(function (a, b) {
        var na = initialNumber(a.number), nb = initialNumber(b.number);
        if (na === null && nb === null) return 0;
        if (na === null) return 1;
        if (nb === null) return -1;

  function nextNumberForTab(tabId) {

  function stripExt(name) { return name.replace(/\.[^.]+$/, ''); }

  async function r2AuthHeader() {

  function extForType(mimeType, fallbackName) {
    if (mimeType === 'image/webp') return '.webp';
    if (mimeType === 'image/jpeg') return '.jpg';
    if (mimeType === 'image/png') return '.png';
    var m = String(fallbackName || '').match(/\.[^.]+$/);

  }

  /* Decodes a photo once and produces two uploads from it:
       - thumb: a JPEG for the grid/list view, capped at THUMB_MAX_DIM (see
         below). Grid cards render well under that on screen, so the actual
         CSS box is always a mild downscale from the stored file, however
         high the viewer's screen density — a big enough safety margin that
         the browser's own image scaling doesn't need any help to avoid
         aliasing on fine, regular detail like a canvas' woven texture.
       - full: the "zoom" image shown in the lightbox, downscaled (see
         ZOOM_MAX_DIM below) and re-encoded through canvas as WebP
         (falling back to JPEG if the browser can't produce a WebP blob).
         Camera-original photos are routinely 6000-8000px on the long
         edge and several MB even after re-encoding — no screen benefits
         from that, it just makes the zoom view slow to load, so the
         dimensions are capped as well as the encoding. If an already-
         capped photo still comes out oversized the quality is stepped
         down further (never the dimensions) until it's a sane upload
         size. Falls back to the original file untouched if re-encoding
         fails (e.g. HEIC the browser can't decode) or doesn't actually
         save space. */
  /* Downscales a large source (an <img> or canvas) to an exact target size
     without the moiré/interference banding a single big-ratio drawImage()
     produces. A camera photo is routinely 3000-6000px on its long edge; a
     small thumbnail can be a 6-12x reduction in one step. Canvas2D's
     bilinear filter only samples a small neighbourhood around each output
     pixel, so at that ratio it skips most of the source pixels instead of
     averaging them — fine repeating detail (woven canvas texture, hair,
     fabric weave) aliases into false, wavy stripes, exactly like a camera
     filming a TV screen. Repeatedly halving (each step is a safe ~2x ratio
     the browser's high-quality smoothing *can* properly box-filter) removes
     the high-frequency detail gradually instead of skipping over it, so the
     final resize has nothing left to alias.

     (An earlier version of this function also tried pre-blurring the final
     step to guard against a *second*, independent downscale — the browser
     fitting the stored thumbnail into a smaller grid-card box via CSS. That
     made real-device rendering worse, not better: the softened result JPEG-
     compresses into visible blocking that a high-DPI phone screen then
     upscales into an even more visible grid pattern. The reliable fix is
     the one below — generate the thumbnail large enough that this second
     downscale is always a mild ratio the browser handles cleanly on its
     own, rather than trying to out-guess it with a blur.) */
  function drawHQDownscale(source, srcW, srcH, destW, destH) {
    var curSource = source, curW = srcW, curH = srcH;
    while (curW * 0.5 > destW && curH * 0.5 > destH) {
      var nextW = Math.max(1, Math.round(curW * 0.5));
      var nextH = Math.max(1, Math.round(curH * 0.5));

      stepCanvas.width = nextW; stepCanvas.height = nextH;
      var sctx = stepCanvas.getContext('2d');
      sctx.imageSmoothingEnabled = true;
      sctx.imageSmoothingQuality = 'high';
      sctx.drawImage(curSource, 0, 0, curW, curH, 0, 0, nextW, nextH);
      curSource = stepCanvas; curW = nextW; curH = nextH;
    }
    var finalCanvas = document.createElement('canvas');
    finalCanvas.width = destW; finalCanvas.height = destH;
    var fctx = finalCanvas.getContext('2d');
    fctx.imageSmoothingEnabled = true;
    fctx.imageSmoothingQuality = 'high';
    fctx.drawImage(curSource, 0, 0, curW, curH, 0, 0, destW, destH);
    return finalCanvas;
  }

  function processPhoto(file, thumbMaxDim, thumbQuality) {
    return new Promise(function (resolve) {
      var fallback = { fullBlob: file, thumbBlob: null, reencoded: false };
      if (!file || !/^image\//.test(file.type) || file.type === 'image/gif' || file.type === 'image/svg+xml') {

      }

        var w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) { URL.revokeObjectURL(url); resolve(fallback); return; }

        /* The "full" image is what the lightbox zoom view serves — it is
           NOT the untouched camera original. Camera photos routinely land
           at 6000-8000px on the long edge (40-60+ megapixels); no screen
           can show anywhere near that, and downloading it just to view a
           painting zoomed in was the actual cause of the slow zoom load.
           Cap it at a size that still shows individual brushstrokes
           clearly on any display (including a 2x/3x retina screen) while
           being a fraction of the download. */
        var ZOOM_MAX_DIM = 1600;
        var fScale = Math.min(1, ZOOM_MAX_DIM / Math.max(w, h));
        var fw = Math.max(1, Math.round(w * fScale)), fh = Math.max(1, Math.round(h * fScale));
        var fullCanvas = drawHQDownscale(img, w, h, fw, fh);

        var tScale = Math.min(1, thumbMaxDim / Math.max(w, h));
        var tw = Math.max(1, Math.round(w * tScale)), th = Math.max(1, Math.round(h * tScale));
        var thumbCanvas = drawHQDownscale(img, w, h, tw, th);

        var MAX_FULL_BYTES = 15 * 1024 * 1024;
        function finishFull(fullBlob) {
          thumbCanvas.toBlob(function (thumbBlob) {
            URL.revokeObjectURL(url);
            var reencoded = !!fullBlob && fullBlob.size < file.size;

              fullBlob: reencoded ? fullBlob : file,
              thumbBlob: thumbBlob || null,

        function encodeFullJpegFallback() {
          fullCanvas.toBlob(function (jpegBlob) { finishFull(jpegBlob); }, 'image/jpeg', 0.9);

        function encodeFull(quality, attempts) {
          fullCanvas.toBlob(function (fullBlob) {
            if (!fullBlob) { encodeFullJpegFallback(); return; } // browser can't encode WebP — fall back to JPEG

            }
            finishFull(fullBlob);
          }, 'image/webp', quality);
        }
        encodeFull(0.85, 0);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(fallback); };
      img.src = url;
    });
  }

  /* ---------------- export to Excel ----------------
     One sheet per tab with Date / Number / Name / Size, styled like the
     hand-made inventory sheet. Print any sheet to PDF and bring it back with
     "Import from PDF" — the columns are in the order that importer expects. */
  function loadExcelJs() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
      sc.onload = function () { window.ExcelJS ? resolve(window.ExcelJS) : reject(new Error('ExcelJS missing')); };
      sc.onerror = function () { reject(new Error('ExcelJS failed to load')); };
      document.head.appendChild(sc);
    });
  }
  function inventoryRowsForTab(tab) {
    var list = state.paintings.filter(function (p) { return p.tab_id === tab.id; });
    list.sort(function (a, b) {
      var na = initialNumber(a.number), nb = initialNumber(b.number);
      if (na === null && nb === null) return String(a.number || '').localeCompare(String(b.number || ''), undefined, { numeric: true });
      if (na === null) return 1;
      if (nb === null) return -1;
      if (na !== nb) return na - nb;
      return String(a.number || '').localeCompare(String(b.number || ''), undefined, { numeric: true });
    });
    return list.map(function (p) {
      var name = p.name || '';
      var isNone = /^\s*don['\u2019]?t\s+exist\s*$/i.test(name);
      var size = String(p.size || '').replace(/(\d)\s*[x\u00d7]\s*(\d)/i, '$1x$2');
      return [p.date ? String(p.date).slice(0, 10) : '', catalogNum(p), name, size || (isNone ? '---' : '')];
    });
  }
  function buildInventoryWorkbook(ExcelJS, sheets) {
    var wb = new ExcelJS.Workbook();
    var used = {};
    sheets.forEach(function (sh) {
      var nm = String(sh.name || 'Sheet').replace(/[\[\]:*?\/\\]/g, ' ').trim().slice(0, 31) || 'Sheet';
      var base = nm, k = 2;
      while (used[nm.toLowerCase()]) { nm = base.slice(0, 28) + ' ' + (k++); }
      used[nm.toLowerCase()] = true;
      var ws = wb.addWorksheet(nm, { views: [{ state: 'frozen', ySplit: 1 }] });
      ws.columns = [{ width: 14 }, { width: 18 }, { width: 40 }, { width: 20 }];
      var thin = { style: 'thin', color: { argb: 'FFBFBFBF' } };
      var border = { top: thin, left: thin, bottom: thin, right: thin };
      var head = ws.addRow(['Date', 'Number', 'Name', 'Size']);
      head.eachCell(function (c) {
        c.font = { name: 'Arial', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
        c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2C3E50' } };
        c.alignment = { vertical: 'middle' };
        c.border = border;
      });
      sh.rows.forEach(function (r, i) {
        var row = ws.addRow(r);
        row.eachCell({ includeEmpty: true }, function (c) {
          c.font = { name: 'Arial', size: 11 };
          c.alignment = { vertical: 'middle' };
          c.border = border;
          c.numFmt = '@';
          if (i % 2 === 0) c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF2F2F2' } };
        });
      });
    });
    return wb;
  }
  async function exportInventoryXlsx() {
    if (!state.tabs.length) { toast('Nothing to export yet.'); return; }
    toast('Building Excel file…');
    try {
      var ExcelJS = await loadExcelJs();
      var wb = buildInventoryWorkbook(ExcelJS, state.tabs.map(function (t) {
        return { name: t.name, rows: inventoryRowsForTab(t) };
      }));
      var buf = await wb.xlsx.writeBuffer();
      var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'painting_inventory.xlsx';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      toast('Downloaded painting_inventory.xlsx (one sheet per tab).');
    } catch (e) {
      toast('Could not build the Excel file — check your connection and try again.');
    }
  }

  /* ---------------- export as a re-importable PDF ----------------
     A plain, monospaced listing of the CURRENT gallery — one line per
     painting, in exactly the shape "Import from PDF" reads back
     (optional date, catalogue number, name, size) — so this file can
     become the running master copy: download it, note additions or
     removals, hand-correct anything, then bring it straight back in
     with Import from PDF next time the count has moved.
     Note: the built-in PDF font here only covers Latin text. A name
     written in Japanese, Chinese or similar won't render in this
     download — it'll come out blank on that line — though re-importing
     the same painting's *number* still works fine since matching never
     depends on the name. */
  function loadScriptOnce(src) {
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = src;
      sc.onload = function () { resolve(); };
      sc.onerror = function () { reject(new Error('script failed to load: ' + src)); };
      document.head.appendChild(sc);
    });
  }
  function loadJsPdf() {
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
    // Two mirrors are tried in order: some CDNs occasionally prune an exact
    // pinned version (this happened to the cdnjs copy of 2.5.2), so a single
    // hardcoded URL is a single point of failure for this button.
    var urls = [
      'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js'
    ];
    var i = 0;
    function tryNext() {
      if (i >= urls.length) return Promise.reject(new Error('jsPDF failed to load'));
      var url = urls[i++];
      return loadScriptOnce(url).then(function () {
        if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
        return tryNext();
      }, function () {
        return tryNext();
      });
    }
    return tryNext();
  }
  function padTo(str, len) { str = String(str || ''); return str.length >= len ? str + '  ' : str + new Array(len - str.length + 2).join(' '); }
  /* jsPDF's built-in helvetica/courier fonts only cover WinAnsi/Latin-1
     glyphs. Passing a string with CJK (or other non-Latin) characters to
     doc.text() doesn't just render those characters blank — it corrupts the
     ENTIRE line's text encoding in the PDF, including the date/number/size
     columns that Import from PDF depends on for matching. So every string
     handed to doc.text() is sanitized down to printable ASCII first; a
     shortened name is fine, a garbled catalogue number is not. */
  function sanitizeForPdf(str) { return String(str || '').replace(/[^\x20-\x7E]/g, ''); }
  async function exportInventoryPdf() {
    if (!state.tabs.length) { toast('Nothing to export yet.'); return; }
    toast('Building PDF…');
    try {
      var jsPDF = await loadJsPdf();
      var doc = new jsPDF({ unit: 'pt', format: 'a4' });
      var marginX = 36, top = 44, bottom = 800, lineH = 13;
      var first = true;
      state.tabs.forEach(function (tab) {
        var rows = inventoryRowsForTab(tab);
        if (!rows.length) return;
        if (!first) doc.addPage(); first = false;
        var y = top;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
        doc.text(sanitizeForPdf(tab.name + (tab.prefix ? ' (' + tab.prefix + ')' : '')), marginX, y);
        y += 20;
        doc.setFont('courier', 'normal'); doc.setFontSize(9);
        rows.forEach(function (r) {
          if (y > bottom) { doc.addPage(); y = top; }
          var line = padTo(sanitizeForPdf(r[0]), 12) + padTo(sanitizeForPdf(r[1]), 13) + padTo(sanitizeForPdf(r[2]), 32) + sanitizeForPdf(r[3] || '');
          doc.text(line, marginX, y);
          y += lineH;
        });
      });
      if (first) { toast('Nothing to export yet.'); return; }
      doc.save('painting_inventory.pdf');
      toast('Downloaded painting_inventory.pdf — bring it back in anytime with Import from PDF.');
    } catch (e) {
      toast('Could not build the PDF — check your connection and try again.');
    }
  }

  /* ---------------- PDF test preview (nothing is saved) ---------------- */
  var testOverlay = null; /* { kind: 'pdf'|'desc', byId: {id: {field: value}}, extras: [placeholder paintings] } */

    if (!testOverlay) return p;
    var o = testOverlay.byId[p.id];
    if (!o) return p;
    var v = Object.assign({}, p);
    v.__red = {};

    return v;
  }
  function updateTestBanner() {

    if (!testOverlay) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'testBanner'; document.body.appendChild(el); }
    var changed = Object.keys(testOverlay.byId).length, added = testOverlay.extras.length;
    var srcLabel = testOverlay.kind === 'desc' ? 'the description PDF' : 'the PDF';
    el.innerHTML = '<span>PREVIEW — nothing is saved yet. Red = from ' + srcLabel + ' (' +

      '<button type="button" id="testClearBtn">Cancel</button>';

  var testGridWired = false;
  function wireTestGrid() {
    if (testGridWired) return;

    if (!grid) return;

    grid.addEventListener('change', function (e) {
      var t = e.target;
      if (!testOverlay || !t.classList || !t.classList.contains('test-edit')) return;
      var id = t.getAttribute('data-tid'), f = t.getAttribute('data-f');
      var tgt = String(id).indexOf('test-') === 0
        ? testOverlay.extras.find(function (x) { return x.id === id; })
        : testOverlay.byId[id];
      if (!tgt) return;
      if (f === 'date') tgt.date = t.value || null;
      else tgt[f] = t.value.trim();
    });
    grid.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.test-discard') : null;
      if (!btn || !testOverlay) return;

  function startPdfTest(changes, creates, kind) {
    testOverlay = { kind: kind || 'pdf', byId: {}, extras: [] };

      if (c.sizeChanged) o.size = c.newSize;
      if (c.dateChanged) o.date = c.newDate;
      testOverlay.byId[c.id] = o;

    creates.forEach(function (c, i) {
      testOverlay.extras.push({

        price: 0, size: c.size || '', description: '', sold: false, not_for_sale: false, censored: false, hue: 0,

  /* Confirmation popup, then save the (possibly hand-corrected) preview for real. */
  function openPdfApplyConfirm() {
