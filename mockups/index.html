<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Mockups · Ark's Gallery</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --paper: #f4efe6; --card: #fffdf8; --line: #e2dacb; --ink: #1a1712; --soft: #6b6459; --faint: #9a9285;
    --wine: #7a0a24; --wine-2: #b3163a; --chip: #ece5d8;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 14.5px/1.45 Archivo, "Helvetica Neue", Arial, sans-serif; padding-inline: 16px; padding-block: 18px 48px; }
  .wrap { max-width: 1400px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--wine); margin: 0 0 2px; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 650; font-size: 32px; margin: 0; letter-spacing: -.01em; }
  header a { color: var(--soft); text-decoration: none; font-weight: 600; }
  header a:hover { color: var(--ink); }
  .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  /* picker */
  .picker { padding: 14px; position: sticky; top: 12px; max-height: calc(100vh - 24px); display: flex; flex-direction: column; gap: 10px; }
  .search { position: relative; }
  .search input { width: 100%; font: inherit; font-size: 14.5px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); }
  .search input:focus, select:focus, input:focus { outline: 2px solid var(--wine-2); outline-offset: 1px; }
  .tabchips { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabchips button, .chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 600 12.5px Archivo, sans-serif; cursor: pointer; }
  .tabchips button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .list { flex: 1 1 auto; min-height: 120px; overflow-y: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: max-content; align-content: start; gap: 8px; padding-right: 2px; }
  .item { position: relative; display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; border: 2px solid transparent; border-radius: 4px; background: #e9e2d4; overflow: hidden; cursor: pointer; padding: 0; }
  .item img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .item .num { position: absolute; left: 0; bottom: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.72)); color: #fff; font: 600 10.5px "IBM Plex Mono", monospace; padding: 12px 5px 3px; text-align: left; }
  .item[aria-current="true"] { border-color: var(--wine-2); }
  .item .add { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); color: var(--ink); font: 700 15px/24px Archivo, sans-serif; text-align: center; cursor: pointer; padding: 0; }
  .item .add.on { background: var(--wine-2); color: #fff; }
  .muted { color: var(--soft); font-size: 13px; margin: 0; }
  /* work area */
  .work { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .selected { padding: 14px 16px; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: start; }
  .selected .thumb { width: 84px; height: 84px; object-fit: cover; border-radius: 4px; background: #e9e2d4; }
  .selected h2 { font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; margin: 0; }
  .selected .meta { font: 13px "IBM Plex Mono", monospace; color: var(--soft); margin: 2px 0 10px; }
  .controls { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }
  .field input[type="number"] { width: 88px; font: 500 14px "IBM Plex Mono", monospace; padding: 7px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); }
  .field select { font: inherit; padding: 7px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); }
  .check { display: flex; gap: 6px; align-items: center; font-size: 13.5px; cursor: pointer; padding-bottom: 7px; }
  .warn { color: var(--wine-2); font-size: 12.5px; margin: 6px 0 0; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 4px; padding: 8px 13px; font: 700 13.5px Archivo, sans-serif; cursor: pointer; }
  .btn:hover { border-color: var(--soft); }
  .btn.primary { background: var(--wine); border-color: var(--wine); color: #fff; }
  .btn.primary:hover { background: var(--wine-2); }
  .btn:disabled { opacity: .5; cursor: default; }
  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
  .room { overflow: hidden; }
  .room canvas { display: block; width: 100%; height: auto; cursor: grab; touch-action: none; background: #ddd5c7; }
  .room canvas.dragging { cursor: grabbing; }
  .room .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px; flex-wrap: wrap; }
  .room .bar strong { font-size: 14px; }
  .room .bar .info { font: 12px "IBM Plex Mono", monospace; color: var(--soft); }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; padding: 12px 16px; }
  .actions .left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .empty { padding: 40px 20px; text-align: center; color: var(--soft); }
  .progress { font: 13px "IBM Plex Mono", monospace; color: var(--soft); }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .picker { position: static; max-height: 420px; }
    .rooms { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Ark's Gallery · for Saatchi Art</p>
      <h1>Room Mockups</h1>
    </div>
    <a href="/">← Back to the gallery</a>
  </header>

  <div class="layout">
    <aside class="panel picker" aria-label="Choose a painting">
      <div class="search"><input id="q" type="search" placeholder="Search by name, number or size…" autocomplete="off" aria-label="Search paintings"></div>
      <div class="tabchips" id="tabchips"></div>
      <div class="list" id="list"><p class="muted">Loading your paintings…</p></div>
      <p class="muted">Click a painting to make its mockups. Tap <b>+</b> to add it to a batch.</p>
    </aside>

    <main class="work">
      <section class="panel selected" id="selected" hidden>
        <img class="thumb" id="selThumb" alt="">
        <div>
          <h2 id="selName"></h2>
          <div class="meta" id="selMeta"></div>
          <div class="controls">
            <label class="field"><span>Width cm</span><input id="wCm" type="number" min="5" max="600" step="0.5"></label>
            <label class="field"><span>Height cm</span><input id="hCm" type="number" min="5" max="600" step="0.5"></label>
            <label class="field"><span>Frame</span>
              <select id="frame">
                <option value="none">No frame</option>
                <optgroup label="Moulded frames">
                  <option value="m_white">Classic white</option>
                  <option value="m_black">Classic black</option>
                  <option value="m_gold">Gold leaf</option>
                  <option value="m_mahogany">Mahogany</option>
                </optgroup>
                <optgroup label="Simple frames">
                  <option value="black">Thin black</option>
                  <option value="float">White floater</option>
                  <option value="oak">Oak</option>
                  <option value="gold">Gold (flat)</option>
                </optgroup>
              </select>
            </label>
            <label class="field" id="frameCmField" hidden><span>Frame width cm</span><input id="frameCm" type="number" min="1" max="20" step="0.5"></label>
            <label class="check"><input id="thick" type="checkbox"> Thick canvas (4 cm)</label>
          </div>
          <p class="warn" id="sizeWarn" hidden></p>
        </div>
      </section>

      <section class="panel actions" id="actions" hidden>
        <div class="left">
          <button class="btn primary" id="dlAll" type="button">Download all mockups (ZIP)</button>
          <label class="field"><span>Image size</span>
            <select id="outSize"><option value="2400" selected>Large · 2400 px wide</option><option value="1600">Standard · 1600 px wide</option></select>
          </label>
          <label class="field"><span>View</span>
            <select id="framing"><option value="close" selected>Close-up</option><option value="medium">Medium</option><option value="full">Whole room</option></select>
          </label>
          <label class="field"><span>Shape</span>
            <select id="shape"><option value="1.3333" selected>Landscape 4:3</option><option value="0.8">Portrait 4:5</option><option value="1">Square 1:1</option><option value="room">Same as room</option></select>
          </label>
        </div>
        <div class="left">
          <span class="progress" id="batchInfo"></span>
          <button class="btn" id="dlBatch" type="button" hidden>Download batch (ZIP)</button>
          <button class="btn" id="clearBatch" type="button" hidden>Clear batch</button>
        </div>
      </section>

      <section class="rooms" id="rooms"></section>
      <section class="panel empty" id="emptyState"><p>Pick a painting on the left. It will be hung at its real size in every room.</p></section>

    </main>
  </div>
</div>

<script>
(function () {
  'use strict';
  var API = 'https://arks-gallery-images.arkoriginmacau.workers.dev';

  /* ---------- rooms ----------
     All measurements are in the room photo's own pixels (1600 px wide).
     pxcm      = pixels per centimetre on the wall
     floorY    = where the wall meets the floor
     zone      = plain wall area paintings may hang in [x0, y0, x1, y1]
     anchor    = centre of the furniture below (x) and its top edge (cm above floor)
     maxTopCm  = highest the top of a painting may go
     shadow    = direction the painting's shadow falls (from the room's light) */
  var ROOMS = [
    { key: 'foyer', name: 'Marble foyer', img: '/mockups/foyer.jpg', mask: '/mockups/foyer_mask.png', light: '/mockups/foyer_light.jpg',
      w: 1600, h: 900, pxcm: 2.15, floorY: 703, zone: [318, 72, 1295, 703], anchor: { x: 794, topCm: 72 }, maxTopCm: 280, shadow: [0, 1] },
    { key: 'living', name: 'Living room', img: '/mockups/living.jpg', mask: '/mockups/living_mask.png', light: '/mockups/living_light.jpg',
      w: 1600, h: 1001, pxcm: 2.75, floorY: 752, zone: [80, 0, 1555, 752], anchor: { x: 805, topCm: 84 }, maxTopCm: 262, shadow: [.8, .6] },
    { key: 'penthouse', name: 'Penthouse', img: '/mockups/penthouse.jpg', mask: '/mockups/penthouse_mask.png', light: '/mockups/penthouse_light.jpg',
      w: 1600, h: 900, pxcm: 2.25, floorY: 605, zone: [247, 0, 1290, 605], anchor: { x: 795, topCm: 75 }, maxTopCm: 258, shadow: [.35, .85] }
  ];
  var GAP_ABOVE_FURNITURE = 22;   // cm between furniture and the bottom of the painting
  var EYE_LEVEL = 150;            // cm from floor to the centre of the painting (museum standard)
  var FRAME_CM = { none: 0, black: 1.8, float: 3.2, oak: 3.5, gold: 5.5 };
  /* Moulded frames from photos. L/R/T/B = border width in the PNG (px); cm = default moulding width.
     They're drawn with "9-slice" scaling: corners keep their shape, the sides stretch to any size. */
  var FRAME_IMG = {
    m_white: { src: '/mockups/frame_white.png', L: 66, R: 65, T: 66, B: 65, cm: 6.5 },
    m_black: { src: '/mockups/frame_black.png', L: 75, R: 74, T: 76, B: 75, cm: 7 },
    m_gold: { src: '/mockups/frame_gold.png', L: 72, R: 70, T: 72, B: 72, cm: 7.5 },
    m_mahogany: { src: '/mockups/frame_mahogany.png', L: 71, R: 71, T: 72, B: 72, cm: 7.5 }
  };
  Object.keys(FRAME_IMG).forEach(function (k) { FRAME_CM[k] = FRAME_IMG[k].cm; loadImg(FRAME_IMG[k].src).then(function (i) { FRAME_IMG[k].img = i; if (typeof drawAll === 'function' && ui.current) drawAll(); }); });
  function frameCm(art) { return art.frame in FRAME_IMG ? (art.frameCm || FRAME_IMG[art.frame].cm) : (FRAME_CM[art.frame] || 0); }

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function imgUrl(p) { return p ? API + '/' + String(p).split('/').map(encodeURIComponent).join('/') : ''; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function loadImg(src) { return new Promise(function (res, rej) { var i = new Image(); i.onload = function () { res(i); }; i.onerror = rej; i.src = src; }); }
  function slug(s) { return String(s || 'untitled').normalize('NFKD').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-').slice(0, 40) || 'untitled'; }
  function isAdmin() {
    try { var s = JSON.parse(localStorage.getItem('arks_admin_session') || 'null'); return !!(s && s.token && s.expires_at > Date.now() / 1000); } catch (e) { return false; }
  }
  function db(table) {
    return fetch(API + '/api/db', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ table: table, op: 'select', filters: [] }) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function (b) { return b.rows || []; });
  }
  function initialNumber(n) { var m = String(n == null ? '' : n).match(/\d+/); return m ? parseInt(m[0], 10) : null; }

  /* ---------- catalogue ---------- */
  var data = { tabs: [], paintings: [], suffixes: [] };
  var ui = { tab: 'all', q: '', current: null, batch: [] };
  function tabOf(p) { return data.tabs.find(function (t) { return t.id === p.tab_id; }) || {}; }
  function catNum(p) { return (tabOf(p).prefix || '') + (p.number || ''); }

  /* "80 x 100 cm (thick)" -> { a: 80, b: 100, thick: true } */
  function parseSize(s) {
    var m = String(s || '').match(/(\d+(?:[.,]\d+)?)\s*[x×*]\s*(\d+(?:[.,]\d+)?)/i);
    if (!m) return null;
    return { a: parseFloat(m[1].replace(',', '.')), b: parseFloat(m[2].replace(',', '.')), thick: /thick/i.test(s) };
  }
  /* Width × height, turned to match the photo (a portrait photo gets the larger number as height). */
  function sizeFor(p, imgW, imgH) {
    var s = parseSize(p.size), portrait = imgH > imgW * 1.02, landscape = imgW > imgH * 1.02;
    if (!s) { var w = 50; return { w: w, h: Math.round(w * imgH / imgW * 2) / 2, thick: false, guessed: true }; }
    var w1 = s.a, h1 = s.b;
    if ((portrait && w1 > h1) || (landscape && h1 > w1)) { var t = w1; w1 = h1; h1 = t; }
    return { w: w1, h: h1, thick: s.thick, guessed: false };
  }

  function visible(p) {
    if (!p.thumb_path && !p.image_path) return false;
    if (/^\s*don['’]?t\s+exist\s*$/i.test(p.name || '')) return false;
    if (isAdmin()) return true;
    var sfx = data.suffixes.find(function (s) { return s.id === p.suffix_id; });
    return !p.censored && !(sfx && /^hidden$/i.test(sfx.label || ''));
  }
  /* same search rules as the gallery: whole words of the name, the number (no prefix needed), or a size like 40x50 */
  function matches(p, q) {
    q = q.toLowerCase().trim(); if (!q) return true;
    var terms = [];
    q = q.replace(/(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+(?:\.\d+)?)/g, function (_, a, b) { terms.push({ k: 'size', v: a + 'x' + b }); return ' '; });
    q.split(/\s+/).filter(Boolean).forEach(function (w) { terms.push(/^\d+$/.test(w) ? { k: 'num', v: parseInt(w, 10) } : { k: 'word', v: w }); });
    var words = String(p.name || 'untitled').toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean);
    var size = String(p.size || '').toLowerCase().replace(/[×*]/g, 'x').replace(/\s+/g, '');
    return terms.every(function (t) {
      if (t.k === 'size') return size.indexOf(t.v) !== -1;
      if (t.k === 'num') return initialNumber(p.number) === t.v;
      if (catNum(p).toLowerCase() === t.v) return true;
      if (/[぀-ヿ㐀-鿿]/.test(t.v)) return String(p.name || '').indexOf(t.v) !== -1;
      return words.indexOf(t.v) !== -1;
    });
  }
  function renderList() {
    var list = $('list');
    var items = data.paintings.filter(function (p) { return visible(p) && (ui.tab === 'all' || p.tab_id === ui.tab) && matches(p, ui.q); });
    items.sort(function (a, b) {
      var ta = data.tabs.indexOf(tabOf(a)), tb = data.tabs.indexOf(tabOf(b));
      if (ta !== tb) return ta - tb;
      return (initialNumber(b.number) || 0) - (initialNumber(a.number) || 0);
    });
    if (!items.length) { list.innerHTML = '<p class="muted" style="grid-column:1/-1">No paintings match.</p>'; return; }
    list.innerHTML = items.map(function (p) {
      var inBatch = ui.batch.indexOf(p.id) !== -1;
      return '<div class="item" role="button" tabindex="0" data-id="' + esc(p.id) + '"' + (ui.current && ui.current.p.id === p.id ? ' aria-current="true"' : '') + ' title="' + esc(catNum(p) + ' · ' + (p.name || 'Untitled') + (p.size ? ' · ' + p.size : '')) + '">' +
        '<img loading="lazy" src="' + esc(imgUrl(p.thumb_path || p.image_path)) + '" alt="' + esc(p.name || 'Untitled') + '">' +
        '<span class="num">' + esc(catNum(p)) + (p.size ? '' : ' · no size') + '</span>' +
        '<button class="add' + (inBatch ? ' on' : '') + '" type="button" data-batch="' + esc(p.id) + '" aria-label="' + (inBatch ? 'Remove from batch' : 'Add to batch') + '">' + (inBatch ? '✓' : '+') + '</button></div>';
    }).join('');
  }
  function renderTabs() {
    var el = $('tabchips');
    el.innerHTML = [{ id: 'all', name: 'All' }].concat(data.tabs).map(function (t) {
      return '<button type="button" data-tab="' + esc(t.id) + '" aria-pressed="' + (ui.tab === t.id) + '">' + esc(t.name) + '</button>';
    }).join('');
  }

  /* ---------- room assets ---------- */
  function prepareRoom(r) {
    return Promise.all([loadImg(r.img), loadImg(r.mask), loadImg(r.light)]).then(function (res) {
      r.base = res[0]; r.lightImg = res[2];
      // "front" layer: the parts of the photo that stand in front of the wall (plants, lamps, furniture)
      var c = document.createElement('canvas'); c.width = r.w; c.height = r.h;
      var g = c.getContext('2d');
      g.drawImage(res[1], 0, 0, r.w, r.h);
      g.globalCompositeOperation = 'source-in';
      g.drawImage(r.base, 0, 0, r.w, r.h);
      r.front = c;
    });
  }

  /* ---------- placement ---------- */
  function autoPlace(r, art) {
    var f = frameCm(art), outerW = art.w + f * 2, outerH = art.h + f * 2;
    var cy = Math.max(EYE_LEVEL, r.anchor.topCm + GAP_ABOVE_FURNITURE + outerH / 2);
    if (cy + outerH / 2 > r.maxTopCm) cy = Math.max(r.anchor.topCm + 5 + outerH / 2, r.maxTopCm - outerH / 2);
    return { x: r.anchor.x, yCm: cy };
  }
  function placementFits(r, art) {
    var f = frameCm(art), outerW = (art.w + f * 2) * r.pxcm, outerH = art.h + f * 2;
    return outerW <= (r.zone[2] - r.zone[0]) && outerH + r.anchor.topCm + 5 <= r.maxTopCm;
  }

  /* ---------- framing (crop around the painting) ----------
     Close-up: the painting fills about 42% of the picture's height; Medium about 28%.
     The painting sits a little above centre so some of the furniture below stays in view. */
  var FILL = { close: { h: .42, w: .52 }, medium: { h: .28, w: .38 } };
  function cropFor(r, art, pos) {
    var mode = $('framing').value, shapeV = $('shape').value;
    var a = shapeV === 'room' ? r.w / r.h : parseFloat(shapeV) || 4 / 3;
    if (mode === 'full') {
      var fw = r.w, fh = r.w / a; if (fh > r.h) { fh = r.h; fw = r.h * a; }
      return { x: (r.w - fw) / 2, y: (r.h - fh) / 2, w: fw, h: fh };
    }
    var f = FILL[mode] || FILL.close, fcm = frameCm(art);
    var ow = (art.w + fcm * 2) * r.pxcm, oh = (art.h + fcm * 2) * r.pxcm;
    var cx = pos.x, cy = r.floorY - pos.yCm * r.pxcm;
    var h = Math.max(oh / f.h, ow / f.w / a);
    var furnTop = r.floorY - r.anchor.topCm * r.pxcm;            // keep a slice of the sofa / console in view
    var need = (furnTop - cy) / (1 - .42 - .14);
    if (need > h) h = need;
    h = Math.min(h, r.h, r.w / a);
    var w = h * a;
    var x = clamp(cx - w / 2, 0, r.w - w), y = clamp(cy - h * .42, 0, r.h - h);
    return { x: x, y: y, w: w, h: h };
  }

  /* ---------- drawing ---------- */
  function drawMockup(ctx, r, art, pos, scale, crop) {
    crop = crop || { x: 0, y: 0 };
    ctx.save();
    ctx.setTransform(scale, 0, 0, scale, -crop.x * scale, -crop.y * scale);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(r.base, 0, 0, r.w, r.h);
    var s = r.pxcm, fcm = frameCm(art);
    var ow = (art.w + fcm * 2) * s, oh = (art.h + fcm * 2) * s;
    var cx = pos.x, cy = r.floorY - pos.yCm * s;
    var x = cx - ow / 2, y = cy - oh / 2, fw = fcm * s;
    var depth = (art.thick ? 4 : 2) + (fcm ? (art.frame in FRAME_IMG ? 3 : 1.5) : 0);      // how far it stands off the wall, in cm
    // soft shadow on the wall, falling away from the room's light
    ctx.save();
    ctx.shadowColor = 'rgba(30,20,10,.42)';
    ctx.shadowBlur = depth * s * 2.2 * scale;
    ctx.shadowOffsetX = r.shadow[0] * depth * s * .9 * scale;
    ctx.shadowOffsetY = r.shadow[1] * depth * s * .9 * scale;
    ctx.fillStyle = '#000'; ctx.fillRect(x, y, ow, oh);
    ctx.restore();
    // frame
    var ix = x + fw, iy = y + fw, iw = ow - fw * 2, ih = oh - fw * 2;
    if (art.frame === 'black') { ctx.fillStyle = '#141414'; ctx.fillRect(x, y, ow, oh); ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(x, y, ow, Math.max(1, fw * .25)); }
    if (art.frame === 'oak') {
      var go = ctx.createLinearGradient(x, y, x + ow, y + oh); go.addColorStop(0, '#caa274'); go.addColorStop(.5, '#b1875a'); go.addColorStop(1, '#9a7045');
      ctx.fillStyle = go; ctx.fillRect(x, y, ow, oh);
      ctx.strokeStyle = 'rgba(90,55,25,.22)'; ctx.lineWidth = 1;
      for (var k = 1; k < 5; k++) ctx.strokeRect(x + k * fw / 5, y + k * fw / 5, ow - 2 * k * fw / 5, oh - 2 * k * fw / 5);
    }
    if (art.frame === 'gold') {
      var gg = ctx.createLinearGradient(x, y, x + ow, y + oh);
      [[0, '#f0d58a'], [.3, '#b4872e'], [.55, '#f5e2a4'], [.8, '#9a7124'], [1, '#d8b25a']].forEach(function (st) { gg.addColorStop(st[0], st[1]); });
      ctx.fillStyle = gg; ctx.fillRect(x, y, ow, oh);
      ctx.strokeStyle = 'rgba(80,55,10,.45)'; ctx.lineWidth = Math.max(1, fw * .1);
      ctx.strokeRect(x + fw * .3, y + fw * .3, ow - fw * .6, oh - fw * .6);
      ctx.strokeRect(x + fw * .75, y + fw * .75, ow - fw * 1.5, oh - fw * 1.5);
    }
    if (art.frame === 'float') {
      ctx.fillStyle = '#f6f4ef'; ctx.fillRect(x, y, ow, oh);
      var gap = fw * .32; ctx.fillStyle = '#2a2724'; ctx.fillRect(ix - gap, iy - gap, iw + gap * 2, ih + gap * 2);
    }
    var fi = FRAME_IMG[art.frame];
    if (fi && fi.img) {                                   // 9-slice: corners keep their shape, sides stretch
      var k = fw / ((fi.L + fi.R + fi.T + fi.B) / 4);
      var bl = fi.L * k, br = fi.R * k, bt = fi.T * k, bb = fi.B * k, sw = fi.img.width, sh = fi.img.height;
      ix = x + bl; iy = y + bt; iw = ow - bl - br; ih = oh - bt - bb;
      ctx.drawImage(art.img, ix, iy, iw, ih);           // painting first; the frame's lip overlaps its edge
      var sx = [0, fi.L, sw - fi.R, sw], sy = [0, fi.T, sh - fi.B, sh];
      var dx = [x, x + bl, x + ow - br, x + ow], dy = [y, y + bt, y + oh - bb, y + oh];
      for (var yi = 0; yi < 3; yi++) for (var xi = 0; xi < 3; xi++) {
        if (xi === 1 && yi === 1) continue;             // the open middle
        var sW = sx[xi + 1] - sx[xi], sH = sy[yi + 1] - sy[yi], dW = dx[xi + 1] - dx[xi], dH = dy[yi + 1] - dy[yi];
        if (sW > 0 && sH > 0 && dW > 0 && dH > 0) ctx.drawImage(fi.img, sx[xi], sy[yi], sW, sH, dx[xi], dy[yi], dW + .5, dH + .5);
      }
    } else ctx.drawImage(art.img, ix, iy, iw, ih);
    if (art.frame === 'none') {                      // canvas edge catching the light
      ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(ix + iw - Math.max(1, s * .6), iy, Math.max(1, s * .6), ih);
      ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(ix, iy, iw, Math.max(1, s * .35));
    } else if (!fi) {
      ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(ix, iy, iw, Math.max(1, s * .7));   // frame lip shadow
    }
    // the room's own light (warm tint, window light, soft falloff) falls on the painting too
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, ow, oh); ctx.clip();
    ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .9;
    ctx.drawImage(r.lightImg, 0, 0, r.w, r.h);
    ctx.restore();
    // plants, lamps and furniture stay in front of the painting
    ctx.drawImage(r.front, 0, 0, r.w, r.h);
    ctx.restore();
    return { x: x, y: y, w: ow, h: oh };
  }

  /* ---------- current painting ---------- */
  var cards = [];
  function buildCards() {
    var wrap = $('rooms'); wrap.innerHTML = '';
    cards = ROOMS.map(function (r, i) {
      var card = document.createElement('article'); card.className = 'panel room';
      card.innerHTML = '<canvas width="' + r.w + '" height="' + r.h + '" tabindex="0" aria-label="' + esc(r.name) + ' mockup. Drag or use arrow keys to move the painting."></canvas>' +
        '<div class="bar"><strong>' + esc(r.name) + '</strong><span class="info"></span><span><button class="btn" type="button" data-reset>Reset</button> <button class="btn" type="button" data-dl>Download</button></span></div>';
      wrap.appendChild(card);
      var cv = card.querySelector('canvas');
      var c = { r: r, cv: cv, ctx: cv.getContext('2d'), info: card.querySelector('.info'), pos: null, box: null, crop: null };
      card.querySelector('[data-reset]').addEventListener('click', function () { if (ui.current) { c.pos = autoPlace(r, ui.current); c.crop = null; draw(c); } });
      card.querySelector('[data-dl]').addEventListener('click', function () { if (ui.current) exportOne(c).then(function (b) { saveBlob(b, fileName(ui.current.p, r)); }); });
      wireDrag(c);
      return c;
    });
  }
  var VIEW_W = 1000;   // on-screen canvas resolution
  function draw(c) {
    if (!ui.current || !c.r.base) return;
    if (!c.crop) c.crop = cropFor(c.r, ui.current, c.pos);      // the view stays put while you drag
    var sc = VIEW_W / c.crop.w, W = Math.round(c.crop.w * sc), H = Math.round(c.crop.h * sc);
    if (c.cv.width !== W || c.cv.height !== H) { c.cv.width = W; c.cv.height = H; }
    c.box = drawMockup(c.ctx, c.r, ui.current, c.pos, sc, c.crop);
    var bottom = c.pos.yCm - (ui.current.h / 2 + frameCm(ui.current));
    c.info.textContent = 'centre ' + Math.round(c.pos.yCm) + ' cm · bottom ' + Math.round(bottom) + ' cm';
  }
  function drawAll() { cards.forEach(draw); }
  function replaceAll() { cards.forEach(function (c) { c.pos = autoPlace(c.r, ui.current); c.crop = null; }); drawAll(); }
  $('framing').addEventListener('change', function () { cards.forEach(function (c) { c.crop = null; }); drawAll(); });
  $('shape').addEventListener('change', function () { cards.forEach(function (c) { c.crop = null; }); drawAll(); });
  function wireDrag(c) {
    var drag = null;
    function pt(e) { var rc = c.cv.getBoundingClientRect(), k = c.crop || { x: 0, y: 0, w: c.r.w, h: c.r.h }; return { x: k.x + (e.clientX - rc.left) * k.w / rc.width, y: k.y + (e.clientY - rc.top) * k.h / rc.height }; }
    c.cv.addEventListener('pointerdown', function (e) {
      if (!c.box) return; var p = pt(e), b = c.box;
      if (p.x < b.x || p.x > b.x + b.w || p.y < b.y || p.y > b.y + b.h) return;
      drag = { dx: p.x - c.pos.x, dy: p.y - (c.r.floorY - c.pos.yCm * c.r.pxcm) };
      c.cv.setPointerCapture(e.pointerId); c.cv.classList.add('dragging');
    });
    c.cv.addEventListener('pointermove', function (e) {
      if (!drag) return; var p = pt(e);
      c.pos.x = clamp(p.x - drag.dx, c.r.zone[0], c.r.zone[2]);
      c.pos.yCm = clamp((c.r.floorY - (p.y - drag.dy)) / c.r.pxcm, 20, c.r.maxTopCm);
      if (Math.abs(c.pos.x - c.r.anchor.x) < 6) c.pos.x = c.r.anchor.x;          // snap to the furniture's centre
      draw(c);
    });
    function end() { drag = null; c.cv.classList.remove('dragging'); }
    c.cv.addEventListener('pointerup', end); c.cv.addEventListener('pointercancel', end);
    c.cv.addEventListener('keydown', function (e) {
      if (!c.pos) return; var d = e.shiftKey ? 10 : 1, s = c.r.pxcm, used = true;
      if (e.key === 'ArrowLeft') c.pos.x -= d * s; else if (e.key === 'ArrowRight') c.pos.x += d * s;
      else if (e.key === 'ArrowUp') c.pos.yCm += d; else if (e.key === 'ArrowDown') c.pos.yCm -= d; else used = false;
      if (used) { e.preventDefault(); draw(c); }
    });
  }

  var loadToken = 0;
  function loadArt(p) {
    var token = ++loadToken;
    $('emptyState').hidden = true; $('selected').hidden = false; $('actions').hidden = false;
    $('selThumb').src = imgUrl(p.thumb_path || p.image_path);
    $('selName').textContent = p.name || 'Untitled';
    $('selMeta').textContent = catNum(p) + ' · ' + (tabOf(p).name || '') + (p.size ? ' · ' + p.size : ' · no size saved');
    return fetchArt(p).then(function (img) {
      if (token !== loadToken) return;
      var sz = sizeFor(p, img.width, img.height);
      ui.current = { p: p, img: img, ratio: img.height / img.width, w: sz.w, h: sz.h, thick: sz.thick, frame: $('frame').value, frameCm: ($('frame').value in FRAME_IMG) ? (parseFloat($('frameCm').value) || null) : null };
      $('wCm').value = sz.w; $('hCm').value = sz.h; $('thick').checked = sz.thick;
      showSizeWarn(sz);
      cards.forEach(function (c) { c.pos = autoPlace(c.r, ui.current); c.crop = null; });
      drawAll(); renderList();
    }).catch(function () { $('selMeta').textContent += ' · could not load the photo'; });
  }
  function fetchArt(p) {
    // fetch as a blob so the finished mockups can be saved (images drawn straight from another site would lock the canvas)
    return fetch(imgUrl(p.image_path || p.thumb_path), { mode: 'cors' }).then(function (r) { return r.blob(); }).then(function (b) { return createImageBitmap(b); });
  }
  function showSizeWarn(sz) {
    var w = $('sizeWarn'), msgs = [];
    if (sz.guessed) msgs.push('No size is saved for this piece, so 50 cm wide is a guess. Type the real size above.');
    if (ui.current) ROOMS.forEach(function (r) { if (!placementFits(r, ui.current)) msgs.push('Too big for the ' + r.name.toLowerCase() + ' wall at real size; it will overlap.'); });
    w.textContent = msgs.join(' '); w.hidden = !msgs.length;
  }
  function onSizeInput(which) {
    var a = ui.current; if (!a) return;
    var v = parseFloat($(which).value); if (!(v > 0)) return;
    if (which === 'wCm') a.w = v; else a.h = v;
    replaceAll(); showSizeWarn({ guessed: false });
  }
  $('wCm').addEventListener('input', function () { onSizeInput('wCm'); });
  $('hCm').addEventListener('input', function () { onSizeInput('hCm'); });
  function syncFrameField() {
    var v = $('frame').value, isImg = v in FRAME_IMG; $('frameCmField').hidden = !isImg;
    if (isImg) $('frameCm').value = ui.current && ui.current.frameCm ? ui.current.frameCm : FRAME_IMG[v].cm;
  }
  $('frame').addEventListener('change', function () { syncFrameField(); if (!ui.current) return; ui.current.frame = this.value; ui.current.frameCm = null; replaceAll(); });
  $('frameCm').addEventListener('input', function () { var v = parseFloat(this.value); if (!ui.current || !(v > 0)) return; ui.current.frameCm = v; replaceAll(); });
  $('thick').addEventListener('change', function () { if (!ui.current) return; ui.current.thick = this.checked; drawAll(); });

  /* ---------- export ---------- */
  function fileName(p, r) { return catNum(p).replace(/[^\w-]+/g, '-') + '_' + slug(p.name) + '_' + r.key + '.jpg'; }
  function exportOne(c, art, pos) {
    var own = !art; art = art || ui.current; pos = pos || c.pos;
    var crop = own && c.crop ? c.crop : cropFor(c.r, art, pos);
    var outW = +$('outSize').value || 2400, scale = outW / crop.w;
    var cv = document.createElement('canvas'); cv.width = Math.round(crop.w * scale); cv.height = Math.round(crop.h * scale);
    drawMockup(cv.getContext('2d'), c.r, art, pos, scale, crop);
    return new Promise(function (res) { cv.toBlob(res, 'image/jpeg', .92); });
  }
  function saveBlob(blob, name) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  $('dlAll').addEventListener('click', function () {
    if (!ui.current || !window.JSZip) return;
    var btn = this, zip = new JSZip(), p = ui.current.p; btn.disabled = true; btn.textContent = 'Making images…';
    Promise.all(cards.map(function (c) { return exportOne(c).then(function (b) { zip.file(fileName(p, c.r), b); }); }))
      .then(function () { return zip.generateAsync({ type: 'blob' }); })
      .then(function (z) { saveBlob(z, catNum(p).replace(/[^\w-]+/g, '-') + '_' + slug(p.name) + '_mockups.zip'); })
      .finally(function () { btn.disabled = false; btn.textContent = 'Download all mockups (ZIP)'; });
  });

  /* batch: auto-placed mockups for many paintings in one ZIP, one folder per painting */
  function updateBatch() {
    var n = ui.batch.length;
    $('batchInfo').textContent = n ? n + ' painting' + (n > 1 ? 's' : '') + ' in batch' : '';
    $('dlBatch').hidden = !n; $('clearBatch').hidden = !n;
    if (n && $('actions').hidden) $('actions').hidden = false;
  }
  $('clearBatch').addEventListener('click', function () { ui.batch = []; updateBatch(); renderList(); });
  $('dlBatch').addEventListener('click', function () {
    if (!window.JSZip || !ui.batch.length) return;
    var btn = this, zip = new JSZip(), ids = ui.batch.slice(), done = 0; btn.disabled = true;
    var frame = $('frame').value;
    function next(i) {
      if (i >= ids.length) return Promise.resolve();
      var p = data.paintings.find(function (x) { return x.id === ids[i]; });
      btn.textContent = 'Making ' + (i + 1) + ' of ' + ids.length + '…';
      return fetchArt(p).then(function (img) {
        var sz = sizeFor(p, img.width, img.height);
        var art = { p: p, img: img, w: sz.w, h: sz.h, thick: sz.thick, frame: frame, frameCm: (frame in FRAME_IMG) ? (parseFloat($('frameCm').value) || null) : null };
        var folder = zip.folder(catNum(p).replace(/[^\w-]+/g, '-') + '_' + slug(p.name) + (sz.guessed ? '_SIZE-GUESSED' : ''));
        return Promise.all(cards.map(function (c) { return exportOne(c, art, autoPlace(c.r, art)).then(function (b) { folder.file(fileName(p, c.r), b); }); }));
      }).catch(function () {}).then(function () { done++; return next(i + 1); });
    }
    next(0).then(function () { btn.textContent = 'Zipping…'; return zip.generateAsync({ type: 'blob' }); })
      .then(function (z) { saveBlob(z, 'arks-gallery_mockups_' + ids.length + '-paintings.zip'); })
      .finally(function () { btn.disabled = false; btn.textContent = 'Download batch (ZIP)'; });
  });

  /* ---------- events ---------- */
  var qTimer = null;
  $('q').addEventListener('input', function () { var v = this.value; clearTimeout(qTimer); qTimer = setTimeout(function () { ui.q = v; renderList(); }, 120); });
  $('tabchips').addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (!b) return; ui.tab = b.getAttribute('data-tab'); renderTabs(); renderList(); });
  function pick(el) {
    var id = el.getAttribute('data-id'), p = data.paintings.find(function (x) { return String(x.id) === id; });
    if (p) loadArt(p);
  }
  $('list').addEventListener('click', function (e) {
    var add = e.target.closest('[data-batch]');
    if (add) {
      e.stopPropagation();
      var id = add.getAttribute('data-batch'), p = data.paintings.find(function (x) { return String(x.id) === id; });
      var i = ui.batch.indexOf(p.id); if (i === -1) ui.batch.push(p.id); else ui.batch.splice(i, 1);
      updateBatch(); renderList(); return;
    }
    var it = e.target.closest('.item'); if (it) pick(it);
  });
  $('list').addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('item')) { e.preventDefault(); pick(e.target); } });

  /* ---------- start ---------- */
  buildCards();
  Promise.all(ROOMS.map(prepareRoom)).catch(function () {
    $('rooms').insertAdjacentHTML('afterbegin', '<p class="warn" style="grid-column:1/-1">The room pictures did not load. Reload the page to try again.</p>');
  }).then(function () {
    if (!ROOMS.every(function (r) { return r.base; })) return;
    if (ui.current) drawAll();
    else cards.forEach(function (c) { c.ctx.drawImage(c.r.base, 0, 0, c.r.w, c.r.h); });   // empty rooms until a painting is picked
  });
  Promise.all([db('tabs'), db('paintings'), db('suffixes')]).then(function (res) {
    data.tabs = res[0].sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    data.paintings = res[1]; data.suffixes = res[2];
    renderTabs(); renderList();
    // start with the newest painting that has a size, so the page opens working
    var first = data.paintings.filter(function (p) { return visible(p) && parseSize(p.size); })
      .sort(function (a, b) { return String(b.created_at || '').localeCompare(String(a.created_at || '')); })[0];
    if (first) loadArt(first);
  }).catch(function () { $('list').innerHTML = '<p class="muted" style="grid-column:1/-1">Could not load the catalogue. Check your connection and reload.</p>'; });
})();
</script>
</body>
</html>
